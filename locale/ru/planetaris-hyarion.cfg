[tips-and-tricks-item-description]
hyarion-refraction=[planet=hyarion] обладает уникальным способом выработки энергии.\nИспользуйте [entity=planetaris-big-refraction-ray-collector] для сбора [fluid=planetaris-refraction-light], затем передайте его через [entity=planetaris-fiber-optics-cable] в [entity=planetaris-refraction-plant].\nВ ней [item=planetaris-fluorite] и [fluid=planetaris-refraction-light] дают [fluid=planetaris-pure-light] — используйте его для выработки энергии в [entity=planetaris-refraction-generator].\nТакже можно производить [item=planetaris-charged-fluorite], чтобы перенести производство энергии преломления в любое место.
