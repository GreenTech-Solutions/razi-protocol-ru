[mod-setting-description]
nulls-k2so-expanded-alternate-recipes=Добавляет дополнительные альтернативные рецепты для промежуточных продуктов, чтобы изменения Krastorio в этих ингредиентах были более жизнеспособными на планетах с модами.
nulls-k2so-standardize-stack-sizes=Переносит философию размеров стопок K2 на другие моды. Это означает, что большинство предметов складываются в стопки по 200, а большинство машин - по 50. Изменения вместимости ракет не производятся.
nulls-k2so-crushing-industry-ratios=Изменяет переработку руды, чтобы использовать коэффициенты K2 для преобразования руды в пластины, и добавляет рецепт для обогащения дробленой руды. В результате это является нерфом до химической науки и баффом после Вулкана/Глебы, предоставляя применение для обогащения руды на протяжении большей части игры с установленным Crushing Industry.

[recipe-name]
kr-enriched-crushed-iron=Обогащенная дробленая железная руда
kr-enriched-crushed-copper=Обогащенная дробленая медная руда
processing-unit-via-aluminum=Технологический модуль через алюминий
processing-unit-via-silicon-cell=Технологический модуль через кремниевую ячейку
