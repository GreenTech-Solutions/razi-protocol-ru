[mod-setting-name]
enhanced-shadows-separate-shadows=Отделить тени от спрайтов

[mod-setting-description]
enhanced-shadows-separate-shadows=Заменяет некоторые базовые спрайты без отдельного слоя тени (например, трубы) многослойными, с передним планом и слоем тени. Улучшает работу мода Enhanced Shadows, но может вызвать проблемы совместимости.
