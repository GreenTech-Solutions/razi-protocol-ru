[tips-and-tricks-item-description]
halo-solar-halo-briefing=Ближе к солнцу позволяет собрать гораздо более эффективную солнечную энергию, но сопряжено с рисками. Соединение свободно от астероидов, но содержит [entity=halo-flare], устойчивые к обычному вооружению. Рекомендуются лазеры или электрическое оружие. Кроме того, притяжение солнца усиливается по мере приближения. Без возобновляемого источника топлива целесообразно ограничить расстояние путешествия в зависимости от запасов топлива. Соединение использует условие полёта, поэтому космические платформы могут развернуться на полпути.
halo-solar-station-briefing=Постоянная солнечная станция, построенная из фундамента станции для выживания в жаре. Космические платформы не могут выдержать поездку, поэтому станция доступна через грузовые капсулы с обратными рейсами через ракетные силосы. Станцию можно расширять фундаментом станции. Солнечные панели не производят энергию, потому что солнечная поверхность находится за платформой. Каждый фундамент станции генерирует энергию для глобальной электрической сети.
halo-compute=Некоторые объекты, такие как [entity=halo-computer], перестанут работать при перегреве. [entity=heat-pipe] можно использовать для отведения тепла к [entity=halo-heatsink], чтобы снизить температуру. После разблокировки [entity=halo-heatpump] можно использовать для концентрации тепла, позволяя использовать более высокие температуры, например, в [entity=heat-exchanger].
