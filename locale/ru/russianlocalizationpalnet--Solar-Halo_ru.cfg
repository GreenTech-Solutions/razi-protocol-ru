[technology-description]
halo-discovery-solar=Проложите путь к близкой солнечной орбите с массивным солнечным облучением. Пространство очищено от астероидов, но содержит плазменные вспышки, устойчивые к обычному вооружению. Высокая гравитация и скудные ресурсы делают маршрут несколько опасным.
halo-discovery-station=Создайте постоянную солнечную станцию для сбора энергии с помощью фундаментных блоков.
halo-compute=Позволяет исследовать с помощью продвинутых вычислений
halo-terminal=Тщательное управление позволяет зарядить электролит огромным количеством энергии. Заряженный электролит значительно менее коррозионен и может быть разлит в бочки.
halo-nav-computer=Вычисляйте точные траектории через поля обломков, чтобы уменьшить столкновения с астероидами.
halo-rocket=Используйте точные погодные и физические симуляции и электромагнитные катушки для доставки груза на космические платформы.
halo-module=С помощью продвинутой симуляции специализируйте модули под конкретную среду, удваивая их эффект на время.
halo-speed=Увеличьте скорость крафта суперкомпьютера
halo-heatsink-high=Обеспечивает продвинутое управление теплом
halo-solar=Концентрируйте солнечные лучи, чтобы увеличить количество солнечной энергии, собираемой солнечными панелями. Меняет выход энергии для всех сил, используется только высший уровень исследования среди всех активных сил.
halo-gmo=Создайте стерильное, но продуктивное растение из семян.
halo-sim=Используйте дорогие симуляции для создания науки.

