[tips-and-tricks-item-description]
halo-compute=Некоторые объекты, такие как [entity=halo-computer], перестанут работать при перегреве. [entity=heat-pipe] можно использовать для отведения тепла к [entity=halo-heatsink], чтобы снизить температуру. После разблокировки [entity=halo-heatpump] можно использовать для концентрации тепла, позволяя использовать более высокие температуры, например, в [entity=heat-exchanger].
