[entity-description]
halo-computer=Потребляет огромные количества энергии и выделяет 50 % в виде тепла. Должен работать при температуре ниже 200 °C. Маяки не влияют.
halo-terminal=Заряжает и разряжает электролит.
halo-heatpump=Перемещает тепло для достижения более высоких температур. Входная температура должна быть не менее 40 °C.
halo-heatsink=Выпускает или передаёт тепло. Один вход для низкотемпературных рецептов, другой — для высокотемпературных.
halo-thermostat=Измеряет температуру
halo-nav-computer=Использует звездные карты, чтобы избегать столкновений с астероидами
halo-flare=Большая вспышка плазмы. Устойчива к обычному вооружению.
halo-gmo=Стерильное дерево с гибридом генов юмако и желе-ореха. Производит биофлюкс.
halo-station-energy=Энергия, получаемая от солнечных панелей на нижней части станции.
halo-rocket=Электрически управляемая орбитальная доставка.

