[technology-description]
s6x-voidcraft=Создаёт предметы из пустоты, используя энергию и немного магии. Или достаточно продвинутую технологию, кто знает?
s6x-electric-voidworks=В пустотной мастерской для пустотного ремесла можно использовать электроэнергию.
s6x-void-science-pack=Позволяет исследовать искусство пустотного ремесла.
s6x-esoteric-science-pack=Позволяет исследовать более глубокие тайны пустотного ремесла.
s6x-celestial-science-pack=Позволяет исследовать отдалённые уголки вселенной с помощью пустотного ремесла.
s6x-void-science-pack-vc=Пустотное ремесло, конечно же, можно использовать для проведения экспериментов, углубляющих понимание его природы.
s6x-esoteric-science-pack-vc=Использование самого пустотного ремесла для исследования его более глубоких тайн.
s6x-celestial-science-pack-vc=Только самые мощные объекты пустотного ремесла могут сотворить этот продвинутый пакет арканологии.
s6x-entropic-conjuration=Использует хаос, присущий пустотному ремеслу, чтобы сотворить… что-то.
s6x-entropic-conjuration-adv=Призывает более мощные силы хаоса для создания ещё более экзотических субстанций.
s6x-industrial-voidcraft=Более стабильные формы пустотного ремесла для создания различных полезных промышленных продуктов.
s6x-crystal-fabrication=Алхимический процесс создания синтетических осколков пустоты и способ более надёжного их вызова из пустоты.
s6x-voidgems=Очищенные и концентрированные осколки пустоты.
s6x-voidtronics=Пустотроника, иногда даже действительно работающая.
s6x-voidtronics-advanced=Более продвинутые и сложные применения пустотроники.
s6x-voidtronics-processing=Сложные процессоры из пустотронных компонентов.
