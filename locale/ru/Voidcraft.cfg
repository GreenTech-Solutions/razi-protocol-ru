s6x-void-foundation=Позволяет создавать фундамент с помощью пустотного ремесла.
s6x-void-biocrafting=Сотворить многоклеточную жизнь очень трудно, но продвинутому пустотному ремеслу это по силам.
s6x-voidification=Вещества физического мира вполне можно насытить пустотным флюсом, хотя польза от этого сомнительна.
s6x-void-glass=Позволяет создавать стекло с помощью пустотного ремесла.
