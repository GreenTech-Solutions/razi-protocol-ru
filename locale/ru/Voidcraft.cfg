[mod-setting-description]
s6x-voidcraft-science=Позволяет напрямую создавать пакеты науки пустотным ремеслом.
s6x-voidtronics-ratio=В более ранних версиях Voidcraft использовалось соотношение 28:1, но 24:1 считается более сбалансированным.
s6x-max-vc-coherence=В старых версиях Voidcraft на рецепт допускалось 1000 единиц инфузии когерентности, но некоторым новым рецептам нужно больше, поэтому максимум поднят до 5000. Если это сломает вашу базу, верните прежнее значение.
s6x-vc-recipe-signals=Ограничивает, какие рецепты пустотного ремесла видны в окне выбора сигнала, чтобы не засорять список.
s6x-old-prismatic-carbonization=Восстанавливает устаревший рецепт «Призматическая карбонизация», если вы действительно хотите его вернуть.
s6x-old-entropic-conjuration=Восстанавливает прежние рецепты энтропийного сотворения.
s6x-old-void-rocket-parts=Восстанавливает прежний рецепт пустотных ракет.
s6x-old-prismorphing=Возвращает рецепты призморфирования из Voidcraft 2.8 и раньше.
s6x-prismorph-in-chemical-plant=Позволяет выполнять призморфирование на химическом заводе, даже если обычно нужен призмомиксер.
s6x-restore-prism-catalyze=Снова включает призматический катализ. Настройка отключается при использовании Space Age, Iridescent Industry или pHactorio и будет удалена в будущих версиях.
s6x-auto-module-categories=Пытается автоматически сформировать список категорий модулей и применить его. Может улучшить совместимость модов. Включайте только при необходимости.
s6x-no-random-rune=Не создаёт случайные побочные продукты при создании рун скорости и эффективности.
s6x-voidworks-no-scrap=Начиная с Voidcraft 2.0, рецепты пустотных заводов будут производить лом, как и большинство остальных рецептов.
s6x-no-voidcraft-in-space=Запрещает строительство зданий пустотного ремесла в космосе. Действует только с Space Age. Переопределяется, если используется Arcanyx и пустотное ремесло ограничено Arcanyx.
s6x-no-resource-depletion=Буры и насосные станции больше не истощают ресурсы. Это почти как пустотное ремесло, только из земли.
s6x-wood-raw-fish=При пустотном ремесле древесины иногда получается сырая рыба, как без Space Age.
s6x-coh-catalyst-reliability=Указывается в процентах. 100 % — катализатор всегда возвращается, как в прежних версиях.
s6x-void-pure-reliability=Указывается в процентах. 100 % — треснувший пустотный флакон никогда не выпадет случайным результатом.
s6x-primordial-voidforge-changes=Возвращает прежнюю первородную пустотную кузню: скорость 5 и возможность использования рун.
s6x-orichalcum-fragments=Включает орихалковые обломки, даже если Iridescent Industry и Scrappy Industry не используются.
s6x-make-in-foundry=Позволяет делать машины пустотного ремесла и руны в литейной.
s6x-voidforge-simple=Включает пустотный навес — простую и дешёвую машину пустотного ремесла. Раньше он был доступен только в мирах Void Block.
s6x-void-beacon-support=Определяет, требуют ли руны специальный пустотный маяк, могут ли они работать в обычном маяке или вовсе не поддерживают маяки.
s6x-vc-empowered-void-fuel=Добавляет усиленное пустотное топливо — более мощную версию пустотного топлива. Раньше было частью Arcanyx и менее полезно без него.
s6x-vc-petrochem-restore=Восстанавливает старые рецепты пустотной нефтехимии, которые были заметно сильнее других рецептов пустотного ремесла.
s6x-old-fulgoran-scrap=Восстанавливает рецепт фульгорианского металлолома, если Scrappy Industry не используется. Без Scrappy Industry настройка ни на что не влияет.

