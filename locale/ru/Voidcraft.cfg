[item-description]
s6x-voidcraft-speed-module=Увеличивает скорость пустотной мастерской, но сильно повышает энергопотребление.
s6x-voidcraft-eff-module=Снижает энергопотребление пустотной мастерской.
s6x-voidcraft-prod-module=Даёт больше продукции за цикл пустотного ремесла. Бесполезна, если у рецепта нет ингредиентов.
s6x-dangerous-eggs=Это яйцо уже начало вылупляться!
s6x-coherence-catalyst=После использования катализатор когерентности становится инертным; чтобы снова его активировать, переплавьте его в печи.
s6x-coherence-catalyst-sa=После использования катализатор когерентности становится инертным и не может быть использован 20 секунд.
s6x-coherence-catalyst-expended=Этот катализатор когерентности теперь инертен. Чтобы снова его активировать, переплавьте его в печи.
s6x-coherence-catalyst-expended-sa=Этот катализатор когерентности теперь инертен. Снова пригоден через 20 секунд.
void-pure-container-full=В этом пустотном флаконе — неоформленная пустота. Её нужно немедленно использовать или безопасно утилизировать.
void-pure-container-rupture=Этот пустотный флакон треснул и вот-вот взорвётся. Избавьтесь от него — безопасно и быстро!
gleba-wood=Это как обычная древесина, только с Глебы. Превращается в обычную древесину. Лучше не задумываться.

