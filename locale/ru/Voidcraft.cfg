[recipe-description]
void-gem=Пустотный самоцвет очень трудно огранить, и процесс часто заканчивается неудачей.
s6x-voidtronic-randomize=Попытка приспособить пустотронику, чтобы она работала как обычная электроника.
s6x-voidtronic-advanced-randomize=Попытка превратить пустотронику в более продвинутую электронику.
s6x-voidtronic-processing-randomize=Попытка превратить пустотронику в сложный процессор.
s6x-void-engine-unit-randomize=Попытка приспособить пустотный двигатель, чтобы он работал как обычный.
s6x-void-electric-engine-unit-randomize=Попытка построить совместимый электрический двигатель из пустотроники и пустотного двигателя.
s6x-void-rocket=Попытка построить рабочую ракету из деталей пустотного ремесла.
s6x-void-safe-disposal=Безопасно опустошает и восстанавливает пустотный флакон.
s6x-void-safe-disposal-rupture=Безопасная утилизация треснувшего пустотного флакона.
s6xvc-scrap=Пустотное ремесло часто создаёт случайный хлам, так что неудивительно, что его можно использовать для создания... случайного хлама.

