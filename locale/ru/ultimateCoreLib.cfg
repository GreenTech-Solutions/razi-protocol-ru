[mod-setting-description]
ultimateCoreLib_override=Эта настройка включает или отключает все скрипты этапа выполнения (control) Ultimate Fixed Mods, даже если другие настройки заданы. При отключении потери UPS не будет, и события не произойдут.
umr_show_startup_messages=Может засорять чат, используется для проверки того, что скрипты UMR пережили загрузки игры и обновления модов.
ufp_show_startup_messages=Может засорять чат, используется для проверки того, что скрипты UFP пережили загрузки игры и обновления модов.
abacayba_spawn_enemies=После исследования зловещего исследовательского пакета система будет проверять каждый чанк каждые 2 секунды и пытаться создать потомство. Создание произойдёт, только если в чанке нет построек игрока или вражеских ульев: безопасного радиуса нет. Нужно занять каждый чанк 32×32 хотя бы одной постройкой — подойдёт даже одна [entity=small-electric-pole]. Для экономии UPS проверяются только разведанные поверхности. Проверьте настройки карты, чтобы включить атаки на другие планеты.
abacayba_show_startup_messages=Может засорять чат, используется для проверки того, что скрипты Abacayba пережили загрузки игры и обновления модов.
