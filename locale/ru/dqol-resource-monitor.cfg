[dqol-resource-monitor]
ui-print-area-tool-set=Задана новая область месторождения №__1__ __2__
ui-site-area-caption=Измените область этого месторождения — например, если ресурсы перемещены в другое место. Если нужно объединить месторождения, используйте инструмент объединения. Удерживайте SHIFT (= добавить) и CTRL (= вычесть) для смены режима инструмента. Примечание: месторождения всегда включают все ресурсы в выбранных чанках карты. Внимание: это действие необратимо, кроме как через сброс данных всей поверхности.
ui-print-now-empty=Месторождение __1__ пусто, но всё ещё отслеживается — его можно архивировать месторождение!
