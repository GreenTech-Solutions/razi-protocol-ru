si-drop=Позиция выгрузки
si-drop-tooltip=[font=default-bold][color=orange]Копирует позицию выгрузки.[/color][/font]\nЕсли выбрана [color=yellow]относительная ориентация[/color], позиция при вставке автоматически поворачивается в соответствии с направлением манипулятора-получателя.
si-drop-offset=Смещение выгрузки
si-drop-offset-tooltip=[font=default-bold][color=orange]Копирует точное смещение выгрузки.[/color][/font]\nКопирует дробную позицию внутри клетки выгрузки.
si-pickup=Позиция захвата
si-pickup-tooltip=[font=default-bold][color=green]Копирует позицию захвата.[/color][/font]\nЕсли выбрана [color=yellow]относительная ориентация[/color], позиция при вставке автоматически поворачивается в соответствии с направлением манипулятора-получателя.
si-pickup-offset=Смещение захвата
si-pickup-offset-tooltip=[font=default-bold][color=green]Копирует точное смещение захвата.[/color][/font]\nКопирует дробную позицию внутри клетки захвата.
si-si-direction=Направление корпуса
si-si-direction-tooltip=[font=default-bold][color=yellow]Копирует ориентацию корпуса.[/color][/font]\nЗаставляет манипулятор-получатель смотреть в том же абсолютном направлении, что и манипулятор-источник.
si-relative-si-direction=Относительная ориентация
si-relative-si-direction-tooltip=[font=default-bold][color=yellow]Сохраняет позиции относительно основания.[/color][/font]\nЕсли флажок установлен (стандартное поведение), позиции задаются [font=default-bold]относительно основания манипулятора[/font].\nЕсли флажок снят, позиции задаются как абсолютные направления (например, если источник выгружал на север, получатель тоже будет выгружать на север независимо от направления своего основания).

