[mod-setting-description]
si-inserters-chase-belt-items=Манипуляторы следуют стандартным правилам и захватывают движущиеся предметы на конвейерах.\n[color=red][font=default-bold]Предупреждение:[/font] Это может снизить UPS. Рекомендуется: false.[/color]
si-range-adder=Управляет масштабированием дальности манипуляторов и применением настройки «Максимальная дальность манипуляторов».\n\n[font=default-bold][color=orange]«Манипулятор»[/color][/font]\nМаксимальная дальность ограничена базовой дальностью манипулятора. (Настройка максимальной дальности игнорируется.) Дальность можно уменьшить.\n\n[font=default-bold][color=orange]«Шаг»[/color][/font]\nМаксимальная дальность задаёт [color=green]добавку к дальности[/color], которая прибавляется к базовой. (Например, длинный манипулятор достаёт дальше обычного.)\n\n[font=default-bold][color=orange]«Одинаковая»[/color][/font]\nУ всех манипуляторов одинаковая максимальная дальность, заданная настройкой максимальной дальности.\n\n[font=default-bold][color=orange]«От базовой»[/color][/font]\nКак при режиме «Одинаковая», но [color=red]минимальная дальность[/color] ограничена базовой дальностью манипулятора. (Например, длинный манипулятор не может захватывать предметы с расстояния в 1 клетку.)\n\n[font=default-bold][color=orange]«Шаг от базовой»[/color][/font]\nСочетает режимы «Шаг» и «От базовой». Максимальную дальность можно увеличить, а минимальная ограничена базовой.\n\n[font=default-bold][color=orange]«Манипулятор от базовой»[/color][/font]\nДальность строго равна базовой дальности манипулятора. Её нельзя увеличить или уменьшить.
si-max-inserters-range=Задаёт абсолютную максимальную дальность любого манипулятора (1–6 клеток).\n[color=green]Рекомендуется: 3[/color]
si-disable-long-inserters=Скрывает рецепты всех стандартных длинных манипуляторов и отключает их создание.
si-directional-inserters=Манипуляторы могут захватывать предметы только с одной стороны и выгружать строго с противоположной.
si-single-line-inserters=Запрещает манипуляторам выгружать предметы по диагонали: только по прямой.
si-directional-slim-inserters=Узкие манипуляторы могут захватывать предметы только с одной стороны и выгружать строго с противоположной.
si-single-line-slim-inserters=Запрещает узким манипуляторам выгружать предметы по диагонали.
si-diagonal-technologies=Включает ветку технологий диагонали.\n[color=yellow]Примечание: без первого уровня нельзя менять позиции манипуляторов.[/color]
si-range-technologies=Включает ветку технологий дальности.\n[color=yellow]Примечание: без первого уровня нельзя менять позиции манипуляторов.[/color]
si-offset-technologies=Включает ветку технологий смещения для точной настройки.
si-offset-selector=Показывает или скрывает настройку смещения захвата и выгрузки.
si-technologies-difficulty=Задаёт множитель стоимости и сложность технологического дерева Smart Inserters.
si-disable-inserters-consumption=Полностью отключает энергопотребление всех манипуляторов.
si-swap-clicks=Меняет местами действия левой и правой кнопок мыши при настройке позиций в мире.

