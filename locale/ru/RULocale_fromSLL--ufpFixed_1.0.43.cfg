ufp_tech="Глядя на солнце и сияющие звёзды, я лишь начал постигать суть. От ионов, удерживаемых в ловушке, до раскалённой плазмы. Когда высвобождается достаточное количество энергии, она способна преодолеть любую силу отталкивания. Так проявляется E = mc²."
