[mod-setting-description]
rci-silo-recipes=Позволяет задать рецепт, используемый каждым ракетным силосом. Это значит, что новые компоненты нужны только если они требуются для данного силоса. Эта настройка не используется в режиме «Прокси‑контейнер».
rci-processing-unit=Добавляет блоки управления ракетой, создаваемые из микросхем. Эта настройка не используется в режиме «Прокси‑контейнер».
rci-low-density-structure=Добавляет секции ракетного каркаса, создаваемые из лёгкой структуры. Эта настройка не используется в режиме «Прокси‑контейнер».
rci-rocket-fuel=Добавляет гипергольный состав, создаваемый из ракетного топлива. Эта настройка не используется в режиме «Прокси‑контейнер».
