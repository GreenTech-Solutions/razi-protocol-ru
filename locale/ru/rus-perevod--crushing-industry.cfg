[mod-setting-description]
crushing-industry-space-crusher-quality=Добавляет +12,5% базового качества космическому дробителю ценой дальнейшего увеличения энергопотребления. Не имеет эффекта, если космический дробитель не включен.
crushing-industry-optical-fiber=Добавляет новый промежуточный продукт, используемый в продвинутых схемах и другой электронике.
crushing-industry-smelting-productivity=Добавляет исследования продуктивности для плавки измельченных руд и песка в слитки, а также плавления в расплавленную руду/стекло. Ничего не делает, если измельчение руды не включено.
crushing-industry-concrete-machine-ignorelist=Список машин через запятую, которые не должны мешать рецептам, ингредиенты которых для бетона преобразуются в бетонную смесь. Пробелы имеют значение; не добавляйте пробелы до/после запятых. Например: burner-assembling-machine,assembling-machine-1
