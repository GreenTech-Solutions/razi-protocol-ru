[item-description]
dream=На вкус как сахарная вата. Растворите в воде, чтобы получить жидкую грёзу.
dream-fuel=Твёрдое топливо, пропитанное грёзами. Примените надежду, чтобы достичь звёзд.
destabilized-cube-matter=Кубическое желе, менее стабильное и почти похожее на грёзу. Перерабатывается в полезные ресурсы.
ultradense-substrate=Извлекается из сверхплотной лавы и кристаллизуется с камнем; нужен для создания микрокубов.
inverted-shards=Фрагменты инвертированного микрокуба, полученные при столкновении микрокубов.
inverted-cube-jelly=Трансцендентная материя, получаемая активацией инвертированных микрокубов. Может быть переработана в серу и другие ресурсы. ОБРАЩАЙТЕСЬ С ОСТОРОЖНОСТЬЮ.
energized-microcube=Крошечная частица ультракуба. Этим инструментом можно создавать кубическое желе.

