[mod-setting-name]
enhanced-shadows-separate-shadows=Разделить тени от спрайтов
enhanced-shadows-change-planet-shadow-opacity=Изменить непрозрачность теней на других планетах

[mod-setting-description]
enhanced-shadows-separate-shadows=Заменяет некоторые базовые спрайты без отдельного слоя тени (например, трубы) на многослойные спрайты, содержащие передний план и слой тени. Улучшает внешний вид Улучшенных Теней, но может вызвать проблемы совместимости.
enhanced-shadows-change-planet-shadow-opacity=Изменяет непрозрачность теней на других планетах, чтобы лучше отражать уровень рассеяния атмосферного света, соответствующий их давлению.
