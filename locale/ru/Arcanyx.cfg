[technology-description]
planet-discovery-arcanyx=Таинственная планета, окутанная потусторонней энергией.
s6x-prismite-lava-separation=Извлечение эссенции алого призмита из лавы на Вулкане.
s6x-prismite-lightning-liquefaction=Извлечение эссенции лазурного призмита из молний на Фульгоре.
s6x-voidstone-synthesis=Пустокамень можно синтезировать, управляя его радиоактивными изотопами.
s6x-incantation=Магия Арканикса принимает множество форм, но заклинания — зачастую самая прямая и явная из них.
s6x-vulcanoforming=Позволяет производить лаву, кальцит и вольфрам на Арканиксе, а также строить литейные.

[mod-setting-name]
s6x-arcanyx-voidcraft=Пустотное ремесло только на Арканиксе
s6x-arcanyx-landfill-cost=Стоимость отсыпки территории
s6x-arcanyx-vulcanus=Маршрут Арканикс — Вулкан
s6x-arcanyx-prismite-time=Время пустотного ремесла призмитовой руды

[mod-setting-description]
s6x-arcanyx-voidcraft=Ограничить пустотное ремесло только Арканиксом, если вы хотите оставить эту механику эксклюзивной для этой планеты. Если вы включите это, рекомендуется также отключить «Мифрил необходим для ядерной энергетики».
s6x-arcanyx-incantation=Запрещает создавать заклинания где-либо, кроме Арканикса.
s6x-arcanyx-landfill-cost=Сколько камня нужно на одну отсыпку территории. Время пустотного ремесла отсыпки пропорционально этому числу.
s6x-arcanyx-vulcanus=Добавляет космический маршрут между Арканиксом и Вулканом.
s6x-arcanyx-turbo-belt=Позволяет производить турбо-конвейеры не только на Вулкане, но и на Арканиксе.
s6x-arcanyx-prismite-time=Определяет время пустотного ремесла призмитовой руды. 4 сек в стандартном пустотном ремесле, но увеличено для Арканикса, чтобы стимулировать добычу руды.
s6x-lightning-min=Минимальное магнитное поле, необходимое для постройки коллектора молний. Значение по умолчанию подходит для Фульгоры, но для совместимости с модами могут потребоваться более низкие значения.

[space-location-description]
arcanyx=Таинственная планета, окутанная потусторонней энергией.
