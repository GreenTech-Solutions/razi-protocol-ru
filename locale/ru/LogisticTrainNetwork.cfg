[mod-setting-description]
ltn-depot-fluid-cleaning=Максимальное количество жидкости на вагон, автоматически уничтожаемое при въезде в депо.\nУстановите 0, чтобы отключить, или -1, чтобы удалять всё.
ltn-depot-reset-filters=Если включено (по умолчанию):\nПри въезде в депо у грузовых вагонов сбрасываются фильтры и ограничения ячеек.
ltn-dispatcher-finish-loading=Если включено (по умолчанию):\nНе даёт поездам отъехать, пока работают помпы/манипуляторы, добавляя условие 2 секунд бездействия.\n\nЕсли выключено:\nПоезда будут отправляться немедленно по загрузке.\nМанипуляторы на станциях погрузки застрянут.
ltn-dispatcher-provider-threshold=Количество предметов/жидкости, начиная с которого станция работает как снабжающая.\nМожет переопределяться логическим сигналом на станциях снабжения.\nПо умолчанию = 1000
ltn-dispatcher-requester-threshold=Недостающее количество предметов/жидкости, при котором создаётся доставка.\nМожет переопределяться логическим сигналом на станциях запроса.\nПо умолчанию = 1000
ltn-dispatcher-requester-delivery-reset=Если выключено (по умолчанию):\nДоставка и расписание сбрасываются, когда поезд прибывает в депо.\nИзменения в поездах, стоящих на станциях запроса, не будут иметь эффекта.\n\nЕсли включено:\nДоставка и расписание сбрасываются, когда поезд разгрузился и отъехал от станции запроса.\nИзменения в поездах, стоящих на станциях запроса, отменят доставку и сбросят расписание.
ltn-dispatcher-schedule-circuit-control=Добавляет в расписание поезда условия ждать красного = 0 ИЛИ зелёного ≥ 1.\nВнимание: На всех логистических станциях потребуется включить «Отправить в поезд» и подключить логическое соединение. В противном случае поезда будут ждать команды бесконечно.\nПо умолчанию = отключено
ltn-dispatcher-updates-per-tick=Ограничивает число запросов, обновляемых за тик.\nЧем меньше число, тем выше производительность игры.
ltn-interface-console-level=Детальность игровых сообщений.\n\n0: Отключено\nСообщений не будет.\n\n1: Ошибки и предупреждения\nВыводить только ошибки и предупреждения.\n\n2: Уведомления (по умолчанию)\nВыводить базовую информацию, например, о нехватке ресурсов или формировании доставок.\n\n3: Подробные сообщения\nВыводить подробности о поиске станций снабжения и поездов.
ltn-stop-default-network=Идентификатор сети, используемый для станций без сигнала «Кодированный идентификатор сети».
ltn-interface-factorio-alerts=Показывать ошибки и предупреждения в виде предупреждений Factorio
ltn-provider-show-existing-cargo=Если включено (по умолчанию):\nГруз, который уже есть в поезде по прибытии на станцию снабжения, выводится на выход LTN.\nВключая предметы в руках манипуляторов над путями.

