[entity-description]
ufp_black_hole_entity=Расходует колоссальное количество энергии для захвата пар частица-античастица [fluid=ufp_antiproton][fluid=ufp_positron] квантового излучения из хаотичных столкновений с высокой кинетической энергией вокруг нестабильной чёрной дыры. Принимает только самый горячий поток плазмы D-HE3 [recipe=ufp_d-he3-fusion_1] [fluid=ufp_plasma-flux]; также может передавать антиматерию.
ufp_electric_boiler_entity=UFP Устройство первой фазы: превращает воду в высокотемпературную тяжёлую воду [fluid=ufp_heavy-water] и пар.
ufp_deuterium_extractor_entity=UFP Устройство первой фазы: преобразует воду и высокотемпературный пар в высокотемпературную тяжёлую воду [fluid=ufp_heavy-water] и обеднённую воду [fluid=ufp_depleted-water].
ufp_electrolyser_entity=UFP Устройство второй фазы: электролизом получает из тяжёлой воды [fluid=ufp_heavy-water] чистый дейтерий [fluid=ufp_deuterium], а из обеднённой воды [fluid=ufp_depleted-water] — тяжёлую воду [fluid=ufp_heavy-water].
ufp_plasma_heater_entity=UFP Устройство третьей фазы: нестабильный малый плазменный реактор, нагревающий газы [fluid=ufp_deuterium][fluid=ufp_d-t-mix][fluid=ufp_d-he3-mix] до температур в миллиарды градусов для запуска термоядерной реакции [fluid=ufp_d-d-plasma][fluid=ufp_d-t-plasma][fluid=ufp_he3-he3-plasma][fluid=ufp_d-he3-plasma]. Может быть разогнан [recipe=ufp_overclock] с расходованием более тяжёлых изотопов водорода [fluid=ufp_tritium][fluid=ufp_helium-3]. Имеет очень низкий риск утечки топлива и расплавления [img=technology/atomic-bomb].
ufp_gas_mixer_entity=UFP Устройство пятой фазы: смешивает газы от нейтронных реакций [fluid=ufp_deuterium][fluid=ufp_tritium][fluid=ufp_helium-3].
ufp_neutronic_reactor_entity=UFP Устройство четвёртой фазы: использует реакции синтеза D-D [recipe=ufp_d-d-fusion_1] или D-T [recipe=ufp_d-t-fusion_1] для генерации потока плазмы [fluid=ufp_plasma-flux]; принимается только плазменными приводами.
ufp_aneutronic_reactor_entity=UFP Устройство шестой фазы: использует реакции синтеза HE3-HE3 [recipe=ufp_he3-he3-fusion_1] или D-HE3 [recipe=ufp_d-he3-fusion_1] для генерации потока плазмы [fluid=ufp_plasma-flux]; принимается только плазменными приводами.
ufp_duct-small=UFP Громоздкий канал для транспортировки газов и плазмы температурой до миллиардов градусов с помощью электромагнитов. Принимается только машинами UFP.
ufp_duct-underground=UFP Громоздкий канал для транспортировки газов и плазмы температурой до миллиардов градусов с помощью электромагнитов. Принимается только машинами UFP.
ufp_duct-curve=UFP Громоздкий канал для транспортировки газов и плазмы температурой до миллиардов градусов с помощью электромагнитов. Принимается только машинами UFP.
ufp_duct-cross=UFP Громоздкий канал для транспортировки газов и плазмы температурой до миллиардов градусов с помощью электромагнитов. Принимается только машинами UFP.
ufp_duct-t-junction=UFP Громоздкий канал для транспортировки газов и плазмы температурой до миллиардов градусов с помощью электромагнитов. Принимается только машинами UFP.
ufp_4way_generator_entity=UFP Генератор, потребляющий поток плазмы [fluid=ufp_plasma-flux] для выработки электрической энергии; также может передавать поток плазмы. Максимальная эффективность: [recipe=ufp_d-t-fusion_1].
ufp_8way_generator_entity=UFP Генератор, потребляющий поток плазмы [fluid=ufp_plasma-flux] для выработки электрической энергии; также может передавать поток плазмы. Максимальная эффективность: [recipe=ufp_d-t-fusion_1].
ufp_16way_generator_entity=UFP Генератор, потребляющий поток плазмы [fluid=ufp_plasma-flux] для выработки электрической энергии; также может передавать поток плазмы. Максимальная эффективность: [recipe=ufp_d-he3-fusion_1].
ufp_a_gen_entity=UFP Генератор, потребляющий поток плазмы [fluid=ufp_plasma-flux] для выработки электрической энергии; также может передавать поток плазмы. Максимальная эффективность: [recipe=ufp_d-t-fusion_1].
ufp_b_gen_entity=UFP Генератор, потребляющий поток плазмы [fluid=ufp_plasma-flux] для выработки электрической энергии; также может передавать поток плазмы. Максимальная эффективность: [recipe=ufp_d-t-fusion_1].
ufp_c_gen_entity=UFP Генератор, потребляющий поток плазмы [fluid=ufp_plasma-flux] для выработки электрической энергии; также может передавать поток плазмы. Максимальная эффективность: [recipe=ufp_d-he3-fusion_1].
ufp_heat_divertor_entity=UFP Сепаратриса, извлекающая тепло из потока плазмы [fluid=ufp_plasma-flux], предотвращая прямой контакт удерживаемой плазмы со стенкой основной камеры. Максимальное потребление: 11,76 ГВт.
ufp_white_hole_entity=Расходует колоссальное количество энергии антиматерии [fluid=ufp_antiproton][fluid=ufp_positron] на науку и оборудование через белую дыру; также может передавать антиматерию.

