[entity-description]
RTSwitchTrainRampNoSkip=Работает как обычный трамплин для поезда без пропуска остановок, но также переключает состояние вагонов-люков, стартующих с него. Вагон-люк, переключённый таким образом, вернётся в исходное состояние после приземления.
RTItemCannon=Заряжает предметы в снаряды и почти мгновенно разгоняет их до колоссальных скоростей с помощью мощных электромагнитов и сверхпроводников. Стреляет только полными пачками. Каждый выстрел расходует весь буфер энергии — перед следующим выстрелом его нужно перезарядить. Нажмите «Взаимодействовать», чтобы включить/выключить направляющий лазер пушки.

[interact-toggling]
RampScheduleSkipOff=Сохранять пункт назначения при прыжке

[item-description]
RTAIZiplineControls=Этот контроллер может управлять электрической подвесной тележкой, направляя её к любой опоре ЛЭП в электросети. Во время движения наведите курсор на любую опору и нажмите клавишу подвесной линии, чтобы автоматически доехать туда.
RTItemShellItem=Используется для запуска пачек предметов из электромагнитной пушки для предметов.

[technology-description]
TrapdoorSignal=Если на железнодорожную станцию подаётся сигнал [virtual-signal=StationTrapdoorWagonSignal], у всех вагонов-люков на поездах, остановившихся на этой станции, люк переключится (открыт/закрыт) по прибытии и вернётся в прежнее положение при отправлении.
RTBeltRampTech=«Я верю, что могу летать»\nАнимация и графика — NikTheMimic
RTItemCannonTech=Можно использовать для переброски больших объёмов предметов через крупные водоёмы. Или через «водоёмы» из нефти.\nГрафика — NikTheMimic
RTItemCannonLogisticsTech=Перенаправляйте снаряды из электромагнитных пушек для предметов дальше обычных отскоков.\nГрафика — NikTheMimic

[mod-setting-description]
RTStreamSetting=Бросаемые предметы отображаются как игровые объекты-снаряды — это снижает нагрузку на производительность. Если отключить, предметы будут отображаться как кувыркающиеся спрайты: это веселее и не занимает слоты игровых объектов, но сильнее нагружает систему. Изменение этого параметра удалит все предметы, находящиеся в полёте.
MiningSpeedDebuffTime=После удаления объекта, который часто перекрывает другой (люки, трамплины для поездов), скорость добычи снижается на указанное время — это помогает предотвратить случайное удаление объекта, находящегося под ним.

[virtual-signal-description]
StationTrapdoorWagonSignal=Если на железнодорожную станцию подан сигнал [virtual-signal=StationTrapdoorWagonSignal], состояние «открыто/закрыто» всех вагонов-люков на поездах, остановившихся на ней, переключится при прибытии и вернётся в исходное при отправлении.

[RTmisc]
CantLoad=__1__ нельзя выстрелить — пожалуйста, сообщите об этом на странице мода.
