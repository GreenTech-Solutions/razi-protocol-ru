[item-description]
abacayba_itaverax_ore=Экзотический богатый водой минерал; после активации даёт высокоэффективные материалы.
abacayba_torbernite_ore=Богатый водой радиоактивный минерал, который можно разложить на составляющие его металлы.
itaverax-rail=Используйте, чтобы строить неразрушимые прямые рельсы вручную или через планировщик ж/д.\n__CONTROL__build__, чтобы быстро строить короткие пути.\n__CONTROL__build-ghost__, чтобы разместить длинные образы путей.
abacayba_itaverax_pentapod_egg=Дружественные ползуны, насыщенные итавераксом: не следуют за игроком, но атакуют любых врагов в радиусе действия, пока не истечёт срок их жизни.
abacayba_itaverax_sassy_wriggler_capsule=Дружественные ползуны, насыщенные итавераксом: не следуют за игроком, но атакуют любых врагов в радиусе действия, пока не истечёт срок их жизни.
abacayba_infested_personal_roboport_equipment=Заражённая дронстанция обладает всеми свойствами персональной дронстанции и, если получает питание, после каждой гибели врага сама помечает предметы на земле на снос в пределах зоны строительства. Она может даже помечать трупы, такие как [entity=abacayba-itaverax-stomper-shell], [entity=abacayba_itaverax_skull], [entity=abacayba_itaverax_cortex] и [entity=abacayba_pillar_shell].
abacayba_cyst_capsule=Жуткая капсула с вражескими кистами, из которых вырастают кошмары Абакайбы.

