[technology-description]
planet_discovery_abacayba=Живой заражённый мир, покрытый океанами враждебных местных существ, с мощными ресурсами. Высадитесь на одно из его щупалец и пробейтесь к ядру планеты. Здесь есть руины развитой цивилизации, без которых это место, похоже, не покорить: их экзотические технологии превращают богатые водой минералы в самые разные элементы и гигантские машины.
abacayba_look_for_technologies=Поиск экзотических руин. Открывает доступ к давно утерянным технологиям обработки руды.
abacayba_oozing_white_goo_tech=Текучую белую слизь можно пережечь в уголь.
abacayba_crystal_washing=Позволяет промывать кристаллические руды. Сильно гидратированные минералы при этом выделяют воду.
abacayba_crystal_kiln=Точное нагревание материалов до высоких температур для разложения, окисления или восстановления. Очищает или укрепляет материал через окисление, или готовит каталитическую поверхность. Меняет химическую природу материала.
abacayba_crystal_sedimentation=Взвешенные частицы оседают из грязной воды, медленно протекающей через бак. На дне может скопиться слой рудного осадка.
abacayba_itaverax_alloy_tech=Позволяет создавать сплав итаверакса — упрочнённый твёрдый раствор металлов, соединённых на атомном уровне.
abacayba_itaverax_coil_tech=Позволяет создавать катушку итаверакса, генерирующую чрезвычайно высокие напряжения.
abacayba_itaverax_polymer_tech=Позволяет создавать полимер итаверакса, стабильную трёхмерную сшитую сеть очень крупных молекул.
abacayba_itaverax_composite_tech=Позволяет создавать композит итаверакса, сверхтвёрдый термостойкий лист из ламинированных слоёв.
abacayba_itaverax_electromagnet_tech=Позволяет создавать электромагнит итаверакса, тип магнита, поле которого создаётся электрическим током.
abacayba_itaverax_cpu_tech=Позволяет создавать центральный процессор итаверакса, сверхбыстрый вычислитель, исполняющий инструкции в цикле: выборка, декодирование, исполнение, повтор.
abacayba_itaverax_superconductor_tech=Позволяет создавать итавераксовый сверхпроводник при комнатной температуре — сверхэкзотический материал с нулевым электрическим сопротивлением, вытесняющий магнитное поле при любой температуре.
abacayba_ominous_science_pack_tech=Продолжайте исследовать экзотическую усиливающую силу кристаллов итаверакса.
abacayba_advanced_oozing_white_goo_processing_tech=Переработка текучей белой слизи для производства руд, молока, пластмасс, серы и топлив. Улучшенное управление жидкостями.
abacayba_itaverax_ultracapacitor_tech=Экзотическое сооружение, запасающее огромное количество электрической энергии для последующего использования. Итаверакс — кристалл с огромным запасом ядерной энергии, которую можно усиливать.
itaverax_rail_tech=Рельсы из очень плотного металлического сплава, неуязвимого для физического урона.
itaverax_xenobiology_tech=Синтетическая биология, сосредоточенная на манипуляции биологическими системами с помощью сил итаверакса.
abacayba_itaverax_sassy_wriggler_capsule_tech=Непортящаяся одомашненная внеземная жизнь: не следует за игроком, но атакует любых врагов в радиусе действия.
abacayba_infested_personal_roboport_tech=Заражённая дронстанция со всеми свойствами персональной: если получает питание, сама помечает предметы на земле на снос в пределах зоны строительства.
abacayba_cyst_capsule_tech=Обратная биоинженерия кист Абакайбы, стабилизированных с помощью сил итаверакса.
abacayba_biomimetic_calcination=Точное нагревание внеземных затвердевших материалов; сложные системы органов утрачены, сохраняются лишь базовые структурные клетки.
abacayba_pure_water_calcination_tech=Термическая обработка для испарения кристаллизационной воды. При термическом разложении может образоваться кальцит.
abacayba_calcite_flotation_tech=Отделяет вольфрамовую руду от пустой породы, используя различия в поверхностной химии.
abacayba_stone_flotation_tech=Отделяет руды от пустой породы, используя различия в поверхностной химии.
abacayba_torbernite_productivity=Увеличенный выход производства торбернита.
abacayba_itaverax_productivity=Увеличенный выход производства итаверакса.
abacayba_dirty_water_sed_productivity=Увеличенный выход производства грязной воды.
abacayba_oozing_white_goo_productivity=Увеличенный выход производства текучей белой слизи.
abacayba_milk_productivity=Увеличенный выход производства молока Абакайбы.
abacayba_research_productivity=Дополнительный прогресс исследований за каждый потреблённый исследовательский пакет.
abacayba_mining_productivity=Ещё больше добычи со всех буров и нефтяных вышек.

