[mod-setting-description]
abacayba_height=Никогда не меняйте это значение в уже запущенной игре! Ваш мир-лента будет разорван. Меньшие значения = сложность будет расти экспоненциально. Чтобы изменить Абакайбу, удалите мод (прогресс на Абакайбе будет потерян), сделайте сохранение, переустановите и задайте новые настройки.
abacayba_wave=Никогда не меняйте это значение в уже запущенной игре! Ваш мир-лента будет разорван. Большие значения = сложность будет расти экспоненциально. Чтобы изменить Абакайбу, удалите мод (прогресс на Абакайбе будет потерян), сделайте сохранение, переустановите и задайте новые настройки.
