[space-location-description]
abacayba=Живой заражённый мир, покрытый океанами враждебных местных существ, с мощными ресурсами. Высадитесь на одно из его щупалец и пробейтесь к ядру планеты. Здесь есть руины развитой цивилизации, без которых это место, похоже, не покорить: их экзотические технологии превращают богатые водой минералы в самые разные элементы и гигантские машины.

[autoplace-control-names]
abacayba_itaverax_ore=Руда итаверакса
abacayba_torbernite_ore=Руда торбернита
abacayba_oozing_white_goo=Текучая белая слизь
abacayba_plants=Деревья Абакайбы
abacayba_ruins=Руины Абакайбы
abacayba_enemy_base=Вражеские базы Абакайбы

[entity-description]
abacayba_huge_mining_drill_entity=Экзотический бур размером с городской квартал, обладающий обширной добывающей зоной. Может добывать более твёрдые руды и минералы.
abacayba_rotary_trommel_entity=Экзотическая вращающаяся наклонная цилиндрическая машина. Удаляет из руды мягкие примеси водяным распылением и абразивной обработкой в барабане. Богатые водой минералы дают грязную воду.
abacayba_rotary_calciner_entity=Экзотический вращающийся наклонный цилиндр, непрерывно нагревающий сырьё до высоких температур для химического разложения, активации или восстановления использованных катализаторов, фазовых переходов или удаления влаги.
abacayba_thickener_sedimentation_entity=Экзотический вертикальный осадительный бак, в котором под действием силы тяжести взвешенные частицы непрерывно отделяются от жидкости: получаются густой шлам и осветлённая жидкость.
abacayba_itaverax_ultracapacitor_entity=Экзотический аккумуляторный блок сверхвысокой ёмкости.
abacayba-itaverax-sassy-wriggler-pentapod-premature=Дружественные ползуны, насыщенные итавераксом: не следуют за игроком, но атакуют любых врагов в радиусе действия, пока не истечёт срок их жизни.
abacayba_glowing_one_biter=Босс Абакайбы! Очень медленный, живучий боец ближнего боя с большой дальностью удара и огромной зоной поражения.
abacayba_pillar=Босс Абакайбы! Очень медленный, живучий летающий боец ближнего боя с большой дальностью удара и зоной поражения размером с континент.

