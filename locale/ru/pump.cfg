[mod-setting-name]
pump-max-beacons-per-extractor=Максимум маяков на экстрактор
pump-min-extractors-per-beacon=Минимум экстракторов на маяк
pump-preferred-beacons-per-extractor=Предпочтительное число маяков на экстрактор
[mod-setting-description]
pump-max-beacons-per-extractor=Жёсткий предел числа маяков, охватывающих один экстрактор. Поскольку эффективность дополнительных маяков снижается, настройка помогает избежать лишних затрат.
pump-min-extractors-per-beacon=Размещайте маяки там, где они действительно нужны. Если позиция маяка охватывает меньше указанного числа экстракторов, планировщик её не рассматривает.
pump-preferred-beacons-per-extractor=Прекращает планирование для экстрактора после достижения указанного числа маяков. Дополнительные маяки всё ещё могут оказаться рядом при планировании других экстракторов. Две остальные настройки маяков имеют приоритет.
[failure]
too-many-heatpipe-groups=P.U.M.P. выполнил слишком много итераций при размещении тепловых труб и прервал попытку.
[warning]
building-group-not-heated=P.U.M.P. не смог подвести тепловую трубу к группе зданий: __1__
building-not-heated=P.U.M.P. не смог подвести тепловую трубу к зданию: __1__
