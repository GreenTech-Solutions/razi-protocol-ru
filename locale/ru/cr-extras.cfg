[mod-setting-description]
cr-agricultural-tower-black=Улучшенная сельскохозяйственная башня с повышенной скоростью работы и большей площадью посадки.
cr-agricultural-tower-blue=Улучшенная сельскохозяйственная башня с повышенной скоростью работы и большей площадью посадки.
cr-arcane-ore=Добавляет арканную руду, рецепты с катализатором для каждого рецепта плит и топливо/ингредиент для некоторых машин этого мода.
cr-assembling-machine=Улучшенный сборочный автомат, который также может производить по рецептам электромагнитного завода.
cr-biochamber=Улучшенная биокамера.
cr-biolab=Улучшенная биолаборатория, которая потребляет смеси напитков (при работе) и модули толерантности (модуль только для биолаборатории, сильно повышающий скорость).
cr-bonus-armor=Особая броня в начале игры: дронстанция со 100 дронами и +200 % к скорости передвижения.
cr-bonus-inserter=Повышает минимальную скорость манипуляторов до 0.025 (для сравнения: у манипулятора 0.014, у быстрого манипулятора 0.04).
cr-bonus-robot=Повышает базовую скорость дронов в 6 раз.
cr-bonus-weapon=Пистолет-пулемёт и 200 магазинов с урановыми патронами в начале игры.
cr-fire-foundry=Улучшенная литейная, которая также может производить по рецептам печей.
cr-ice-foundry=Литейная, которая может производить по химическим и криогенным рецептам.
cr-logistic-chest=Логистические сундуки размером 2×2 с 250 ячейками инвентаря.
cr-mixing-station=Машина для приготовления смесей напитков. Смеси напитков дают бонусы при употреблении или служат топливом для биокамеры и биолаборатории.
cr-turret=Лазерная турель, которая наносит арканный урон и служит десять часов.
