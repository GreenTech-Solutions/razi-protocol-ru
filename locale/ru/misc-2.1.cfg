[mod-setting-description]
milestones_global_announcements=Если включено, этапы объявляются всем командам в командной сетевой игре.\nЕсли выключено — только вашей команде.\nБез команд не действует.
milestones_write_file_server=Если включено, время этапов дописывается в файл milestones-MAPSEED.txt в папке script-output в машиночитаемом виде.\nПишется только на выделенном сервере; в остальных случаях настройка не действует. Чтобы писать файл на своём компьютере, используйте настройку «Записывать этапы в файл (игрок)» на вкладке «Для каждого игрока».
big-solar-panel-multiplier-percent=Отношение мощности к площади у больших солнечных панелей по сравнению с обычными, в %.\nПо умолчанию: 400, раньше: 666, от 100 до 2000.
big-accumulator-multiplier-percent=Отношение ёмкости к площади у больших аккумуляторов по сравнению с обычными, в %.\nПо умолчанию: 600, раньше: 1500, от 100 до 4000.
kry-stdlib-max-entity-checks=Сколько отдельных объектов проверять за тик. Значение общее для всех модов, использующих эту функцию stdlib.\nПРИМЕЧАНИЕ: на моды, не использующие рантайм stdlib, не влияет.
[mod-setting-name]
milestones_global_announcements=Объявлять всем командам
milestones_write_file_server=Записывать этапы в файл (сервер)
big-solar-panel-multiplier-percent=Эффективность большой солнечной панели (%)
big-accumulator-multiplier-percent=Множитель большого аккумулятора (%)
kry-stdlib-max-entity-checks=Макс. проверок объектов за тик
