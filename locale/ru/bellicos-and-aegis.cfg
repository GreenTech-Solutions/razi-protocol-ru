[item-description]
low-grade-fusion-reactor=Примитивный термоядерный реактор, способный перегревать [fluid=steam] до очень высоких температур (1200°C). Температура настолько высока, что для достижения максимальной эффективности вам может потребоваться смешивать его с более холодным [fluid=steam]. Может не получать бонусы от соседства.
high-temp-steam-turbine=Паровая турбина, способная работать с более высокой температурой [fluid=steam]. Эта турбина может извлекать энергию из [fluid=steam] только до 800°C, теряя любую избыточную тепловую энергию.

