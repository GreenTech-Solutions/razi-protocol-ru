[mod-setting-description]
make-promethium-require-new-packs=Прометиевые исследовательские пакеты и бесконечная продуктивность исследований теперь требуют облегчённых и пульсарных пакетов.
make-railgun-upgrades-require-new-packs=Скорость стрельбы рельсотрона теперь требует облегчённых исследовательских пакетов.\nУрон рельсотрона — пульсарных исследовательских пакетов.
take-value-from-gleba=Продуктивность астероидов больше не требует сельскохозяйственных исследовательских пакетов с Глебы. Вместо них используются облегчённые исследовательские пакеты.
stargate-solar-power=Сколько солнечной энергии получают платформы у звёздных врат.
ae-alt-pack-sprites=Если включено, новые исследовательские пакеты будут использовать более различимые спрайты из мода Quality Glassware.\nТекущие спрайты: [img=item/space-logistic-science-pack][img=item/pulsar-science-pack]

[mod-setting-name]
take-value-from-gleba=Перенести продуктивность астероидов в Эгиду
stargate-solar-power=Ожидаемая солнечная энергия вблизи звёздных врат

[space-location-name]
aegis-warden=Точка Стража
calidus-bellicos-stargate-bellicos=Звёздные врата Белликоса

[space-location-description]
aegis-inner-edge=За поясом астероидов, но перед формирующимся аккреционным диском; это относительно спокойная зона по сравнению с путём, который нужно проделать, чтобы туда попасть.
aegis-warden=Внутри Эгиды находится массивное скопление астероидов, защищённое от ионизированных струй Белликоса гигантским бериллиновым астероидом. Пребывание здесь опасно из-за огромной плотности астероидов и нехватки солнечной энергии.
calidus-bellicos-stargate-bellicos=Технология Предтеч. Эти червоточинные врата позволяют космическим кораблям быстро перемещаться между удалёнными локациями.\nЭти врата расположены за пределами Эгиды, на безопасном расстоянии от Белликоса. Они ведут обратно на Калидус.
