[item-description]
low-grade-fusion-reactor=Примитивный термоядерный реактор, способный перегревать [fluid=steam] до очень высоких температур (1200°C). Температура настолько высока, что для достижения максимальной эффективности вам может потребоваться смешивать его с более холодным [fluid=steam]. Может не получать бонусы от соседства.
high-temp-steam-turbine=Паровая турбина, способная работать с более высокой температурой [fluid=steam]. Эта турбина может извлекать энергию из [fluid=steam] только до 800°C, теряя любую избыточную тепловую энергию.
space-beryllium-underground-pipe=Специально разработанные бериллиевые подземные трубы, которые легче прокладывать через [item=space-platform-foundation]. (Большая длина.)

[entity-description]
low-grade-fusion-reactor=Примитивный термоядерный реактор, способный перегревать [fluid=steam] до очень высоких температур (1200°C). Температура настолько высока, что для достижения максимальной эффективности вам может потребоваться смешивать его с более холодным [fluid=steam]. Может не получать бонусы от соседства.
high-temp-steam-turbine=Паровая турбина, способная работать с более высокой температурой [fluid=steam]. Эта турбина может извлекать энергию из [fluid=steam] только до 800°C, теряя любую избыточную тепловую энергию.
steam-thruster-TT=Работает только на [fluid=steam], нагретом выше 500°C
steam-thruster-TH=Работает только на [fluid=steam], нагретом до 800–1000°C

[technology-description]
the-solution=Энергия солнца в ваших руках… или на [entity=biter-spawner].
low-grade-fusion=Открывает доступ к базовому термоядерному синтезу с помощью [item=low-grade-fusion-reactor] — реактора, который потребляет фиксированное количество термоядерного топлива для нагрева [fluid=steam] и становится эффективнее при более низкой температуре входящего пара (КПД до 80% при температуре пара 15 °C), и [item=high-temp-steam-turbine] — паровой турбины, рассчитанной на более высокую температуру [fluid=steam].
high-grade-fusion-thrust=Оснастив [entity=steam-thruster-TT] внутренней системой активного охлаждения и материалами, выдерживающими более высокие температуры, можно использовать гораздо более мощное топливо [fluid=helium-thruster-fuel], которое даёт ещё бо́льшую тягу. Для работы ускорителя требуется точный контроль температуры пара в диапазоне от 800 °C до 1000 °C.
space-plateform-productivity=Повышает продуктивность производства фундамента космической платформы.
advanced-thruster-fuel-productivity=Повышает продуктивность производства тритиевого топлива для ускорителей.
nuclear-isotope-extraction-productivity=Повышает продуктивность переработки урана и извлечения трития.
tungsten-lightweight-arsenal=Использование вольфрамовой стали для наконечников бериллиевых пуль, ракет и пушечных снарядов делает их ещё мощнее, сохраняя преимущество в размере и весе.
helium-production=Если подавать энергию и очень медленно заставлять тритий сливаться с другими материалами, можно получать немного гелия.
discovery-bellicos=Вы точно определили местоположение гравитационного колодца этой системы, и это действительно оказался пульсар. Точное знание его координат позволяет «безопасно» приблизиться, чтобы собрать больше материалов; однако он окружён медленно формирующимся аккреционным диском, и сближение с ним может быстро привести к проблемам. Астероиды также могут начать двигаться непредсказуемо вблизи орбиты пульсара.\nОтправляться туда стоит только кораблям с оружием высшего уровня.
discovery-aegis-warden=Глубокое исследование Эгиды открыло доступ к Точке Стража — скоплению астероидов высокой плотности за массивным бериллиновым астероидом. Здесь много крупных бериллиновых астероидов, но Белликос почти не воздействует на эту область, поэтому здесь меньше ионизированных астероидов и доступной солнечной энергии.\nКораблям-сборщикам там нужно оружие, способное уничтожать крупные астероиды; полагаться на солнечную энергию не стоит.
discovery-aegis-outer=Вблизи орбитального пути Глебы обнаружен крупный высокотехнологичный портал, который, по всей видимости, ведёт к другому порталу далеко за пределами вашей родной звёздной системы. На той стороне находится большой пояс астероидов, частично состоящий из плотных бериллиновых астероидов, вращающихся вокруг небольшого, но очень сильного гравитационного колодца.\nКорабли, которые вы отправите туда, должны быть готовы к повышенной плотности и прочности астероидов.
discovery-aegis-inner=Даже при навигации по самым безопасным маршрутам плотность астероидов внутри пояса очень высока. Чем ближе ваш корабль к внутренней части пояса, тем меньше он защищён от ионизированных струй льда, создаваемых высокоэнергетическими импульсами объекта, который, по всей видимости, является пульсаром.\nЕсли вы попытаетесь прорваться, корабль нужно вооружить более мощными боеприпасами и лазерами для испарения ионизированного льда.
space-beryllium-logistic=Замена важных железных деталей обычных конвейеров на детали с бериллиевым покрытием и их размещение в условиях низкой гравитации позволяет конвейерам работать ещё быстрее без риска высокого износа механизмов.
lightweight-inserters=Повышенная теплоёмкость механических компонентов позволяет манипуляторам работать быстрее, однако они не могут переносить столько же груза.
lightweight-arsenal=Более лёгкие и компактные бериллиевые боеприпасы летят дальше и быстрее, сохраняя примерно ту же убойную силу, что и обычные боеприпасы.
tritium-extraction=Ионизированный лёд содержит редкие изотопы, которые могут оказаться полезными при выделении.

