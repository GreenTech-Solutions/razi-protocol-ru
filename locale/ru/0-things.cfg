[mod-setting-name]
things-setting-debug=Режим отладки
things-setting-debug-always-splice=Отладка: всегда перезаписывать чертежи при извлечении
things-setting-debug-calc-unthing-blueprints=Отладка: считать геометрию чертежей без Things
things-setting-debug-render-blueprint-bboxes=Отладка: рисовать габариты чертежей
things-setting-log-level=Уровень журнала
[mod-setting-description]
things-setting-debug=Включает режим отладки: на карте рисуется информация о состоянии Things, включается внутреннее журналирование и трассировка. Помогает найти проблемы, но снижает производительность.
things-setting-debug-always-splice=Если включено, чертежи всегда перезаписываются через set_blueprint_entities, даже если изменений, требующих перезаписи, нет. Действует, только если Things — хост совместной работы с чертежами (Cooperative Blueprinting Host).
things-setting-debug-calc-unthing-blueprints=Если включено, геометрия чертежей считается всегда, даже если в них нет Things. Помогает найти проблемы с геометрией чертежей.
things-setting-debug-render-blueprint-bboxes=Если включено, габариты чертежей рисуются на карте для отладки. Помогает найти проблемы с геометрией чертежей.
things-setting-log-level=Уровень журналирования Things.\n\n[font=default-bold]NONE[/font] — только серьёзные ошибки.\n[font=default-bold]WARN[/font] — предупреждения и ошибки.\n[font=default-bold]INFO[/font] — информационные сообщения, предупреждения и ошибки.\n[font=default-bold]DEBUG[/font] — очень подробный журнал для поиска ошибок.\n[font=default-bold]TRACE[/font] — записывается почти всё, что делает Things. [color=yellow]ВНИМАНИЕ: в режиме TRACE при строительстве в журнал могут попадать сотни сообщений, это сильно снижает производительность.[/color]
[things-commands]
doctor-command-help=Выполняет проверки Things и выводит результаты в консоль.
[things-messages]
duplicate-ghost-warning=Внимание: в мировом ключе «__1__» обнаружен дублирующийся призрак. Этот призрак уже привязан к (__2__,__3__), но что-то перепривязывает его к (__4__,__5__). Это ошибка в одном из двух модов, создавших эти призраки, или в самом Things. Сообщите об этом авторам модов.
