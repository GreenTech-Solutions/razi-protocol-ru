[item-description]
energized-microcube=Крошечная часть ультракуба, этот инструмент может создавать кубовое желе.
dormant-microcube=Куб спит. Ленивый.
inverted-microcube=Восстановленный микрокуб, способный к большему количеству трансформаций.
inverted-dormant-microcube=Время сна — лучшее время.
ultradense-substrate=Вытянутый из ультра‑плотной лавы и кристализованный камнем, полезен для создания микрокубов.
energized-shards=Фрагменты микрокуба.
inverted-shards=Фрагменты перевёрнутого микрокуба, полученные разрушением микрокубов.
cube-jelly=Трансцендентная материя, получаемая активацией микрокубов. Может быть преобразована в полезные ресурсы. На вкус как курица. 
inverted-cube-jelly=Трансцендентная материя, получаемая активацией перевёрнутых микрокубов. Может быть переработана в серу и другие ресурсы. ОБРАЩАЙТЕСЬ С ОСТОРОЖНОСТЬЮ.
destabilized-cube-matter=Кубовое желе, менее стабильное, почти как сон. Перерабатывается в полезные ресурсы.
dream=На вкус как сахарная вата. Растворите в воде, чтобы получить жидкий сон.
dream-fuel=Твёрдое топливо, пропитанное сном. Примените надежду, чтобы достичь звёзд.

