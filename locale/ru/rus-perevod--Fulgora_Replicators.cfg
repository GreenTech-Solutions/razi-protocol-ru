[mod-setting-description]
fulgora-replicators-raids=Разрешить гнёздам совершать рейды.
fulgora-replicators-nights-per-raid=Количество ночей между рейдами. День на Фульгоре длится всего 3 минуты.
fulgora-replicators-raid-range=Радиус поиска целей для налёта на острова.
fulgora-replicators-raid-intensity=Множитель количества репликантов, участвующих в рейде (по умолчанию 1/4 популяции).
fulgora-replicators-max-surface-units=Общее ограничение на количество репликантов на планете. При достижении лимита новые особи перестают создаваться.
fulgora-replicators-raid-alerts=Показывать уведомление и метку на карте при высадке рейда или вскрытии контейнеров.
fulgora-replicators-chest-theft=Тип контейнеров, которые транспортировщики вскрывают для изъятия ценных ресурсов. Контейнеры при этом не уничтожаются.

