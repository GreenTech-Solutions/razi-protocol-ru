[entity-description]
replicator-block=Отдельный строительный блок. Сам по себе безвреден, но ищет другие фрагменты для интеграции.
replicator-crawler=Краулер-сборщик. Ночью похищает ресурсы с конвейеров и подбирает то, что просыпали транспортировщики, доставляя всё в ядро для воссоздания себе подобных.
replicator-scrap=Плотное наслоение блоков под ядром. Растёт за счет потребляемых гнездом ресурсов; может быть переработан в репликационный лом.
replicator-carrier=Тяжелый транспортировщик. Вскрывает сундуки во время рейдов, рассыпая содержимое для краулеров.
replicator-core=Центральный узел гнезда. Всё, что крадёт гнездо, расширяет поле лома под ним. Уничтожение ядра приводит к распаду всей структуры острова.
replicator-crawler-spawner=Производственная ячейка краулеров. Поддерживает популяцию из восьми особей, непрерывно синтезируя новых взамен уничтоженных.
replicator-carrier-spawner=Производственная ячейка транспортировщиков. Поддерживает популяцию из двух особей.
replicator-forge=Цех по формовке блоков. Высокопрочная структура, наполненная активными репликантами.
replicator-repair-pylon=Автономный узел, медленно восстанавливающий целостность ядра и окружающих построек.
replicator-scout-ship=Группа репликантов, объединенная в малый разведывательный корабль. При уничтожении распадается на составляющие единицы.
replicator-drop-ship=Транспортный модуль для преодоления нефтяных разломов. При посадке разделяется на отряд рейдеров. При уничтожении в воздухе — гибнет весь десант.
replicator-mothership=Агрессивная форма, принимаемая рейдерами в ответ на систематическое уничтожение гнезда. Фокусируется на подавлении ваших систем обороны перед началом сбора ресурсов.
replicator-turret=Оборонительный узел, ведущий огонь фрагментами блоков по нарушителям.

