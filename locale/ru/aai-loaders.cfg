[aai-loader]
loader-name=Погрузчик (__1__)
[mod-setting-description]
aai-loaders-mode=Определяет, как работают погрузчики AAI. Рекомендуемый режим — «Со смазкой»: иначе даже при высокой цене у погрузчиков слишком много преимуществ перед манипуляторами.
aai-loaders-fit-assemblers=Увеличивает сборочные автоматы на 8 %, чтобы графика погрузчиков правильно с ними стыковалась.
