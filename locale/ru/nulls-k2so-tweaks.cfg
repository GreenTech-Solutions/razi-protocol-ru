[mod-setting-description]
nulls-k2so-expanded-alternate-recipes=Добавляет дополнительные альтернативные рецепты для промежуточных продуктов, чтобы изменения Krastorio в этих ингредиентах лучше работали на планетах из модов.
nulls-k2so-standardize-stack-sizes=Переносит подход K2 к размерам пачек на другие моды: большинство предметов складываются пачками по 200, а большинство машин — по 50. Изменения вместимости ракет не производятся.
nulls-k2so-crushing-industry-ratios=Переводит Crushing Industry на соотношения руды и плит из K2 и добавляет рецепт обогащения дроблёной руды. До химических исследовательских пакетов это ослабление, после Вулкана/Глебы — усиление, и обогащение руды полезно почти всю игру.

