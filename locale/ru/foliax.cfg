[mod-setting-description]
foliax-armor=Меха-броня с реакторами, дронстанциями и множеством ног.
foliax-bots=Базовая скорость дронов увеличена в 6 раз.
foliax-research-multiplier=Умножает стоимость исследований только для дерева технологий Фолиакса.
foliax-decoration=Удаляет декоративные элементы вокруг бетона при размещении.
foliax-biolab-quality=Качество влияет на расход исследовательских пакетов в биолабораториях Фолиакса.
foliax-start-planet=Новые игры начинаются на Фолиаксе.
foliax-enemies=Отключите, чтобы убрать врагов с Фолиакса.
foliax-winter=Погрузитесь в праздничный дух!
foliax-k2-cards=Заменяет значки исследований Фолиакса технологическими картами, если включён Krastorio 2 Spaced Out.
foliax-rain=Дождь на Фолиаксе.
foliax-fog=Туман над болотами Фолиакса.
foliax-spoilage=Создаёт растение гнили для семян, которые портятся прямо в руке манипулятора: тогда башня может принять их и выдать на выход.
foliax-fulgora-route=Космический маршрут между Фолиаксом и Фулгорой.
foliax-edge-route=Космический маршрут между Фолиаксом и краем Солнечной системы.
foliax-promethium=Включает технологии и цепочку рецептов для куска прометиевого астероида; цепочка использует большинство ресурсов Фолиакса и астероиды.

[item-description]
iron-plant-biomass=Стручки железного дерева содержат высокие концентрации железа.
copper-plant-biomass=Стручки медного дерева содержат высокие концентрации меди.
bitumen-plant-biomass=Кораллы битумных деревьев содержат высокие концентрации битума.
uranium-plant-biomass=Шипы уранового дерева содержат высокие концентрации урана.
calcite-plant-biomass=Кора мраморного дерева содержит высокие концентрации кальцита.
tungsten-plant-biomass=Кора вольфрамового дерева содержит высокие концентрации вольфрама.
obsidian-plant-biomass=Кораллы обсидианового дерева содержат высокие концентрации обсидиана.
holmium-plant-biomass=Шипы гольмиевого дерева содержат высокие концентрации гольмия.
lithium-plant-biomass=Стручки литиевого дерева содержат высокие концентрации лития.
fluorite-plant-biomass=Кораллы флюоритового дерева содержат высокие концентрации флюорита.
scrap-plant-biomass=Кора дерева «пургаментум» содержит странное вещество, которое после обработки превращается в промышленный лом.
bauxite-plant-biomass=Стручки бокситового дерева содержат много оксида алюминия.
tin-plant-biomass=Стручки оловянного дерева содержат высокие концентрации олова.
lead-plant-biomass=Стручки свинцового дерева содержат высокие концентрации свинца.
zinc-plant-biomass=Стручки цинкового дерева содержат высокие концентрации цинка.
raremetals-plant-biomass=Кора дерева Сингуларис содержит редкие металлы в разной концентрации.
imersite-plant-biomass=Шипы имерситового дерева содержат высокие концентрации имерсита.
foliax-promethium-biomass=Кора прометея пропитана кровью планеты.
foliax-arcane-cube=Арканная энергия Фолиакса пульсирует в этом кубе.
foliax-sulfur-fruit=Плод с резким запахом: сокоподобная мякоть с кристаллическим ядром.
foliax-omega-powerplant=Отойдите и полюбуйтесь этим великолепным инженерным достижением. Серьёзно, отойдите.
foliax-charged-promethium-asteroid-chunk=Сочетание астероидов и коры прометея создало новый кусок с высоким энергетическим потенциалом.
foliax-arcane-gear-wheel=Шестерня, пропитанная арканом. Похоже, она может расширяться, сжиматься и даже раздваиваться, когда нужно.
