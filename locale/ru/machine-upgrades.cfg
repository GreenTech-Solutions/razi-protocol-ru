[mod-setting-description]
mupgrade-disable=[color=255,125,0]ПРЕДУПРЕЖДЕНИЕ[/color] Отключение улучшений машин приведёт к тому, что перестанут действовать эффекты всех технологий улучшений машин (например, +10% к продуктивности сборочных автоматов). Включайте эту настройку, только если:\n1) Игра вылетает, а в журнале указано, что нужно включить эту настройку,\n2) Вы сообщили разработчику мода о вылете и ждёте исправления,\n3) И мод «Улучшения машин» нужен другому моду как зависимость.\nЭтот ручной переключатель предназначен только для экстренных случаев. По умолчанию он выключен.
