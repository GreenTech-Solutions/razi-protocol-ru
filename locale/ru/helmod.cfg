[helmod_quality-panel]
module-quality=Качество модулей
modules=Модули
quality-max=Макс. качество

[helmod_pref_settings]
display-hidden-products-mode-desc=Свёртывать продукты по абсолютному или относительному значению
ui-production-lines-menu-desc=Количество видимых строк; 0 — показывать все
combinator-item-quantity-mode-desc=Как вычисляется значение сигнала для предмета при создании постоянного комбинатора из списка входов. «Пачки»: значение × размер пачки предмета. «Количество»: значение × количество входов блока.
combinator-fluid-quantity-mode-desc=Как вычисляется значение сигнала для жидкости при создании постоянного комбинатора из списка входов. «Пачки»: значение × размер пачки жидкости. «Количество»: значение × количество входов блока.
combinator-default-item-value-desc=Множитель для каждого предмета. В режиме «Пачки» — количество пачек, в режиме «Количество» — множитель количества входов. Используйте отрицательное значение для запроса предметов (например, для логистического или поездного запроса).
combinator-default-fluid-value-desc=Множитель для каждой жидкости. В режиме «Пачки» — количество пачек, в режиме «Количество» — множитель количества входов. Используйте отрицательное значение для запроса жидкостей (например, для логистического или поездного запроса).
combinator-default-fluid-stack=Значение жидкости в комбинаторе (фиксированное)
combinator-default-fluid-stack-desc=Фиксированное значение сигнала для каждой жидкости при создании постоянного комбинатора. Используйте отрицательное значение для запроса жидкости (например, -30000).

[helmod_button]
combinator-solids=Создать постоянный комбинатор со всеми видимыми твёрдыми ресурсами на входе (кладётся в курсор)
combinator-fluids=Создать постоянный комбинатор со всеми видимыми жидкостями на входе (кладётся в курсор)
