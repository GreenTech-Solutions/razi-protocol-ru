[entity-description]
umr_interface_entity=Вход первой фазы UMR: перерабатывает большинство твёрдых и жидких видов топлива в топливную сеть UMR, требует много электроэнергии. Полная установка даёт огромное количество энергии и тепла или питает экзотические печи и сборочные автоматы — на ваш выбор!
umr_amplifier_entity=Вход второй фазы UMR: задайте рецепт, чтобы продолжить процесс. Требуется значительное количество пара при 900 °C. Может понадобиться не меньше двух усилителей. Эффективность 100%.
umr_core_entity=UMR — нестабильное ядро, вход третьей фазы. Задайте рецепт, чтобы продолжить процесс. Режимы работы: от 38,28 ГВт до 3,82 ТВт. Эффективность 100%. Очень малый риск расплавления из-за утечки топлива [img=technology/atomic-bomb].
umr_output_entity=Вход четвёртой фазы UMR: задайте рецепт, чтобы продолжить процесс. Требуется значительное количество пара при 900 °C. Может понадобиться не меньше двух выходов. Эффективность 100%.
umr_converter_entity=Финальная фаза UMR: прямая выработка электричества.
umr_converter_heat_entity=Финальная фаза UMR: тепло, юг. UMR нужно не меньше восьми тепловых преобразователей.
umr_converter_heat_2_entity=Финальная фаза UMR: тепло, север. UMR нужно не меньше восьми тепловых преобразователей.
umr_neutronic_heater_entity=UMR нагреватель для транспортируемой чистой энергии UMR.
umr_crafting_entity=Экзотический сборочный автомат UMR финальной фазы, потребляет энергию 3-й стадии напрямую из ядра.
umr_crafting_entity_2=Экзотический тяжёлый производственный комплекс UMR финальной фазы, потребляет энергию 3-й стадии напрямую из ядра; это высокоскоростной автомат, способный выдавать колоссальные объёмы продукции, даже из иных миров и за их пределами.
umr_furnace_entity=UMR: экзотическая печь финальной фазы потребляет энергию 3-й стадии напрямую из ядра.
umr_furnace_entity_2=Экзотический тяжёлый штамповочный пресс UMR финальной фазы, потребляет энергию 3-й стадии напрямую из ядра; это высокоскоростная автоматизированная печь, способная выдавать колоссальные объёмы продукции, даже из иных миров.
umr_heavyforge_entity=Экзотическая тяжёлая кузница UMR финальной фазы, потребляет энергию 3-й стадии напрямую из ядра.
umr_chemicalplant_entity=UMR: экзотический химический завод финальной фазы потребляет энергию 3-й стадии напрямую из ядра.
umr_oilrefinery_entity=UMR: экзотический нефтеперерабатывающий завод финальной фазы потребляет энергию 3-й стадии напрямую из ядра.
umr_lab_entity=UMR: экзотическая лаборатория финальной фазы потребляет энергию 3-й стадии напрямую из ядра. Может исследовать любые науки, даже из иных миров и за их пределами.
umr_lab_entity_2=Экзотический исследовательский центр UMR финальной фазы потребляет энергию 3-й стадии напрямую из ядра; это высокоскоростная лаборатория, способная исследовать колоссальные объёмы любой науки, даже из иных миров и за их пределами.
umr_robot_logistic_entity=Перемещает предметы между логистическими саркофагами.
umr_robot_construction_entity=Автоматически ставит и ремонтирует дружественные постройки.
umr_roboport_entity=Соединяется с другими дронстанциями для создания логистических сетей, используемых строительными и транспортными дронами.
umr_autocannon-turret_entity=Дальнобойная турель, стреляющая патронами.
umr_autocannon-turret45_entity=Дальнобойная турель, стреляющая патронами.
umr_heavylaser-turret_entity=Дальнобойная лазерная турель.
umr_heavylaser-turret45_entity=Дальнобойная лазерная турель.
umr_cannon-turret_entity=Дальнобойная турель, стреляющая пушечными снарядами.
umr_cannon-turret45_entity=Дальнобойная турель, стреляющая пушечными снарядами.
umr_rocket-turret_entity=Дальнобойная турель, стреляющая ракетами.
umr_rocket-turret45_entity=Дальнобойная турель, стреляющая ракетами.
umr_flamer-turret_entity=Дальнобойная турель, стреляющая чистой энергией UMR.
umr_flamer-turret45_entity=Дальнобойная турель, стреляющая чистой энергией UMR.
umr_plasma-turret_entity=Дальнобойная электрическая турель, стреляющая тактическими ядерными лучами.
umr_plasma-turret45_entity=Дальнобойная электрическая турель, стреляющая тактическими ядерными лучами.
umr_fortress_entity=Экзотическая стена UMR.
umr_active_provider_sarcophagus_entity=Отправляет своё содержимое в логистическую сеть.
umr_passive_provider_sarcophagus_entity=Делает своё содержимое доступным для логистической сети.
umr_storage_sarcophagus_entity=Долговременное хранилище для логистической сети.
umr_buffer_sarcophagus_entity=Запрашивает указанные предметы для персональной логистики и автоматизированного строительства.
umr_requester_sarcophagus_entity=Запрашивает указанные предметы из логистической сети.
umr_transport_belt_entity=Самый простой способ автоматической транспортировки предметов.
umr_underground_belt_entity=Позволяет конвейеру пересекать другие объекты или непроходимую местность, проходя под ними.
umr_splitter_entity=Объединяет или разделяет поток с конвейеров в соотношении 1:1.
umr_loader_1x1_entity=Может загружать или выгружать содержимое контейнера или машины так быстро, как успевает конвейер.
umr_locomotive=Идеальный двигатель для перемещения поездов по путям. Есть сетка снаряжения; ей нужны модули питания, экзоскелет повышает скорость состава.
umr_cargo_wagon=Позволяет перевозить предметы по рельсам. Есть сетка снаряжения; ей нужны модули питания, экзоскелет не повышает скорость состава.
umr_fluid_wagon=Позволяет перевозить жидкости по рельсам. Есть сетка снаряжения; ей нужны модули питания, экзоскелет не повышает скорость состава.
umr_quantum_teleporter_entity=Квантовые телепорты делятся своим инвентарём с другими телепортами, у которых включены те же настройки. Установите ID, отмечая галочками; телепорты с одинаковыми отметками связываются. На поверхности можно разместить только один телепорт.
umr_fire-sticker=Ожог UMR.
