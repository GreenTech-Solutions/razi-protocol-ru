[technology-description]
uranium_isotopes=Переработка урана, по-видимому, даёт небольшое количество изотопов: уран-238 и уран-235.
ske_rubia_tech=Краптонит имеет особое взаимодействие с изотопами в ионной атмосфере Разрушенной планеты. Когда изотоп плутоний-241 пропускается через изотопный колпак с краптонитом в качестве фильтра, можно извлечь берклий-248. Однако все остальные возможные изотопы теряются в переходе. Это быстрый способ перейти к калифорнию, если вас не смущает потеря ценных материалов. Кого мы обманываем? Мы и так швыряем его в небо тоннами, а запасы у нас бесконечные!
alternate_methods_of_production=Непросто доставить материалы из известной вселенной в отдалённую пустоту. Мы можем разработать новые способы воссоздания того, чего нам не хватает; ионный шторм создаёт условия, необходимые для создания того, что обычно невозможно.
chunk_slurry_creation=Поскольку дробление невозможно на поверхности планеты, нам нужен иной метод обработки ресурсов. С помощью серной кислоты мы можем разрушать астероидные куски и смешивать их, создавая суспензию их соединений. Затем эти соединения можно переработать в отдельные продукты.
ske_graphite=Графит можно получить на Разрушенной планете из местных ресурсов.
promethium_plate=Прометиевые плиты обладают сопротивлением интенсивным энергиям, подобно свинцу, и могут переносить их, умеряя. Это сильный сплав.
ske_high_density_structure=Более прочные натяжные соединения позволят создавать более надёжные машины, способные выполнять более интенсивные задачи.
ske_recipe_transformation=Так хитро названный RTG, или Рецептурный трансформационный аппарат, может использовать интенсивное излучение изотопов и бомбардировать ядра различных соединений, превращая их в то, что нам нужно для конкретных задач.
planet-discovery-skewer-shattered=Конец пути, самые дальние уголки известного космоса. Высокорадиоактивная среда, где законы физики искривляются. Ресурсов почти нет, хотя на разных поверхностях встречаются следы местных астероидных кусков. Давление слишком высоко для обычной обработки астероидов, а из-за электромагнитных помех дронами пользоваться опасно.
planet-discovery-shattered=Конец пути, самые дальние уголки известного космоса. Высокорадиоактивная среда, где законы физики искривляются. Ресурсов почти нет, хотя на разных поверхностях встречаются следы местных астероидных кусков. Давление слишком высоко для обычной обработки астероидов, а из-за электромагнитных помех дронами пользоваться опасно.
chunk_harvesting=Ресурсов на Разрушенной планете мало, но внутри различных континентов находятся остаточные куски разных астероидов. Однако условия планеты делают их обычную обработку затруднительной. С помощью серной кислоты их можно расплавить в более удобную суспензию.
isotope_working=Воплощение первозданной жемчужины требует использования различных радиоактивных изотопов. Первый из процессов — наработка плутония из урана.
s1_shattered_modules=Модули 3-го уровня невозможно изготовить на Разрушенной планете обычным способом, а доставка их из системы Наувиса через опасный перелёт обходится в огромные ресурсы. Однако высокое давление, судя по всему, позволяет использовать здесь разделённые изотопы в качестве заменителей некоторых оригинальных, более экзотических ингредиентов модулей 3-го уровня.
s1_uranium_enrichment=Уран-235 слишком важен для наших процессов, но ждать удачи при центрифугировании слишком долго, а процесс Коварекса даёт его мало. Используя некоторые другие изотопы, мы можем ещё больше обогатить уран.
s1_thorium_extraction=Следы изотопа тория найдены в прометиевой руде. Экстракция с помощью водорода может слегка увеличить запасы урана.
s1_plutonium=Дальнейшие работы по обработке изотопов.
s2_curium=Дальнейшие работы по обработке изотопов.
s2_plasma_control=До сих пор плазму термоядерного синтеза нельзя было перемещать и направлять. Если навить медные катушки на усиленный трубный каркас и выложить его изнутри прочными жаростойкими сплавами прометия, плазму можно свободно вести куда угодно. Однако из-за природы этого вещества такие трубы нельзя прокладывать под землёй.
s3_californium=Дальнейшие работы по обработке изотопов.
s4_pearl_realizer=Воплощение величайшей силы в галактике!
s2_noblegases=Благородные газы можно извлечь из следовых примесей в оксидных астероидных кусках. Они необходимы для процессов создания антиматерии, которая будет использована для воплощения первозданной жемчужины.
s2_nanometal=Нанометалл — чрезвычайно редкий металл в природе, способный выдерживать экстремальные силы, необходимые для управления космическими силами вселенной. Нанометалл понадобится для удержания самых опасных из этих сил — антиматерии. Следовые количества нанометалла встречаются в прометиевой руде.
s3_trainfuels=Полученные из работы с ураном изотопы могут быть использованы в качестве высококачественного топлива для наших транспортных средств.
noble_gas_productivity=Увеличивает производство благородных газов
water_productivity=Таяние льда даёт больше воды
skewer-promethium-science-pack=Прометиевый исследовательский пакет
s1_isotope_liquification=Теперь мы сможем плавить и хранить обычные изотопы или собирать их обратно!
s2_isotope_liquification=Теперь мы сможем плавить и хранить редкие изотопы или собирать их обратно!
