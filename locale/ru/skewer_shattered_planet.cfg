[space-location-description]
skewer_shattered_planet=Конец пути, самые дальние уголки известного космоса. Высокорадиоактивная среда, где законы физики искривляются. Ресурсов почти нет, хотя на разных поверхностях встречаются следы местных астероидных кусков. Давление слишком высоко для обычной обработки астероидов, а из-за электромагнитных помех дронами пользоваться опасно.
planet-discovery-shattered=Конец пути, самые дальние уголки известного космоса. Высокорадиоактивная среда, где законы физики искривляются. Ресурсов почти нет, хотя на разных поверхностях встречаются следы местных астероидных кусков. Давление слишком высоко для обычной обработки астероидов, а из-за электромагнитных помех дронами пользоваться опасно.
skewer_lost_beyond=Что лежит за разрушенным миром, остаётся лишь воображать. Теперь мы уходим из реальности в вымысел.

