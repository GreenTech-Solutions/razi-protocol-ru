[tips-and-tricks-item-description]
paracelsin-briefing=[planet=paracelsin] — это замёрзшая пустошь, как и [planet=aquilo], но, в отличие от мира аммиака, она имеет твёрдую поверхность. Под землёй планета скрывает большой океан [fluid=nitrogen], который вытекает на поверхность, образуя озёра [tile=nitrogen-lake]. Планета богата [item=sphalerite] и [item=tetrahedrite] (соединениями [item=zinc]), а также [entity=calcium-crystals]. [entity=cryovolcanic-vent]ы также можно найти по всей поверхности.

[technology-description]
planet-discovery-paracelsin=Высокоактивная криовулканическая замёрзшая пустошь. Поверхность покрыта озёрами [fluid=nitrogen] из подземного океана. [entity=cryovolcanic-vent]ы усеивают ландшафт наряду с жилами [item=tetrahedrite] и [item=sphalerite], необходимых для добычи [item=zinc]. В редких жилах также встречаются [item=vaterite] и [item=fluorite]. Всё, что построено на планете, должно постоянно подогреваться, иначе оно замёрзнет, а все нежелательные побочные продукты добычи цинка должны быть утилизированы.
pressure-power=Внутри замёрзшей [entity=crashed-fulgoran-pod] были обнаружены древние чертежи специального электрического генератора, использующего давление газовых источников для производства электричества. Его можно использовать для запуска колонизации Парацельсина.

[space-location-description]
paracelsin=Высокоактивная криовулканическая замёрзшая пустошь. Поверхность покрыта озёрами [fluid=nitrogen] из подземного океана. Поверхность усеяна жерлами [entity=cryovolcanic-vent] наряду с жилами [item=tetrahedrite] и [item=sphalerite], необходимых для добычи [item=zinc]. В небольших жилах также присутствует [item=vaterite]. Всё, что построено на планете, должно постоянно подогреваться, иначе оно замёрзнет, а все нежелательные побочные продукты добычи цинка должны быть утилизированы.

[entity-name]
cryovolcanic-vent=Криовулканическое жерло

[entity-description]
pressure-turbine=Электрический генератор, использующий давление газовых источников (например, [entity=sulfuric-acid-geyser]) для производства энергии, при этом извлекая жидкость медленнее, чем обычная насосная станция. Он не может заряжать аккумуляторы, и качество не влияет на её мощность.

[recipe-description]
concrete-from-calcium-sulfate=Более эффективный рецепт бетона из [item=sulfur] и [item=calcite].

[custom-tooltip]
pressure-turbine-value=5,8 МВт
