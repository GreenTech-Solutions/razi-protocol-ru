lava-spoiler=Кора Раббаски очень прочная, но её можно разрушить. Для этого нужен огромный взрыв — скорее всего, от нестабильного ядра местного хранилища, оголённого после снятия его защитных стен.\nВозьмите самое мощное оружие, чтобы оставить хоть какой-то след, и приготовьтесь к ответу на максимальном уровне глобальной тревоги.
