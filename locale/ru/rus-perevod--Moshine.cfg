[technology-description]
moshine-tech-cosmicscanner=Сканирование далекого космоса. Ответ на мощный сигнал, который он отправляет, может дать нам много данных о Вселенной и принципах её работы.
moshine-tech-cosmic-data-outsignal-creation=Когда вы в конечном итоге построите [entity=moshine_cosmicscanner], вам потребуется создать сложный сигнал с точными координатами, чтобы появилась надежда записать хоть сколько-нибудь полезных данных.
moshine-tech-cosmicscanner-construction1=Начало проекта [entity=moshine_cosmicscanner] — гигантской, энергоемкой космической мегаструктуры, которая посылает сигнальные лучи в глубокий космос и собирает [font=moshine-data][color=#8086ff]cosmos.data[/color][/font].
moshine-tech-cosmicscanner-construction1_nocolor=Начало проекта [entity=moshine_cosmicscanner] — гигантской, энергоемкой космической мегаструктуры, которая посылает сигнальные лучи в глубокий космос и собирает cosmos.data.
