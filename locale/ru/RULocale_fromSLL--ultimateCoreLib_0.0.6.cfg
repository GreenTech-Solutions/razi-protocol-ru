[ultimateCoreLib]
core_recheck_complete=Ultimate Fixed Mods Core Control: статус событий триггеров всех модулей повторно проверен.

[mod-setting-name]
ultimateCoreLib_override=Переопределение управления ядром Ultimate Fixed Mods
abacayba_spawn_enemies=[planet=abacayba] Будет атаковать чужаков и даже другие планеты[color=red]ВНИМАНИЕ![/color][img=technology/atomic-bomb]
abacayba_attack_intensity=[planet=abacayba] Частота атак
abacayba_show_startup_messages=[planet=abacayba] Выводить сообщения советника при запуске
abacayba_detailed_reporting=[planet=abacayba] Выводить подробную информацию об отслеживании заражения
abacayba-spawn-on-nauvis=[planet=abacayba] Будет атаковать [planet=nauvis]
abacayba-spawn-on-vulcanus=[planet=abacayba] Будет атаковать [planet=vulcanus]
abacayba_item_deconstructor=[planet=abacayba] Заражённый персональный робопорт-деконструктор предметов
abacayba_deconstructor_detailed_reporting=[planet=abacayba] Выводить информацию об отслеживании флота деконструкторов

[mod-setting-description]
ultimateCoreLib_override=Эта настройка включает или отключает все элементы управления этапом выполнения Ultimate Fixed Mods, даже если другие настройки заданы. При отключении потери UPS не будет, и события не произойдут.
umr_quantum_teleporter_meltdown=У этой настройки нет отдельной опции вывода сообщений, так как они практически не появляются. Отслеживает лимиты построек на каждой поверхности.
umr_show_startup_messages=Может засорять чат, используется для проверки того, что элементы управления UMR пережили загрузки игры и обновления модов.
umr_detailed_reporting=Может засорять чат при большом количестве ядер, используется в основном для отладки, чтобы проверить, всё ли работает.
ufp_show_startup_messages=Может засорять чат, используется для проверки того, что элементы управления UFP пережили загрузки игры и обновления модов.
ufp_detailed_reporting=Может засорять чат при большом количестве нагревателей, используется в основном для отладки, чтобы проверить, всё ли работает.
abacayba_spawn_enemies=После исследования зловещего научного пакета система будет проверять каждый чанк каждые 2 секунды и пытаться создать потомство. Создание произойдёт только в том случае, если в чанке нет построек игрока или вражеских гнёзд - безопасного радиуса нет. Нужно занять каждый чанк 32x32 хотя бы одной постройкой - подойдёт даже одиночный [entity=small-electric-pole]. Для экономии UPS проверяются только разведанные поверхности. Проверьте настройки карты, чтобы активировать атаки на другие планеты.
abacayba_show_startup_messages=Может засорять чат, используется для проверки того, что элементы управления Abacayba пережили загрузки игры и обновления модов.
abacayba_detailed_reporting=Очень много спама, используется в основном для отладки, чтобы проверить, всё ли работает.
abacayba_deconstructor_detailed_reporting=Практически не создаёт сообщений, полезно для отслеживания того, какие транспортные средства и игроки могут помечать предметы для деконструкции.
