[ultimateCoreLib]
core_recheck_complete=Ultimate Fixed Mods Core Control: статус событий триггеров всех модулей повторно проверен.

[mod-setting-name]
ultimateCoreLib_override=Переопределение управления ядром Ultimate Fixed Mods
abacayba_attack_intensity=[planet=abacayba] Частота атак
abacayba_show_startup_messages=[planet=abacayba] Выводить сообщения советника при запуске
abacayba_detailed_reporting=[planet=abacayba] Выводить подробную информацию об отслеживании заражения
abacayba-spawn-on-nauvis=[planet=abacayba] Будет атаковать [planet=nauvis]
abacayba-spawn-on-vulcanus=[planet=abacayba] Будет атаковать [planet=vulcanus]
abacayba_deconstructor_detailed_reporting=[planet=abacayba] Выводить информацию об отслеживании флота деконструкторов

[mod-setting-description]
umr_quantum_teleporter_meltdown=У этой настройки нет отдельной опции вывода сообщений, так как они практически не появляются. Отслеживает лимиты построек на каждой поверхности.
umr_detailed_reporting=Может засорять чат при большом количестве ядер, используется в основном для отладки, чтобы проверить, всё ли работает.
ufp_detailed_reporting=Может засорять чат при большом количестве нагревателей, используется в основном для отладки, чтобы проверить, всё ли работает.
abacayba_detailed_reporting=Очень много спама, используется в основном для отладки, чтобы проверить, всё ли работает.
abacayba_deconstructor_detailed_reporting=Практически не создаёт сообщений, полезно для отслеживания того, какие транспортные средства и игроки могут помечать предметы для деконструкции.
