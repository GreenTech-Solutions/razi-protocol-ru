[mod-setting-description]
crushing-industry-space-crusher-quality=Добавляет космической дробилке +12,5% базового качества ценой дополнительного энергопотребления. Не действует, если космическая дробилка не включена.
crushing-industry-smelting-productivity=Добавляет исследования продуктивности при плавке дроблёной руды и песка в плиты, а также при плавлении в расплавленную руду/стекло. Не действует, если дробление руды не включено.
crushing-industry-concrete-machine-ignorelist=Список машин через запятую, чьи рецепты не мешают заменять бетон в ингредиентах на бетонную смесь. Пробелы имеют значение; не добавляйте пробелы до и после запятых. Например: burner-assembling-machine,assembling-machine-1
