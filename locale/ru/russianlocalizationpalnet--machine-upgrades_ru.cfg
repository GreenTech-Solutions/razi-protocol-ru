[mod-setting-description]
mupgrade-disable=[color=255,125,0]ПРЕДУПРЕЖДЕНИЕ[/color] Отключение улучшений машин приведет к тому, что все эффекты технологий улучшений машин (например, +10% продуктивности сборщиков) перестанут работать. Используйте это только если:\n1) Игра вылетает, и в логе вылета указано, что нужно включить эту настройку,\n2) Вы уже сообщили о вылете соответствующему разработчику мода и ждете исправления,\n3) И «Улучшения машин» являются зависимостью другого мода.\nЭтот ручной переключатель предназначен только для экстренных случаев. По умолчанию выключен.
