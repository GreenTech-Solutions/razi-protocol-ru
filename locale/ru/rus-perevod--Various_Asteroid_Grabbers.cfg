[item-description]
eel-asteroid-collector=Собирает малые астероиды. Обладает гораздо большим радиусом действия, чем обычный сборщик, но работает намного медленнее. Качество улучшает размер захвата, радиус действия и скорость.
octopus-asteroid-collector=Собирает малые астероиды. Имеет меньший радиус действия, чем обычный сборщик, но оснащен восемью манипуляторами. Качество значительно увеличивает радиус действия и скорость.

