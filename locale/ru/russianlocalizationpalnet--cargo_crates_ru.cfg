[technology-name]
cargo-crates=Грузовые ящики

[technology-description]
cargo-crates=Открывает одноразовые деревянные грузовые ящики, позволяющие плотно упаковывать предметы для транспортировки и распаковывать их при необходимости. Благодаря компактной упаковке предметы в ящиках занимают только 50 % их обычной грузоподъёмности ракеты.
TFMG-cargo-crates=Рассмотрите более эффективный способ упаковки предметов.

