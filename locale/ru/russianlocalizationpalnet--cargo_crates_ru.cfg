[mod-setting-description]
cargo-crates-pack-ammo=Разрешить упаковывать боеприпасы в ящики. Отключение этой настройки уменьшит количество генерируемых предметов и рецептов
cargo-crates-pack-equipment=Разрешить упаковывать оборудование в ящики. Отключение этой настройки уменьшит количество генерируемых предметов и рецептов
cargo-crates-pack-spoilables=Разрешить упаковывать портящиеся предметы в ящики. Отключение этой настройки уменьшит количество генерируемых предметов и рецептов
cargo-crates-pack-capsules=Разрешить упаковывать предметы типа капсулы в ящики. Отключение этой настройки уменьшит количество генерируемых предметов и рецептов. \nСтоит упомянуть: съедобные предметы являются капсулами
