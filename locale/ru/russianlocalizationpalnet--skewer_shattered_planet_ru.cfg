[technology-description]
uranium_isotopes=Переработка урана, по-видимому, даёт небольшие изотопы в виде урана‑238 и урана‑235.
ske_rubia_tech=Краптонит имеет особое взаимодействие с изотопами в ионной атмосфере Разбитой планеты. Когда изотоп плутоний‑241 пропускается через клочу изотопов с краптонитом в качестве фильтра, можно извлечь берклий‑248. Однако все остальные возможные изотопы теряются в переходе. Это быстрый способ перейти к калифорнию, если вас не смущает потеря ценных материалов. Кому мы врут? Мы бросаем его в небо, как древесину, а у нас их бесконечно много!
alternate_methods_of_production=Не просто доставить материалы из известной вселенной в отдалённую пустоту. Мы можем разработать новые способы воссоздания того, чего нам не хватает; ионный шторм создаёт условия, необходимые для создания того, что обычно невозможно.
chunk_slurry_creation=Поскольку дробление невозможно на поверхности планеты, нам нужен иной метод обработки ресурсов. С помощью серной кислоты мы можем разрушать астероидные куски и смешивать их, создавая суспензию их соединений. Эти соединения затем могут быть дальнейше переработаны в отдельные продукты.
ske_graphite=Графит можно получить на разбитой планете из местных ресурсов.
promethium_plate=Прометиевые листы обладают сопротивлением интенсивным энергиям, подобно свинцу, и могут переносить их, умеряя. Это сильный сплав.
ske_high_density_structure=Более прочные натяжные соединения позволят создавать более надёжные машины, способные выполнять более интенсивные задачи.
ske_recipe_transformation=Так хитро названный RTG, или Рецептурный трансформационный аппарат, может использовать интенсивное излучение изотопов и бомбардировать ядра различных соединений, превращая их в то, что нам нужно для конкретных задач.
planet-discovery-skewer-shattered=Конец, самые отдалённые пределы известного за пределами. Высокорадиоактивная среда, где законы физики искривляются. Ресурсов почти нет, хотя на разных поверхностях встречаются следы местных астероидных кусков. Давление слишком высоко для обычной обработки астероидов, а электромагнетика делает использование роботов опасным.
planet-discovery-shattered=Конец, самые отдалённые пределы известного за пределами. Высокорадиоактивная среда, где законы физики искривляются. Ресурсов почти нет, хотя на разных поверхностях встречаются следы местных астероидных кусков. Давление слишком высоко для обычной обработки астероидов, а электромагнетика делает использование роботов опасным.
chunk_harvesting=Ресурсов на Разбитой планете мало, но внутри различных континентов находятся остаточные куски разных астероидов. Однако условия планеты делают их обычную обработку затруднительной. С помощью серной кислоты их можно расплавить в более удобную суспензию.
isotope_working=Манифестация первичной жемчужины требует использования различных радиоактивных изотопов. Первый из процессов требует выведения урана в следующий этап — плутоний.
s1_shattered_modules=Модули 3‑го уровня невозможно изготовить на Разбитой планете обычным способом, а импортировать их из солнечной системы Наувиса требует огромных ресурсов для транспортировки через опасный путь. Однако интенсивное давление позволяет использовать здесь разделённые изотопы в качестве заменителей некоторых оригинальных, более экзотических ингредиентов модулей 3‑го уровня.
s1_uranium_enrichment=Уран‑235 слишком важен для наших процессов, но полагаться на шанс получения его при центрифугировании слишком долго, а коварекс не даёт достаточного количества. Используя некоторые другие изотопы, мы можем ещё больше обогатить уран.
s1_thorium_extraction=Следы изотопа тория найдены в прометиевой руде. Экстракция с помощью водорода может слегка увеличить запасы урана.
s1_plutonium=Дальнейшие работы по обработке изотопов.
s2_curium=Дальнейшие работы по обработке изотопов.
s2_plasma_control=Плазма от реакций термоядерного синтеза обычно не могла быть перемещена или управляемая, пока не появились медные катушки вокруг усиленного трубопроводного каркаса, выложенного внутренностей прочными, жаростойкими сплавами прометия, позволяющими свободно перемещать плазму. Однако из‑за природы управляемого элемента трубы нельзя размещать под землёй.
s3_californium=Дальнейшие работы по обработке изотопов.
s4_pearl_realizer=Манифестация самой сильной силы в галактике!
s2_noblegases=Благородные газы можно извлечь из следовых примесей в оксидных астероидных кусках. Они необходимы для процессов создания антиматерии, которая будет использована для манифестации первичной жемчужины.
s2_nanometal=Нанометалл — чрезвычайно редкий металл в природе, способный выдерживать экстремальные силы, необходимые для управления космическими силами вселенной. Нанометалл понадобится для удержания самых опасных из этих сил — антиматерии. Следовые количества нанометалла встречаются в прометиевой руде.
s3_trainfuels=Полученные из работы с ураном изотопы могут быть использованы в качестве высококачественного топлива для наших транспортных средств.
noble_gas_productivity=Увеличить производство благородных газов
water_productivity=Таяние льда даёт больше воды
