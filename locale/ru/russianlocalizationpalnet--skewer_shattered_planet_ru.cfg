[space-location-description]
skewer_shattered_planet=Конец, самые отдалённые пределы известного за пределами. Высокорадиоактивная среда, где законы физики искривляются. Ресурсов почти нет, хотя на разных поверхностях встречаются следы местных астероидных кусков. Давление слишком высоко для обычной обработки астероидов, а электромагнетика делает использование роботов опасным.
planet-discovery-shattered=Конец, самые отдалённые пределы известного за пределами. Высокорадиоактивная среда, где законы физики искривляются. Ресурсов почти нет, хотя на разных поверхностях встречаются следы местных астероидных кусков. Давление слишком высоко для обычной обработки астероидов, а электромагнетика делает использование роботов опасным.
skewer_lost_beyond=То, что лежит впереди разбитого мира, оставлено воображению. Мы теперь отправляемся из реальности в вымысел.

