[tips-and-tricks-item-description]
halo-solar-halo-briefing=Приближение к солнцу позволяет собирать солнечную энергию гораздо эффективнее, но сопряжено с рисками. На маршруте нет астероидов, но встречаются [entity=halo-flare], устойчивые к обычному оружию. Рекомендуется использовать лазерное или электрическое оружие. Чем ближе к солнцу, тем сильнее его притяжение. Без возобновляемого источника топлива стоит ограничить расстояние полёта запасом топлива. Маршрут задаётся условием полёта, поэтому космические платформы могут развернуться на полпути.
halo-solar-station-briefing=Постоянную солнечную станцию строят из фундамента станции, устойчивого к жаре. Космические платформы не выдержат путь, поэтому грузы доставляют капсулами; обратные рейсы выполняют ракетными шахтами. Станцию можно расширять фундаментом станции. Солнечные панели не вырабатывают энергию, потому что солнечная поверхность находится за платформой. Каждый элемент фундамента станции вырабатывает энергию для общей электрической сети.
