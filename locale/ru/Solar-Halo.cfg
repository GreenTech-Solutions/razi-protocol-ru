[technology-description]
halo-discovery-solar=Проложите путь к околосолнечной орбите с мощным солнечным излучением. Астероидов там нет, но встречаются плазменные вспышки, устойчивые к обычному оружию. Высокая гравитация и скудные ресурсы делают маршрут довольно опасным. Платформа доберётся туда только по маршруту через уже открытые локации. При стандартной раскладке он проходит через Вулкан.
halo-rocket=Используйте точные симуляции погоды и физики и электромагнитные катушки для доставки груза на космические платформы. Маяки не действуют.
halo-solar=Концентрируйте солнечные лучи, чтобы увеличить количество солнечной энергии, собираемой солнечными панелями. Исследование влияет на мощность для всех сторон; учитывается только высший уровень исследования среди всех активных сторон.

