halo-gmo=Стерильное дерево с гибридом генов юмако и желеореха. Производит биофлюс.
halo-terminal=Заряжает и разряжает электролит. Для зарядки берёт только избыточную энергию, до 500 МВт.
halo-heatsink=Сбрасывает или передаёт тепло. Низкотемпературным рецептам нужно 160 °C, высокотемпературным — 800 °C.
halo-rocket=Орбитальная доставка на электрической тяге. Маяки не действуют.
halo-nav-computer=Использует звёздные карты, чтобы избегать столкновений с астероидами

