[mod-setting-name]
ab-vanilla-group-scaling=Масштабирование атакующих групп как в игре
[mod-setting-description]
ab-vanilla-group-scaling=Если включено, крупные щелкуны занимают больше мест в атакующих группах — так же, как большие и чудовищные кусаки в Factorio 2.1. Если выключено, каждый щелкун занимает одно место, как было изначально в этом моде.
