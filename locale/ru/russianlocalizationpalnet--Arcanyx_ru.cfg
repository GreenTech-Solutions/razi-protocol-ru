[technology-description]
s6x-prismite-spoilage-melting=Извлечение эссенции зелёного призмита из гнили на Глебе.
s6x-void-flux-gathering=Под поверхностью Арканикса существуют богатые запасы пустотного потока в неочищенном виде.
s6x-entropic-creation=Разбейте магические камни друг о друга и посмотрите, что получится.
s6x-voidworks-burner-conversion=Пустокузни можно переделать для использования обычного сжигаемого топлива, что увеличит их скорость, но заставит их создавать загрязнение вместо того, чтобы поглощать его.
s6x-magic-air-purifier=Позволяет заклинанию ПУРИФАКС действовать постепенно с течением времени.
s6x-enviro-adapt=Присутствие мощных морфических элементов на поверхности Арканикса делает его среду подходящей для модификации.
s6x-nauviforming=Позволяет быстро трансмутировать пустотный океан, а также производить радиоактивные материалы.
s6x-glebaforming=Позволяет выращивать растения Глебы на Арканиксе, а также строить биокамеры.
s6x-fulgoraforming=Позволяет производить гольмий на Арканиксе, строить переработчики и электромагнитные заводы, а также вырабатывать электричество из молний.
automation-science-pack-arcanyx=На Арканиксе арканологические методы могут быть применены даже к более традиционным исследованиям.
logistic-science-pack-arcanyx=На Арканиксе арканологические методы могут быть применены даже к более традиционным исследованиям.
chemical-science-pack-arcanyx=На Арканиксе арканологические методы могут быть применены даже к более традиционным исследованиям.

