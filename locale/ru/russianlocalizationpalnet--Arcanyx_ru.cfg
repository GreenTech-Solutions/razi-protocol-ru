[mod-setting-description]
s6x-arcanyx-voidcraft=Ограничить пустотворение только Арканиксом, если вы хотите оставить эту механику эксклюзивной для этой планеты. Если вы включите это, рекомендуется также отключить «Мифрил необходим для ядерной энергетики».
s6x-arcanyx-incantation=Запрещает использование заклинаний где-либо, кроме Арканикса.
s6x-prismite-on-nauvis=При включении этой настройки Iridescent Industry будет создавать призмит и на Наувисе, как если бы Arcanyx не был установлен. Это также изменит дерево технологий для более раннего получения призмита.
s6x-void-ocean-dump=Позволяет манипуляторам сбрасывать ненужные предметы в пустотный океан.
s6x-arcanyx-mythril-nuclear=Определяет, необходим ли мифрил для ядерных технологий. Не имеет эффекта, если Iridescent Industry использует «безопасную интеграцию».
s6x-arcanyx-spirits=Определяет, будут ли духи Арканикса мстить вам за загрязнение планеты.
s6x-arcanyx-aquilo-requirement=Определяет, необходимо ли изучить технологии на Арканиксе, чтобы добраться до Аквило.
s6x-arcanyx-landfill-cost=Количество камня, необходимое для создания засыпки. Время пустотворения засыпки будет пропорционально этому числу.
s6x-arcanyx-vulcanus=Добавляет космическое соединение между Арканиксом и Вулканусом.
s6x-arcanyx-turbo-belt=Позволяет производить турбо-конвейеры на Арканиксе, а также на Вулканусе.
s6x-arcanyx-prismite-time=Определяет время пустотворения призмитовой руды. 4 сек в стандартном Пустотворении, но увеличено для Арканикса, чтобы стимулировать добычу руды.
s6x-lightning-min=Минимальное магнитное поле, необходимое для постройки коллектора молний. Значение по умолчанию подходит для Фулгоры, но для совместимости с модами могут потребоваться более низкие значения.

