[entity-description]
loading-ramp=Установите рядом с рельсами, как манипулятор, чтобы автоматически погружать и выгружать транспортные вагоны. Поверните с помощью __CONTROL__rotate__ и __CONTROL__reverse-rotate__, чтобы изменить режим и направление погрузки или выгрузки.
vw-dummy-chest=Цель фиктивного манипулятора

[technology-name]
vehicle-loading-ramps=Погрузочные рампы для транспорта

[technology-description]
vehicle-loading-ramps=Автоматизирует погрузку и выгрузку транспорта на вагоны на станциях. Погрузочные рампы задают зону и направление погрузки или выгрузки. Рампы можно фильтровать и отключать цепями или логистической сетью, как манипуляторы.

[mod-setting-name]
vehicle-wagon-inventory-slots=Слоты инвентаря транспортного вагона
vehicle-wagon-use-Autodrive-permissions=Учитывать разрешения Autodrive на транспорт

[mod-setting-description]
vehicle-wagon-inventory-slots=Включает слоты инвентаря в транспортных вагонах для обнаружения загруженного транспорта и пустых вагонов.
vehicle-wagon-use-Autodrive-permissions=Если включено, нельзя погружать или выгружать транспорт, которым Autodrive управляет от имени другого игрока.
vehicle-wagon-use-GCKI-permissions=Если включено, нельзя погружать или выгружать транспорт, который другой игрок заблокировал или закрепил за собой с помощью ключей GCKI.

[string-mod-setting]
