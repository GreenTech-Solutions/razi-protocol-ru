[tips-and-tricks-item-description]
vehicle-wagon=Нажмите на автомобиль или паука и пустой вагон в любом порядке либо выделите автомобиль и вагон рамкой, чтобы погрузить автомобиль в вагон. Так можно перевозить любые автомобили, танки и пауки.
vehicle-wagon-unload=Нажмите на гружёный вагон, затем нажмите в пределах жёлтой зоны, чтобы выгрузить транспорт.
