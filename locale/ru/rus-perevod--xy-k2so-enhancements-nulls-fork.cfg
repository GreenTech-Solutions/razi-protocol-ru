[mod-setting-description]
xy-item-weight=Улучшает ключевые промежуточные компоненты, такие как [item=kr-electronic-components], которые иначе имеют низкие значения. Улучшает ключевые ингредиенты, используемые в зданиях, такие как [item=kr-inserter-parts], чтобы поддержать производство зданий на месте.
xy-processing-unit-alt=[color=yellow]Внимание: Может вызвать незначительные проблемы с существующими сохранениями.[/color] Рецепт [recipe=kr-bio-processing-circuit] осуществляется в [entity=biochamber] и использует соответствующее количество [item=advanced-circuit]. Блокирует [item=processing-unit] Cerys от азотной кислоты до Cerys и перебалансирует его в соответствии со стандартами K2. Изменяет [item=processing-unit] Paracelsin от азотной кислоты для согласования с другими рецептами, но использует на один [item=advanced-circuit] меньше.
xy-move-lab-category=Перемещает все лабораторные здания во вкладку "Наука", предоставляемую модом "Science group". Это делается автоматически, если в вашей игре >10 лабораторий. Безопасно оставить эту настройку включенной, даже если она ничего не делает.
xy-moshine-connection-length=Увеличивает расстояние от [planet=nauvis] и [planet=vulcanus] до Moshine до 10000 и 25000 км соответственно. Плотность астероидов не затрагивается.
xy-paracelsin-tech-card=[color=orange]Внимание: Настоятельно рекомендуется оставлять исправления включенными. Влияет на сохранения, где уже производятся гальванические научные пакеты.[/color] Эта настройка оставлена, так как есть другой мод, добавляющий карту технологий гальванизации.
xy-paracelsin-tech-card-endgame=[color=orange]Внимание: Влияет на сохранения конца игры.[/color] Исследования, требующие [item=promethium-science-pack], также требуют карту технологий гальванизации. Требует включения "Добавить/заменить карту технологий гальванизации".
xy-secretas-polish=[color=orange]Внимание: Влияет на сохранения, достигшие Секретаса.[/color] Изменяет многие рецепты в моде, чтобы сделать их менее безумными и требовать материалы из других модов и K2.
xy-adv-chem-plant-rebalance=[color=yellow]Внимание: Может вызвать незначительные проблемы с существующими сохранениями.[/color] Меняет местами большинство характеристик [entity=kr-advanced-chemical-plant] с электрохимическим заводом Paracelsin (который появляется позже в игре). Стоимость [entity=kr-advanced-chemical-plant] снижается, а электрохимический завод становится дороже.
xy-lab-recipe-changes=[color=yellow]Внимание: Может вызвать незначительные проблемы с существующими сохранениями.[/color] [entity=kr-singularity-lab] требует криолаборатории Mulana вместо [entity=biolab] или [item=quantum-processor], если Muluna не установлен. Криолаборатория требует исследований и ингредиентов из Paracelsin, если он установлен. Перебалансирует и применяет множитель потребления научного пакета к качеству криолаборатории и [entity=kr-singularity-lab].
xy-advanced-centrifuge-rebalance=Уменьшает скорость вдвое, но добавляет +50% продуктивности для продвинутой центрифуги, чтобы привести ее в большее соответствие с балансировкой Space Age, чем с балансировкой K2. Перемещает технологию из [item=kr-matter-tech-card] вниз к [item=electromagnetic-science-pack]. Значительно изменяет рецепт здания.
xy-arig-belts=[color=yellow]Внимание: Может вызвать незначительные проблемы с существующими сохранениями.[/color] Делает превосходные конвейеры продолжением гиперконвейеров Arig вместо турбоконвейеров SA, лучше интегрируя их. Также добавляет Hyper loader. Все превосходные конвейеры требуют гиперконвейеров вместо этого, а рецепты гиперконвейеров изменены, чтобы соответствовать стилю K2.
xy-apia-artillery-rebalance=[color=yellow]Внимание: Может вызвать незначительные проблемы с существующими сохранениями.[/color] Увеличивает урон фосфорных артиллерийских снарядов [item=artillery-shell-with-phosphorus] для соответствия другим артиллерийским снарядам и стандартизирует рецепт в соответствии с ядерными/антиматериальными артиллерийскими снарядами. Также стандартизирует размер стака и вес.
xy-apia-biosolar-rebalance=[color=orange]Внимание: Настоятельно рекомендуется оставить включенным, так как биосолнечная панель в противном случае сделает воздушные очистители K2 совершенно избыточными.[/color] Уменьшает поглощение загрязнений биосолнечной панелью [entity=bio-solar-panel] на 90% (она по-прежнему поглощает загрязнения, эквивалентные 200 деревьям, вместо 2000). В качестве компенсации увеличивает выработку солнечной энергии до 120 кВт. Стандартизирует размер стака до 50 и вес до 40 кг.
xy-tech-inflation=[color=yellow]Внимание: Игра становится сложнее, но рекомендуется.[/color] Умножает стоимость технологий после первых трех ванильных планет. Игрок теперь способен к огромному масштабированию, когда он объединен с функциями K2. Это потребует строительства на "килобазовых" уровнях и стимулирует создание третьей базы до поздней/конечной игры, с предложением 1000-3000+ SPM до [item=promethium-science-pack] и >10000 SPM для завершения конечной игры в разумные сроки. Не влияет на технологии Moshine. Не влияет на технологии "обновления". \n[font=default-bold]Эта настройка может подойти не всем. По умолчанию она отключена, так как она значительно повлияет на существующие базы в середине и конце игры.[/font]
xy-tech-inflation-scale=Базовые множители:\n[item=kr-advanced-tech-card] 2x\n[item=metallurgic-science-pack][item=electromagnetic-science-pack][item=agricultural-science-pack](все) 5x\n[item=cryogenic-science-pack] (или Гидравлический или Гальванический) 6x\n[item=kr-matter-tech-card] 10x\n[item=kr-singularity-tech-card] 15x\n[item=promethium-science-pack] 25x\n[item=kr-intergalactic-transceiver] 50x\nИспользуется самый высокий применимый множитель. Увеличиваются некоторые ключевые технологии, такие как [technology=quantum-processor] и [technology=legendary-quality], а также открытия поздних планет.\nИзменение этой настройки умножает множители, указанные выше, но не ниже 1x.
xy-maraxsis-moshine-connection=[color=yellow]Внимание: Может вызвать проблемы при отключении в середине игры.[/color] Добавляет новое соединение между Maraxsis и Moshine длиной 15000 км; короче других путей. Имеет такое же разнообразие астероидов, как и другие маршруты к Maraxsis. Требует включения настройки "Увеличить расстояние до Moshine", Maraxsis и Moshine, иначе ничего не произойдет.
xy-advanced-tank-expensive-research=Исследование [technology=kr-advanced-tank] дополнительно требует [item=metallurgic-science-pack] [item=electromagnetic-science-pack] [item=agricultural-science-pack] для поощрения использования [entity=spidertron] в боевых целях

