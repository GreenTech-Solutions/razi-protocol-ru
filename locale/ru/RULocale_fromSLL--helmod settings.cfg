[helmod_pref_settings]
display-hidden-products-mode=Режим отображения скрытых продуктов
display-hidden-products-mode-desc=Сжимает продукты с использованием абсолютных или относительных значений
display-hidden-products=Показывать скрытые продукты
display-hidden-products-desc=Сжимает продукты в одну ячейку. Значение 0 отключает эту функцию
ui-production-lines-menu=Меню производственных линий
ui-production-lines-menu-desc=Выберите количество видимых строк. 0 - показывать все строки
combinator-item-quantity-mode=Количество предметов в комбинаторе
combinator-item-quantity-mode-desc=Как вычисляется значение сигнала для предмета при генерации константного комбинатора из списка входов. "Стопки": значение x размер стопки предмета. "Количество": значение x количество входов блока.
combinator-default-item-value=Значение предмета в комбинаторе
combinator-default-item-value-desc=Множитель для каждого предмета. В режиме "Стопки" - количество стопок, в режиме "Количество" - множитель количества входов. Используйте отрицательное значение для запроса предметов (например, для логистического или поездного запроса).
combinator-fluid-quantity-mode=Количество жидкости в комбинаторе
combinator-fluid-quantity-mode-desc=Как вычисляется значение сигнала для жидкости при генерации константного комбинатора из списка входов. "Стопки": значение x размер стопки жидкости. "Количество": значение x количество входов блока.
combinator-default-fluid-value=Значение жидкости в комбинаторе
combinator-default-fluid-value-desc=Множитель для каждой жидкости. В режиме "Стопки" - количество стопок, в режиме "Количество" - множитель количества входов. Используйте отрицательное значение для запроса жидкостей (например, для логистического или поездного запроса).
combinator-default-fluid-stack=Стопка жидкости в комбинаторе
combinator-default-fluid-stack-desc=Фиксированное значение сигнала для каждой жидкости при генерации константного комбинатора. Используйте отрицательное значение для запроса жидкости (например, -30000).
