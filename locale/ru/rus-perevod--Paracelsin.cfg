[space-location-description]
paracelsin=Высокоактивная криовулканическая замёрзшая пустошь. Поверхность покрыта озёрами [fluid=nitrogen] из подземного океана. [entity=cryovolcanic-vent]ы усеивают ландшафт наряду с жилами [item=tetrahedrite] и [item=sphalerite], необходимых для добычи [item=zinc]. В небольших жилах также присутствует [item=vaterite]. Всё, что построено на планете, должно постоянно подогреваться, иначе оно замёрзнет, а все нежелательные побочные продукты добычи цинка должны быть утилизированы.

[technology-name]
pressure-power=Энергия давления

[technology-description]
planet-discovery-paracelsin=Высокоактивная криовулканическая замёрзшая пустошь. Поверхность покрыта озёрами [fluid=nitrogen] из подземного океана. [entity=cryovolcanic-vent]ы усеивают ландшафт наряду с жилами [item=tetrahedrite] и [item=sphalerite], необходимых для добычи [item=zinc]. В небольших жилах также присутствует [item=vaterite]. Всё, что построено на планете, должно постоянно подогреваться, иначе оно замёрзнет, а все нежелательные побочные продукты добычи цинка должны быть утилизированы.
pressure-power=Внутри замёрзшей [entity=crashed-fulgoran-pod] были обнаружены древние чертежи специального электрического генератора, использующего давление газовых выбросов для производства электричества. Его можно использовать для запуска колонизации Парацельсина.

[entity-name]
cryovolcanic-vent=Криовулканический выброс
pressure-turbine=Напорная турбина

[entity-description]
cryovolcanic-vent=Выброс криомагмы, пробивающийся сквозь поверхность [planet=paracelsin].
pressure-turbine=Электрический генератор, использующий давление газовых выбросов (например, [entity=sulfuric-acid-geyser]) для производства энергии, при этом извлекая жидкость медленнее, чем стандартный насос. Он не может заряжать аккумуляторы, и его производительность не зависит от качества.

[fluid-name]
cryovolcanic-mixture=Криовулканическая смесь

[fluid-description]
cryovolcanic-mixture=Смесь [fluid=water] и [fluid=nitrogen], поступающая из подповерхностного океана [planet=paracelsin].

[recipe-name]
cryovolcanic-mixture-separation=Разделение криовулканической смеси
concrete-from-calcium-sulfate=Бетон из сульфата кальция

[recipe-description]
concrete-from-calcium-sulfate=Более эффективный рецепт бетона, изготовленный с использованием [item=sulfur] и [item=calcite].

[tips-and-tricks-item-description]
paracelsin-briefing=[planet=paracelsin] — это замёрзшая пустошь, как и [planet=Аквило], но, в отличие от мира аммиака, она имеет твёрдую поверхность. Под землёй планета скрывает большой океан [fluid=nitrogen], который вытекает на поверхность, образуя [tile=nitrogen-lake]s. Планета богата [item=sphalerite] и [item=tetrahedrite] (соединениями [item=zinc]), а также [item=vaterite]. [entity=cryovolcanic-vent]ы также можно найти по всей поверхности.

