[technology-description]
umr_tech=Универсальный модульный реактор, потребляющий большинство видов топлива и генерирующий электроэнергию, тепло, мощные печи, сборочные машины и лаборатории.
umr_tech_machine=Передовые универсальные автоматизированные установки, способны выдавать огромные объёмы продукции, даже из иных миров и за их пределами.
umr_tech_military=Передовые турели и стены.
umr_tech_logistic=Передовые строительные и логистические роботы, огромные логистические сундуки, существенно расширяющие возможности логистической системы.
umr_tech_train=Передовые транспортные средства для целых геосфер, быстрые локомотивы и сверхтяжёлые вагоны, с решётками для модулей‑оборудования, открывающие невообразимый потенциал.
umr_tech_belt=Передовые пути и более гибкие средства транспортировки.
umr_turret_tech_damage=Повышает урон турелей УМР.
umr_tech_teleporter_1=Универсальная логистическая транспортировка между планетами.
