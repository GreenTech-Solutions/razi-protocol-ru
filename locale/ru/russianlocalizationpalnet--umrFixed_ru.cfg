[entity-description]
umr_interface_entity=УМР ввод первой фазы, обогащение большинства твёрдых и жидких топлив в сеть УМР‑топлива, требует значительного количества электроэнергии. Полная установка будет генерировать экстремальные количества энергии, тепла и работу экзотических печей и сборочных машин: ваш выбор! Эффективность 100%.
umr_amplifier_entity=УМР ввод второй фазы, задайте рецепт для продолжения процесса. Требует значительного количества пара при 900 °C. УМР понадобится минимум два усилителя. Эффективность 100%.
umr_core_entity=УМР нестабильное ядро, ввод третьей фазы. Задайте рецепт для продолжения процесса, режимы работы: от 38,28 ГВт до 3,82 ТВт. Эффективность 100%. Имеет крайне низкий риск утечки топлива‑провала [img=technology/atomic-bomb].
umr_output_entity=УМР ввод четвёртой фазы, задайте рецепт для продолжения процесса. Требует значительного количества пара при 900 °C. УМР может потребовать минимум два вывода. Эффективность 100%.
umr_converter_entity=УМР южный прямой электрический энергетический финальный этап.
umr_converter_heat_entity=УМР южный тепловой финальный этап. УМР эксплуатирует минимум восемь тепловых конвертеров.
umr_converter_heat_2_entity=УМР северный тепловой финальный этап. УМР эксплуатирует минимум восемь тепловых конвертеров.
umr_neutronic_heater_entity=УМР нагреватель для транспортируемой чистой энергии УМР.
umr_crafting_entity=УМР экзотическая сборочная машина финального этапа, потребляет энергию 3‑й стадии напрямую из ядра.
umr_crafting_entity_2=УМР экзотическое тяжёлое производственное предприятие финального этапа, потребляет энергию 3‑й стадии напрямую из ядра, высокоскоростная огромная сборочная машина, способная выдавать колоссальные объёмы продукции, даже из иных миров и за их пределами.
umr_furnace_entity=УМР экзотическая печь финального этапа, потребляет энергию 3‑й стадии напрямую из ядра.
umr_furnace_entity_2=УМР экзотическое тяжёлое штамповочное пресс‑устройство финального этапа, потребляет энергию 3‑й стадии напрямую из ядра, высокоскоростная огромная автоматизированная печь, способная выдавать колоссальные объёмы продукции, даже из иных миров.
umr_heavyforge_entity=УМР экзотический тяжёлый кузнечный цех финального этапа, потребляет энергию 3‑й стадии напрямую из ядра.
umr_chemicalplant_entity=УМР экзотический химический завод финального этапа, потребляет энергию 3‑й стадии напрямую из ядра.
umr_oilrefinery_entity=УМР экзотический нефтеперерабатывающий завод финального этапа, потребляет энергию 3‑й стадии напрямую из ядра.
umr_lab_entity=УМР экзотическая лаборатория финального этапа, потребляет энергию 3‑й стадии напрямую из ядра. Может исследовать любые науки, даже из иных миров и за их пределами.
umr_lab_entity_2=УМР экзотическое исследовательское предприятие финального этапа, потребляет энергию 3‑й стадии напрямую из ядра, высокоскоростная огромная лаборатория, способная исследовать колоссальные объёмы любой науки, даже из иных миров и за их пределами.
umr_robot_logistic_entity=Транспортирует предметы между логистическими саркофагами.
umr_robot_construction_entity=Автоматически строит и ремонтирует дружественные объекты.
umr_roboport_entity=Связывается с другими робопортами, образуя сети строительства и логистики, используемые строительными и логистическими роботами.
umr_autocannon-turret_entity=Дальнобойная турель, стреляющая патронами калибра «handgun».
umr_autocannon-turret45_entity=Дальнобойная турель, стреляющая патронами калибра «handgun».
umr_heavylaser-turret_entity=Дальнобойная лазерная турель.
umr_heavylaser-turret45_entity=Дальнобойная лазерная турель.
umr_cannon-turret_entity=Дальнобойная турель, стреляющая пушечными снарядами.
umr_cannon-turret45_entity=Дальнобойная турель, стреляющая пушечными снарядами.
umr_rocket-turret_entity=Дальнобойная турель, стреляющая ракетами.
umr_rocket-turret45_entity=Дальнобойная турель, стреляющая ракетами.
umr_flamer-turret_entity=Дальнобойная турель, стреляющая чистой энергией УМР.
umr_flamer-turret45_entity=Дальнобойная турель, стреляющая чистой энергией УМР.
umr_plasma-turret_entity=Дальнобойная электрическая турель, стреляющая тактическими ядерными лучами.
umr_plasma-turret45_entity=Дальнобойная электрическая турель, стреляющая тактическими ядерными лучами.
umr_fortress_entity=УМР экзотическая стена.
umr_active_provider_sarcophagus_entity=Отправляет своё содержимое в логистическую сеть.
umr_passive_provider_sarcophagus_entity=Делает своё содержимое доступным для логистической сети.
umr_storage_sarcophagus_entity=Долгосрочное хранение для логистической сети.
umr_buffer_sarcophagus_entity=Запрашивает указанные предметы для личной логистики и автоматического строительства.
umr_requester_sarcophagus_entity=Запрашивает указанные предметы из логистической сети.
umr_transport_belt_entity=Самый простой способ автоматической транспортировки предметов.
umr_underground_belt_entity=Позволяет транспортной ленте пересекать другие объекты или непроходимую местность, проходя под ними.
umr_splitter_entity=Разделяет и/или соединяет груз транспортной ленты 1:1.
umr_loader_1x1_entity=Может загружать или выгружать содержимое контейнера или машины так же быстро, как справляется транспортная лента.
umr_locomotive=Идеальный двигатель для перемещения поездов по путям. С решёткой для модулей‑оборудования, требующей энергомодули; экзоскелет повышает скорость передвижения конструкции.
umr_cargo_wagon=Позволяет перевозить предметы по рельсам. С решёткой для модулей‑оборудования, требующей энергомодули; экзоскелет не повышает скорость передвижения конструкции.
umr_fluid_wagon=Позволяет перевозить жидкости по рельсам. С решёткой для модулей‑оборудования, требующей энергомодули; экзоскелет не повышает скорость передвижения конструкции.
umr_quantum_teleporter_entity=Квантовые телепортеры делятся своим инвентарём с другими телепортерами, у которых включены те же настройки. Установите ID, отмечая галочками; любые телепортеры с одинаковыми отметками связываются. На поверхности может быть размещён только один одновременно.
umr_fire-sticker=УМР ожог.
umr_fire-flame=УМР пламя.

