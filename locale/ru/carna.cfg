[technology-description]
carna-aps-a=Используя утиль из местных ресурсов и обветшалых мехов, мы можем переплавить его в загадочных хост-сборщиках Карны в своего рода реплицирующий гель и создавать из него базовые ресурсы, готовые к применению.

[mod-setting-description]
carna-roamers-temp=Если снять галочку, бродячие боты Карны никогда не будут исчезать автоматически. Судя по всему, они способны нагружать UPS, поэтому по умолчанию они со временем исчезают сами. Но если боты вам нравятся и нагрузка на UPS не смущает — можете смело оставить их.
