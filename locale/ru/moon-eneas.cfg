[technology-description]
oil-tech=Позволяет [entity=unit-05] юниту-05 производить [item=heavy-oil-barrel] бочки с мазутом, тем больше, чем ниже загрязнение. Предметы будут доставляться каждый цикл к [entity=eneas-lift] подъёмнику ресурсов.
planet-discovery-eneas=Маленькая и неприметная луна с климатом, схожим с наувисским. Дальнейшее изучение показывает, что именно она — источник сигналов, которые вы принимаете.
engineer-assembler=Продвинутый сборочный автомат, вдохновлённый инженерными технологиями. Обладает врождённым бонусом к продуктивности. Не требует электричества, но нуждается в постоянном потоке данных.
