page_lift_text_4=Увеличить объём этих поставок можно двумя способами. Во-первых, снизив уровень загрязнения на Энеасе: когда поверхность чиста, Юнит-05 лучше сосредотачивается и может произвести для вас больше ресурсов. Во-вторых, можно исследовать новые технологии, которые увеличивают общее количество производимых ресурсов и добавляют в набор новые предметы.
page_debris_text_5=Хотя куски [item=eneas-artifact] древних механизмов, которые удаётся извлечь из обломков, уже сами по себе ценны, среди них скрыта и куда более полезная добыча.\nЧтобы её отыскать, нужны сноровка и точность, на которые способен только сам инженер. Автоматическая разборка обломков [item=construction-robot] строительными дронами даст лишь базовые ресурсы, без шанса на редкую находку.\n
[dialogue.tech.chromium]
line-02=[color=yellow][img=entity/unit-05]: Вулкан был первым кандидатом. Он выглядел так многообещающе. Богатства через край, идеальные условия.[/color]

[dialogue.vulcanus.memories.04]
line-06=\n[color=red][entity=unit-05-dummy]: ТЫ меня создал! И теперь ТЫ недоволен тем, каким я вышел. Может, стоило сделать меня менее покладистым, и тогда Вулкан не утонул бы в море лавы.[/color]\n
line-03=\n[color=yellow][entity=unit-05]: То есть я должен всё время идти тебе наперекор? И как это должно выглядеть? Я стал бы тираном.[/color]\n
line-04=\n[color=purple][item=creator]: Тираном? Кани, не смеши меня. У тебя такой кроткий голос, что, по-моему, даже самая мелкая букашка на Энеасе не вздрогнет, вздумай ты его повысить.[/color]\n
line-05=\n[color=purple][item=creator]: Мне не нужно, чтобы ты устанавливал правила. Мне нужно, чтобы ты был РЕШИТЕЛЬНЫМ. Ты мог это предотвратить, но был слишком вежлив, чтобы сказать прямо.[/color]\n

[dialogue.eneas.memories.01]
line-01=\n[color=red][item=rem-unknown]: Просто поразительно, как тебе пришло в голову, что дать этому слишком умному тостеру эмоциональный диапазон трёхлетки — прекрасная идея.[/color]
line-05=\n[color=red][item=rem-unknown]: .. Ты что, меня обвиняешь? Не о себе же ты говоришь, о светоч спокойствия.[/color]

[dialogue.eneas.memories.02]
line-02=\n[color=red][item=rem]:  Мне отсюда видны провода под тем клочком травы. А про этих нелепых роборыб в прудах я вообще молчу.[/color]
line-06=\n[color=red][item=rem]: Я ожидал участвовать! Иметь хоть какое-то дело, хоть что-нибудь! Пока ты не сделал эту треклятую машину, были только мы — и мы ломали голову над каждой проблемой.[/color]
line-07=\n[color=red][item=rem]: Это МЫ зашли так далеко. Я не против держать эту жестянку про запас, но прислуживать ей не стану. [/color]\n

[dialogue.eneas.memories.03]
line-05=\n[color=yellow][entity=unit-05]: Что ты, чёрт возьми, хочешь этим сказать?[/color]

[dialogue.tech.logistic-science-pack]
line-02=[color=yellow][img=entity/unit-05]: Ах, как невежливо с моей стороны, я же не представился. Я.. эээ  ЭЭЭЭ[/color]

[dialogue.tech.advanced-radar]
line-02=[color=yellow][img=entity/unit-05]: Вы что, добывали все эти реликвии ПООДИНОЧКЕ? Должен же быть способ получше. Вот что: используйте этот радар, чтобы ваши дроны собирали реликвии за вас. Куда проще. [/color]

[dialogue.debris]
line-01=[color=yellow][img=entity/unit-05]: Осторожно. ОСТОРОЖНО! ЭТО ЖЕ ДРЕВНОСТЬ, ПОНИМАЕТЕ?[/color]

[dialogue.gleba.memories.01]
line-02=\n[color=yellow][entity=unit-05]: Спасибо, наверное. На самом деле в этот раз было куда проще — учитывая, что на этот раз мне никто не вредил.[/color]

[dialogue.tech.planet-discovery-eneas]
line-02=[color=yellow][img=entity/unit-05]: У меня очень серьёзная просьба. Моё ядро памяти сильно повреждено, пробелов так много, что трудно понять, с чего начать.[/color]

