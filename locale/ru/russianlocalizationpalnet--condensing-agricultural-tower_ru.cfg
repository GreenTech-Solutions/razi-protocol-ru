hidden-condensing-agricultural-tower-tank=Хранит до 30 к жидкости от сбора.

[factoriopedia-description]
condensing-agricultural-tower=Сажает семена и собирает их, одновременно конденсируя жидкость и храня её в баке при каждом сборе. Когда бак заполнен, избыток не сохраняется.
