[mod-setting-name]
moshine-long_stack_inserter=Включить длинный пакетный манипулятор
moshine-se-space-trains=Включить космические маглев-поезда
[mod-setting-description]
moshine-long_stack_inserter=Если отключено, длинный пакетный манипулятор будет скрыт.
moshine-se-space-trains=Если отключено, маглев-поезда — локомотивы, вагоны, станции и прочее — будут скрыты.

[recipe-description]
moshine_cosmicscanner-construct-1=Создаёт центральное кольцо космического сканера. Для завершения нужно применить 40 раз к фундаменту.
moshine_cosmicscanner-construct-2=Создаёт базовые механизмы космического сканера. Для завершения нужно применить 40 раз к фундаменту.
moshine_cosmicscanner-construct-3=Создаёт более продвинутые части космического сканера. Для завершения нужно применить 40 раз к фундаменту.
moshine_cosmicscanner-construct-4=Создаёт центральные части и купол космического сканера. Для завершения нужно применить 40 раз к фундаменту.
