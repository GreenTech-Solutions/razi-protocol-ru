[entity-description]
replicator-block=Одиночный блок. Сам по себе безвреден, но ищет другие, чтобы снова собраться вместе.
replicator-crawler=Ночью ворует с конвейеров, подбирает то, что транспортировщики вытряхнули из сундуков, и несёт всё домой, в ядро.
replicator-scrap=Блоки репликаторов, плотно спрессованные под ядром. Залежь растёт со всем, что съедает гнездо, а при добыче даёт лом репликаторов.
replicator-carrier=Носильщик, который может унести гораздо больше краулера. Во время рейдов вскрывает сундуки и вытряхивает содержимое для краулеров.
replicator-core=Сердце гнезда репликаторов. Всё, что крадёт гнездо, наращивает залежь лома репликаторов под ним. Уничтожьте ядро — и весь остров развалится.
replicator-crawler-spawner=Здесь появляются краулеры гнезда. Каждый узел поддерживает восемь краулеров, выводя новых взамен убитых: уничтожьте узел — и на острове станет на восемь краулеров меньше.
replicator-carrier-spawner=Здесь появляются транспортировщики гнезда. Каждый узел поддерживает двух транспортировщиков, выводя новых взамен убитых.
replicator-forge=Здесь гнездо формует свои блоки. Прочная постройка, полная репликаторов.
replicator-repair-pylon=Медленно чинит ядро, а также постройки и турели вокруг него.
replicator-scout-ship=Горстка репликаторов, слившихся в небольшой корабль для малого рейда. Сбейте корабль — и они погибнут вместе с ним.
replicator-drop-ship=Репликаторы не могут пересечь нефть, поэтому совершают воздушные рейды: сливаются в корабль, садятся на краю острова и снова распадаются на рейдеров. Чтобы вернуться домой, они собираются в корабль там же, где высадились. Сбейте корабль — и они погибнут вместе с ним.
replicator-mothership=Уничтожьте слишком много репликаторов или построек гнезда — и оно объявит войну: его рейдеры объединятся в материнский корабль. Они прилетят сражаться, атакуя ваши турели прежде, чем начнут грабить. После нескольких спокойных ночей гнездо успокоится.
replicator-turret=Охраняет ядро репликаторов, швыряя в нарушителей комья блоков.

