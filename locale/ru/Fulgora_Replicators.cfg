[mod-setting-description]
fulgora-replicators-raids=Разрешить гнёздам совершать рейды.
fulgora-replicators-nights-per-raid=Количество ночей между рейдами. День на Фульгоре длится всего 3 минуты.
fulgora-replicators-raid-range=На каком расстоянии в клетках гнездо ищет остров с постройками для рейда.
fulgora-replicators-raid-intensity=Множитель количества репликаторов, участвующих в рейде (по умолчанию 1/4 популяции).
fulgora-replicators-max-surface-units=Общее ограничение на количество репликаторов на планете. При достижении лимита новые особи перестают создаваться.
fulgora-replicators-raid-alerts=Показывать оповещение и метку на карте в месте высадки рейда и при вскрытии сундуков.
fulgora-replicators-chest-theft=Какие сундуки транспортировщики репликаторов вскрывают во время рейдов, вытряхивая самые ценные пачки для краулеров. Сами сундуки они не повреждают.
fulgora-replicators-scrap-patch-max=Максимальное количество лома репликаторов в залежи гнезда. Она растёт, когда гнездо поглощает ресурсы, и не пополняется при добыче.

[string-mod-setting]
fulgora-replicators-chest-theft-belts=Только конвейеры, без сундуков
fulgora-replicators-chest-theft-chests=Сундуки (кроме логистических)
fulgora-replicators-chest-theft-logistic=Все сундуки (включая логистические)

