[mod-setting-description]
pink-plasma=Обычно плазма в трубах отображается тёмно-синей, очень похожей на окислитель, и это не вяжется с розовым значком плазмы. Эта настройка меняет цвет на розовый.
duct-extend=В Space Age у сетей труб есть максимальная длина, после которой нужен насос или аналогичное устройство. Для обычных труб она равна 320, для плазменных каналов — 32.

[mod-setting-name]
fusion-unlock=Открывать исследованием термоядерного синтеза
