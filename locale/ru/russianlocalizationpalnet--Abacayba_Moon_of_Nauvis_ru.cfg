[entity-description]
abacayba_huge_mining_drill_entity=Экзотический бур размером с городской квартал, обладающий обширной добывающей зоной. Может добывать более твёрдые руды и минералы.
abacayba_rotary_trommel_entity=Экзотическая вращающаяся наклонная цилиндрическая машина. Разрушает мягкие загрязнители в руде с помощью водяного распыления и абразивного вращения. Минералы, богатые водой, будут производить грязную воду.
abacayba_rotary_calciner_entity=Экзотический вращающийся наклонный цилиндр, непрерывно нагревающий сырье до высоких температур для химического разложения, активации или восстановления использованных катализаторов, фазовых переходов или удаления влаги.
abacayba_thickener_sedimentation_entity=Экзотический вертикальный осадительный бак с непрерывным гравитационным процессом, отделяющим взвешенные частицы от жидкости, образуя густой ил и очищенную жидкость.
abacayba_itaverax_ultracapacitor_entity=Экзотический сверхёмкостный аккумулятор.
abacayba-itaverax-sassy-wriggler-pentapod-premature=Дружелюбные инфицированные itaverax ползунки, которые не следуют за игроком, но будут атаковать любого врага в радиусе, пока не истечёт их срок жизни.
abacayba_glowing_one_biter=Босс Abacayba! Сверхмедленный дальнобойный танк‑битер с огромной зоной поражения.
abacayba_pillar=Босс Abacayba! Сверхмедленный дальнобойный летающий танк‑битер с континентальной зоной поражения.

