[technology-description]
planet_discovery_abacayba=Живой заражённый планетный мир, покрытый океанами враждебных местных видов и богатыми ресурсами. Приземлитесь в одном из его щупалец и проложите путь к ядру планеты. Руины продвинутой цивилизации присутствуют и, кажется, необходимы для укрощения этого места, предлагая экзотические технологии обработки минералов, богатых водой, в самые разнообразные элементы и гигантские машины.
abacayba_look_for_technologies=Поиск экзотических руин. Открывает доступ к давно утерянным технологиям обработки руды.
abacayba_oozing_white_goo_tech=Текучую белую слизь можно сжечь до угля.
abacayba_crystal_washing=Позволяет промывать кристаллические руды. Сильно гидратированные минералы выделяют воду в процессе.
abacayba_crystal_kiln=Точное нагревание материалов до высоких температур для разложения, окисления или восстановления. Очищает или укрепляет материал через окисление, либо готовит катализаторную поверхность. Меняет химическую природу материала.
abacayba_crystal_sedimentation=Позволяет оседать взвешенным частицам из грязной воды при медленном протекании через бак. На дне может образоваться слой отложенных рудных частиц.
abacayba_itaverax_alloy_tech=Позволяет создавать сплав itaverax — усиленное твёрдое решение металлов на атомном уровне.
abacayba_itaverax_coil_tech=Позволяет создавать катушку itaverax, генерирующую чрезвычайно высокие напряжения.
abacayba_itaverax_polymer_tech=Позволяет создавать полимер itaverax, трёхмерную кросс‑связанную стабильную сеть огромных молекул.
abacayba_itaverax_composite_tech=Позволяет создавать композит itaverax, сверхтвердый термостойкий лист из ламинированных слоёв.
abacayba_itaverax_electromagnet_tech=Позволяет создавать электромагнит itaverax, тип магнита, поле которого создаётся электрическим током.
abacayba_itaverax_cpu_tech=Позволяет создавать центральный процессор itaverax, сверхбыстрый вычислитель, исполняющий инструкции в цикле: выборка, декодирование, исполнение, повтор.
abacayba_itaverax_superconductor_tech=Позволяет создавать сверхпроводник itaverax при комнатной температуре, экзотический материал с нулевым электрическим сопротивлением и отталкивающий магнитные поля при любой температуре.
abacayba_ominous_science_pack_tech=Продолжайте исследовать экзотическую усиливающую силу кристаллов itaverax.
abacayba_advanced_oozing_white_goo_processing_tech=Переработка текучей белой слизи для производства руд, молока, пластмасс, серы и топлив. Улучшенное управление жидкостями.
abacayba_itaverax_ultracapacitor_tech=Экзотическое сооружение, хранящее огромные количества электрической энергии для последующего использования. Itaverax — экстремальный энергетический кристалл с ядерной энергией, которую можно усиливать.
itaverax_rail_tech=Рельсы из очень плотного и неразрушимого металлического сплава.
itaverax_xenobiology_tech=Синтетическая биология, сосредоточенная на манипуляции биологическими системами с помощью сил itaverax.
abacayba_itaverax_sassy_wriggler_capsule_tech=Несъедобная одомашненная внеземная жизнь, не следует за игроком, но будет атаковать любого врага в радиусе.
abacayba_infested_personal_roboport_tech=Заражённый робопорт, обладающий всеми свойствами личного робопорта и, будучи запитан, автоматически помечает предметы на земле для деконструкции в пределах своей зоны строительства.
abacayba_cyst_capsule_tech=Обратная биоинженерия цист Abacayba, стабилизированных с помощью сил itaverax.
abacayba_biomimetic_calcination=Точное нагревание внеземных затвердевших материалов; сложные органические системы всё ещё неизвестны, сохраняются лишь базовые структурные клетки.
abacayba_pure_water_calcination_tech=Термическая обработка для испарения кристаллической воды. Термальное разложение может образовать кальцит.
abacayba_calcite_flotation_tech=Разделяет вольфрамовую руду от пустой породы, используя различия в поверхностной химии.
abacayba_stone_flotation_tech=Разделяет руды от пустой породы, используя различия в поверхностной химии.
abacayba_torbernite_productivity=Увеличенный выход производства торбернита.
abacayba_itaverax_productivity=Увеличенный выход производства itaverax.
abacayba_dirty_water_sed_productivity=Увеличенный выход производства грязной воды.
abacayba_oozing_white_goo_productivity=Увеличенный выход производства текучей белой слизи.
abacayba_milk_productivity=Увеличенный выход производства молока Abacayba.
abacayba_research_productivity=Дополнительный прогресс исследований за каждый потреблённый исследовательский пакет.

