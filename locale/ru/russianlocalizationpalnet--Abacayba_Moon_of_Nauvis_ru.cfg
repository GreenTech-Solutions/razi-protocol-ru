abacayba_height=Никогда не меняйте это значение в уже запущенной игре! Ваш мир‑лента будет разорван. Меньшие значения = сложность будет расти экспоненциально. Если хотите изменить Abacayba, удалите мод (прогресс будет утерян), сделайте сохранение, переустановите и задайте новые настройки.
abacayba_wave=Никогда не меняйте это значение в уже запущенной игре! Ваш мир‑лента будет разорван. Большие значения = сложность будет расти экспоненциально. Если хотите изменить Abacayba, удалите мод (прогресс будет утерян), сделайте сохранение, переустановите и задайте новые настройки.
