[item-description]
abacayba_itaverax_ore=Экзотический минерал, богатый водой, который можно активировать в высокоэффективные материалы.
abacayba_torbernite_ore=Водяной радиоактивный минерал, который можно разложить до его металлов.
itaverax-rail=Используется для строительства неразрушимых прямых рельсов вручную или через планировщик рельсов.\n__CONTROL__build__ для построения коротких путей напрямую.\n__CONTROL__build-ghost__ для размещения длинных «призрачных» путей.
abacayba_itaverax_pentapod_egg=Дружелюбные инфицированные itaverax ползунки, которые не следуют за игроком, но будут атаковать любого врага в радиусе, пока не истечёт их срок жизни.
abacayba_itaverax_sassy_wriggler_capsule=Дружелюбные инфицированные itaverax ползунки, которые не следуют за игроком, но будут атаковать любого врага в радиусе, пока не истечёт их срок жизни.
abacayba_infested_personal_roboport_equipment=Заражённый робопорт обладает всеми свойствами личного робопорта и, будучи запитан, может автоматически помечать предметы на земле для деконструкции в пределах своей зоны строительства. Он может даже помечать трупы, такие как [entity=abacayba-itaverax-stomper-shell], [entity=abacayba_itaverax_skull], [entity=abacayba_itaverax_cortex] и [entity=abacayba_pillar_shell].
abacayba_cyst_capsule=Ужасная капсула с вражескими цистами, из которых вырастают кошмары Abacayba.

