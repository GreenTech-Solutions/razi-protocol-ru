[space-location-description]
abacayba=Живой заражённый планетный мир, покрытый океанами враждебных местных видов и богатыми ресурсами. Приземлитесь в одном из его щупалец и проложите путь к ядру планеты. Руины продвинутой цивилизации присутствуют и, кажется, необходимы для укрощения этого места, предлагая экзотические технологии обработки минералов, богатых водой, в самые разнообразные элементы и гигантские машины.

