[technology-description]
plasma-nuclear-fuel=Увеличивает калорийную плотность [item=rocket-fuel] до уровня, при котором транспортные средства могут сжигать её так же быстро, как [item=nuclear-fuel].
plasma-rocket-fuel-enrichment=Увеличивает калорийную плотность [item=rocket-fuel] до уровня, при котором транспортные средства могут сжигать её так же быстро, как [item=nuclear-fuel].
plasma-processing-unit=Плазменная гравировка [item=processing-unit] позволяет массовое производство и устраняет необходимость в [fluid=sulfuric-acid].
plasma-carbon-fiber=Применение плазменного разряда к синтетическим тканям обеспечивает непревзойдённую адгезию, повышая продуктивность [item=carbon-fiber].
plasma-weaponry=Держите силу солнца в ладони. [item=plasma-railgun-ammo] испаряется сразу после выхода из рельсогана, нанося меньше урона, но на гораздо большей площади, в то время как [item=plasma-artillery-shell] выпускает одну плазмено‑приводимую вольфрамовую пластину, нанося невероятный урон одной цели.

