[technology-description]
s6x-voidcraft=Создаёт предметы из пустоты, используя энергию и немного магии. Или достаточно продвинутую технологию, кто знает?
s6x-electric-voidworks=На пустотных заводах электрическая энергия может использоваться для пустотного ремесла.
s6x-void-science-pack=Позволяет исследовать искусство пустотного ремесла.
s6x-esoteric-science-pack=Позволяет исследовать более глубокие тайны пустотного ремесла.
s6x-celestial-science-pack=Позволяет исследовать отдалённые уголки вселенной с помощью пустотного ремесла.
s6x-void-science-pack-vc=Пустотное ремесло, конечно же, можно использовать для проведения экспериментов, углубляющих понимание его природы.
s6x-esoteric-science-pack-vc=Использование самого пустотного ремесла для исследования его более глубоких тайн.
s6x-celestial-science-pack-vc=Только самые мощные объекты пустотного ремесла могут создать этот продвинутый арканологический набор.
s6x-entropic-conjuration=Использует присущий хаос пустотного ремесла для создания… чего‑то.
s6x-entropic-conjuration-adv=Призывает более мощные силы хаоса для создания ещё более экзотических субстанций.
s6x-industrial-voidcraft=Более стабильные формы пустотного ремесла для создания различных полезных промышленных продуктов.
s6x-crystal-fabrication=Алхимический процесс создания синтетических осколков пустоты и способ более надёжного их вызова из пустоты.
s6x-voidgems=Очищенные и концентрированные осколки пустоты.
s6x-voidtronics=Электроника пустотного ремесла, иногда даже действительно работающая.
s6x-voidtronics-advanced=Более продвинутые и сложные применения пустотной электроники.
s6x-voidtronics-processing=Сложные процессорные блоки из пустотных компонентов.
s6x-void-engine=Двигатели пустотного ремесла, иногда даже действительно работающие.
s6x-void-electric-engine=Пустотная электроника может усиливать пустотный двигатель… и иногда всё же работает.
s6x-voidcraft-module=Особые арканные руны, ускоряющие процесс пустотного ремесла.
s6x-voidcraft-module-eff=Особые арканные руны, повышающие эффективность пустотного ремесла.
s6x-voidcraft-module-greater=Более мощные руны для ещё более быстрого пустотного ремесла.
s6x-voidcraft-module-top=Эти редкие и мощные руны позволяют чрезвычайно быстрое пустотное ремесло, но требуют большого количества энергии.
