[mod-setting-description]
s6x-voidcraft-science=Позволяет напрямую создавать пакеты науки пустотным ремеслом.
s6x-voidtronics-ratio=В более ранних версиях Voidcraft использовалось соотношение 28:1, но 24:1 считается более сбалансированным.
s6x-max-vc-coherence=В старых версиях было ограничение 1000 единиц инфузии согласованности на рецепт; теперь максимум 5000. При необходимости можно вернуть прежнее значение.
s6x-vc-recipe-signals=Ограничивает, какие рецепты пустотного ремесла видимы в GUI сигналов, чтобы избежать спама.
s6x-old-prismatic-carbonization=Восстанавливает устаревший рецепт «Призматическая карбонизация», если вы действительно хотите его вернуть.
s6x-old-entropic-conjuration=Восстанавливает прежние рецепты энтропийной конъюрации.
s6x-old-void-rocket-parts=Восстанавливает прежний рецепт пустотных ракет.
s6x-old-prismorphing=Восстанавливает старые рецепты «призматической конверсии» (prismorphing).
s6x-prismorph-in-chemical-plant=Позволяет выполнять призморфирование в химическом заводе без необходимости призмимиксера.
s6x-restore-prism-catalyze=Снова включает призматическое каталитическое действие. Отключено при использовании Space Age, Iridescent Industry или pHactorio и будет удалено в будущих версиях.
s6x-auto-module-categories=Пытается автоматически сформировать список категорий модулей и применить его. Может улучшить совместимость модов. Включайте только при необходимости.
s6x-no-random-rune=Не создаёт случайные побочные продукты при создании рун скорости и эффективности.
s6x-voidworks-no-scrap=Начиная с Voidcraft 2.0, рецепты пустотных заводов будут производить лом, как и большинство остальных рецептов.
s6x-no-voidcraft-in-space=Запрещает строительство зданий пустотного ремесла в космосе. Действует только с Space Age. Переопределяется, если используется Arcanyx и пустотное ремесло ограничено Arcanyx.
s6x-no-resource-depletion=Шахтёры и насосы больше не истощают ресурсы. Это почти как пустотное ремесло, только из земли.
s6x-wood-raw-fish=Позволяет древесному пустотному ремеслу иногда создавать сырую рыбу, как без Space Age.
s6x-coh-catalyst-reliability=Указывается в процентах. 100 % — катализатор всегда возвращается, как в прежних версиях.
s6x-void-pure-reliability=Указывается в процентах. 100 % — никогда не получите разорванный пустотный флакон как случайный результат.
s6x-primordial-voidforge-changes=Возвращает прежнюю конфигурацию первобытной пустотной кузницы: скорость 5 и возможность использования рун.
s6x-orichalcum-fragments=Включает фрагменты орихалка даже без Iridescent Industry или Scrappy Industry.
s6x-make-in-foundry=Позволяет создавать пустотных ремесленников и руны в литейных.
s6x-voidforge-simple=Включает пустотный цех — простой и дешёвый пустотный ремесленник. Раньше доступен только в мирах Void Block.
s6x-void-beacon-support=Определяет, требуют ли руны специальный пустотный маяк, могут ли они работать в обычном маяке или вовсе не поддерживают маяки.
s6x-vc-empowered-void-fuel=Добавляет усиленное пустотное топливо — более мощную версию пустотного топлива. Раньше было частью Arcanyx и менее полезно без него.
s6x-vc-petrochem-restore=Восстанавливает старые рецепты пустотной нефтехимии, которые были несколько переусилены по сравнению с другими рецептами.
s6x-old-fulgoran-scrap=Восстанавливает рецепт лома Фулгоры, если Scrappy Industry не используется. Без Scrappy Industry настройка не влияет.

