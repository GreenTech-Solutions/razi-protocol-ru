s6x-voidcraft-speed-module=Увеличивает скорость войдворка, но сильно повышает энергопотребление.
s6x-voidcraft-eff-module=Снижает энергопотребление войдворка.
s6x-voidcraft-prod-module=Создаёт больше продукции за цикл войдкрафтинга. Бесполезно без входных ингредиентов.
s6x-dangerous-eggs=Это яйцо уже начало вылупляться!
s6x-coherence-catalyst=После использования катализатор согласованности становится инертным и требует плавки для реактивации.
s6x-coherence-catalyst-sa=После использования катализатор согласованности становится инертным и не может быть использован 20 секунд.
s6x-coherence-catalyst-expended=Этот катализатор согласованности теперь инертен. Требуется плавка для реактивации.
s6x-coherence-catalyst-expended-sa=Этот катализатор согласованности теперь инертен. Требуется 20 секунд для повторного использования.
void-pure-container-full=Этот войдфлакон содержит несформированную пустоту. Его нужно использовать или безопасно утилизировать сразу.
void-pure-container-rupture=Этот войдфлакон разорвался и готов взорваться. Нужно быстро и безопасно избавиться от него!
gleba-wood=Это как обычное дерево, но из Глебы. Превращается в обычное дерево. Не задумывайтесь слишком сильно.

