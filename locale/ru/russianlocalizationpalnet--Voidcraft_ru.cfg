s6x-void-space-military=Позволяет создавать интеллектуальные снаряды с помощью пустотного ремесла.
s6x-void-pure=В недрах первобытной пустотной кузницы неоформленная пустота может быть вынесена в наш мир, но это опасное вещество требует надёжного containment.
