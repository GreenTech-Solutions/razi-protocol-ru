[technology-description]
s6x-prismite-basic=Призмит — очень полезное вещество, но процесс его очистки на открытом огне неэффективен и сопряжён с трудностями.
s6x-iridescent-illumination=Призмит можно заставить ярко светиться разными цветами, что делает его полезным для освещения.
s6x-prismite-fuel=Недоочищенный призмит содержит множество горючих компонентов и может быть использован в качестве топлива.
s6x-mythril=Мифрил — прочный и лёгкий сплав с широким спектром промышленного применения.
s6x-mythril-engine=Мифрил можно использовать для создания эффективных и мощных двигателей.
s6x-mythril-railway=Мифрил может заменить сталь в железнодорожных путях.
s6x-iridescent-science-pack=Призмит обладает множеством интересных и потенциально полезных свойств, которые стоит изучить подробнее.
s6x-polychromatic-science-pack=Более глубокое изучение полезных свойств призмита.
s6x-prismite-melting=Сырой призмит с помощью алхимических процессов можно разложить на три основных призматических элемента.
s6x-prismite-electric=Только электрические печи могут обеспечить постоянный и равномерный нагрев, необходимый для надёжной и эффективной переработки призмитовой руды в очищенный призмит.
s6x-prismogenesis=При правильных условиях призмит может передать свои особые свойства более обычным веществам.
s6x-prismite-morphing=Призматические элементы очень универсальны и могут быть преобразованы в ряд полезных продуктов.
s6x-prism-inserter=Манипуляторы можно отливать напрямую из призматических элементов... если они одного цвета.
s6x-ii-container2=Контейнер большего размера для хранения большего количества предметов.
s6x-ii-container3=Ещё более крупный контейнер для хранения ещё большего количества предметов.
s6x-accumulator-crystal=Заряженный призмитовый кристалл способен удерживать огромное количество энергии.
s6x-prismtronics=Особые свойства призматических элементов можно использовать для создания электроники.
s6x-prismtronics-processing=Позволяет создавать более продвинутую призматическую электронику.
s6x-prismite-crystal=Из призмита можно выковать полезные кристаллы.
s6x-prismite-crystal-glass=Стекло из призмитовых кристаллов прозрачное и прочное.
s6x-prismite-gems=Позволяет создавать самоцветы из чистых призматических элементов.
s6x-inversion-conversion=С помощью подходящего катализатора хроматические частоты призматических элементов можно инвертировать.
s6x-prismite-rocket-fuel=Мощное ракетное топливо, созданное на основе призмитового топлива.
s6x-bioprismite=Хотя призмит сам по себе не является органическим, у него много общего с живыми существами, и поэтому его можно создать из органических веществ.
s6x-prismite-deep-mine=Даже если призмит редко встречается на поверхности, его часто можно найти, копая глубже.
s6x-prismite-deep-mine-advanced=Ещё более экзотические материалы давно погребены в ядрах планет, и для их достижения требуются мощные буры.
s6x-prismite-fusion=Три призматических элемента могут быть вновь объединены в мощной реакции синтеза.
s6x-air-purification=Призмит можно использовать для поддержания свежести и чистоты воздуха... или, по крайней мере, чтобы он не был откровенно токсичным.
s6x-prismaximizer=Насыщение призмитом может увеличить выход дроблёной руды.
s6x-lunar-panel=Источник бесплатной электроэнергии, но бесполезен в дневное время.
s6x-void-runestone-novc=Рунный камень — твёрдое и долговечное вещество, состоящее в основном из выжженных остатков призмита.
s6x-voidworks-prism=Бесформенная пустота в сочетании с призматическими элементами позволяет создавать арканоплазму, которая может питать чрезвычайно мощную пустотную мастерскую.
s6x-voidworks-red=Багровая эссенция может быть использована в качестве источника энергии для пустокузни.
s6x-void-quantum=Объединение призмотроники и пустотроники позволяет создавать квантовые вычислительные устройства.
s6x-colored-concrete=Разумеется, ярко окрашенные призматические элементы можно использовать в качестве красителей.
s6x-azoth=Азот, так называемый «универсальный растворитель», полезен для различных (ал)химических процессов.
s6x-hydromorphing=Лазурную эссенцию не очень сложно превратить в чистую воду.
s6x-air-purification-azoth=Способность азота растворять почти всё делает его очень полезным для очистки.
s6x-promethium-ammo=Высокотехнологичные боеприпасы из прометия для превосходного пробития брони.
s6x-crimsonite-with-filler=Более эффективный процесс получения большего количества кримзонита из того же объёма багровой эссенции.
s6x-prismtronics-green=Схемы на самом деле не растут на деревьях! Но это очень близко.
s6x-prismtronics-red=Продвинутые схемы можно изготовить из кримзонита.
s6x-crimsonite-crafting=Создание различных полезных продуктов из кримзонита.

