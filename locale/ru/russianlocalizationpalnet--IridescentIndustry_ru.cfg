[mod-setting-description]
s6x-ii-overlap-tech=Iridescent Industry и Voidcraft имеют общие элементы в своих деревьях технологий. Эта настройка определяет, дерево какого мода имеет приоритет. Игнорируется при использовании Arcanyx с призмитом на Наувисе.
s6x-ii-krastorio-overlap-tech=Определяет, использовать ли технологию очистки воздуха из Iridescent Industry или Krastorio, или обе, если вам зачем-то нужно и то, и другое.
s6x-ii-overlap-tech-container=Определяет, какие из больших контейнеров Iridescent Industry включить при использовании Krastorio.
s6x-centrifuge-tinting=Заменено Bluetonium, если он установлен.
s6x-prismite-ore-scrap=Рецепты призмита, которые должны были создавать остатки призмита, вместо этого будут создавать призмитовую руду.
s6x-prismite-ore-stone-crush=Делает случайным побочным продуктом дробления призмитовой руды камень вместо песка.
s6x-ii-compatibility-mode=Вносит минимальные изменения в технологии и рецепты, что облегчает интеграцию в текущую игру. Однако сделайте резервную копию сохранения на случай, если ваша база всё равно сломается! Рекомендуется отключить эту настройку после постройки призмитовой инфраструктуры.
s6x-ii-promethium=Добавляет технологии поздней игры с использованием прометия.
s6x-ii-azoth=Добавляет азот — жидкость, которую можно перерабатывать и использовать повторно, подобно фторкетону из Space Age или грязной воде из Krastorio.
s6x-ii-simple-gem-recipes=Использует более простые рецепты для призматического рубина, изумруда и сапфира.
s6x-runestone-carbon=Использовать углерод вместо выжженного призмита в рецепте рунного камня.
s6x-inversion-mix-carbon=Использовать углерод вместо рунного камня в рецепте инверсионного преобразования.
s6x-arcane-glass=Эта настройка заставит рецепты Iridescent Industry использовать новый предмет «кристаллическое стекло» вместо обычного «стекла». Полезно, если у вас есть несовместимые моды, добавляющие стекло.

