[tips-and-tricks-item-description]
hyarion-refraction=[planet=hyarion] обладает уникальным способом выработки энергии.\nИспользуйте [entity=planetaris-big-refraction-ray-collector] для сбора [fluid=planetaris-refraction-light], затем передайте его через [entity=planetaris-fiber-optics-cable] в [entity=planetaris-refraction-plant].\nВнутри [item=planetaris-fluorite] и [fluid=planetaris-refraction-light] производят [fluid=planetaris-pure-light] — используйте его для выработки энергии в [entity=planetaris-refraction-generator].\nТакже можно производить [item=planetaris-charged-fluorite], чтобы перенести производство энергии преломления в любое место.
hyarion-unstable-gem=[item=planetaris-unstable-gem] — более эффективная альтернатива [item=cliff-explosives] с большим радиусом действия и уроном.

