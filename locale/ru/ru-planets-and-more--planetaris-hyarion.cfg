hyarion-packs-for-promethium=Включить исследовательские пакеты Хайариона [item=planetaris-polishing-science-pack][item=planetaris-refraction-science-pack] для исследования [item=promethium-science-pack] прометиевого исследовательского пакета
ignore-hyarion-tech-price-exponent=Игнорировать экспоненциальный множитель стоимости технологий Хайариона

