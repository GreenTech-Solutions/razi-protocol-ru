[mod-setting-description]
xy-item-weight=Увеличивает вес ключевых промежуточных компонентов, таких как [item=kr-electronic-components], у которых он иначе слишком мал. Увеличивает вес ключевых ингредиентов зданий, таких как [item=kr-inserter-parts], чтобы здания выгоднее было производить на месте.
xy-processing-unit-alt=[color=yellow]Внимание: Может вызвать незначительные проблемы с существующими сохранениями.[/color] Рецепт [recipe=kr-bio-processing-circuit] осуществляется в [entity=biochamber] и использует соответствующее количество [item=advanced-circuit]. Рецепт [item=processing-unit] из азотной кислоты с Цериса теперь доступен только на Церисе и перебалансирован под стандарты K2. Рецепт [item=processing-unit] из азотной кислоты с Парацельсина изменён для согласования с другими рецептами, но использует на один [item=advanced-circuit] меньше.
xy-move-lab-category=Перемещает все лабораторные здания во вкладку «Наука» из мода Science group. Это делается автоматически, если в вашей игре >10 лабораторий. Безопасно оставить эту настройку включённой, даже если она ничего не делает.
xy-moshine-connection-length=Увеличивает расстояние от [planet=nauvis] до Мошайна до 10000 км, а от [planet=vulcanus] до Мошайна — до 25000 км. Плотность астероидов не меняется.
xy-paracelsin-tech-card=[color=orange]Внимание: Настоятельно рекомендуется оставлять исправления включёнными. Влияет на сохранения, где уже производятся гальванизационные исследовательские пакеты.[/color] Эта настройка оставлена, так как есть другой мод, добавляющий карту технологий гальванизации.
xy-paracelsin-tech-card-endgame=[color=orange]Внимание: Влияет на сохранения конца игры.[/color] Исследования, требующие [item=promethium-science-pack], также требуют карту технологий гальванизации. Требует включения «Добавить/заменить карту технологий гальванизации».
xy-secretas-polish=[color=orange]Внимание: Влияет на сохранения, достигшие Секретаса.[/color] Изменяет многие рецепты в моде, чтобы сделать их менее безумными и требовать материалы из других модов и K2.
xy-adv-chem-plant-rebalance=[color=yellow]Внимание: Может вызвать незначительные проблемы с существующими сохранениями.[/color] Меняет местами большинство характеристик [entity=kr-advanced-chemical-plant] с электрохимическим заводом Парацельсин (который появляется позже в игре). Стоимость [entity=kr-advanced-chemical-plant] снижается, а электрохимический завод становится дороже.
xy-lab-recipe-changes=[color=yellow]Внимание: Может вызвать незначительные проблемы с существующими сохранениями.[/color] [entity=kr-singularity-lab] требует криолаборатории Мулуна вместо [entity=biolab] или [item=quantum-processor], если Мулуна не установлен. Криолаборатория требует исследований и ингредиентов из Парацельсин, если он установлен. Перебалансирует криолабораторию и [entity=kr-singularity-lab] и вводит для них множитель расхода исследовательских пакетов в зависимости от качества.
xy-advanced-centrifuge-rebalance=Уменьшает скорость вдвое, но добавляет +50% продуктивности для продвинутой центрифуги, чтобы баланс был ближе к Space Age, чем к K2. Переносит технологию с уровня [item=kr-matter-tech-card] на уровень [item=electromagnetic-science-pack]. Значительно изменяет рецепт здания.
xy-arig-belts=[color=yellow]Внимание: Может вызвать незначительные проблемы с существующими сохранениями.[/color] Делает превосходные конвейеры продолжением гиперконвейеров Ариг вместо турбоконвейеров Space Age, лучше интегрируя их. Также добавляет гиперпогрузчик. Теперь все превосходные конвейеры делаются из гиперконвейеров, а рецепты гиперконвейеров изменены, чтобы соответствовать стилю K2.
xy-apia-artillery-rebalance=[color=yellow]Внимание: Может вызвать незначительные проблемы с существующими сохранениями.[/color] Увеличивает урон фосфорных артиллерийских снарядов [item=artillery-shell-with-phosphorus] для соответствия другим артиллерийским снарядам и стандартизирует рецепт в соответствии с ядерными/антиматериальными артиллерийскими снарядами. Также стандартизирует размер пачки и вес.
xy-apia-biosolar-rebalance=[color=orange]Внимание: Настоятельно рекомендуется оставить включённым, так как биосолнечная панель в противном случае сделает очистители воздуха K2 бесполезными.[/color] Уменьшает поглощение загрязнений биосолнечной панелью [entity=bio-solar-panel] на 90% (она по-прежнему поглощает загрязнения, эквивалентные 200 деревьям, вместо 2000). В качестве компенсации увеличивает выработку солнечной энергии до 120 кВт. Стандартизирует размер пачки 50 и вес до 40 кг.
xy-tech-inflation=[color=yellow]Внимание: Игра становится сложнее, но рекомендуется.[/color] Умножает стоимость технологий после первых трёх ванильных планет. Вместе с возможностями K2 игрок может разогнать производство очень сильно. Понадобится база уровня «килобазы» и стимулирует создание третьей базы до поздней/конечной игры, рекомендуется 1000–3000+ SPM до [item=promethium-science-pack] и >10000 SPM для завершения конечной игры в разумные сроки. Не влияет на технологии Мошайн. Не влияет на технологии улучшений (upgrade).\n[font=default-bold]Эта настройка может подойти не всем. По умолчанию она отключена, так как она значительно повлияет на существующие базы в середине и конце игры.[/font]
xy-tech-inflation-scale=Базовые множители:\n[item=kr-advanced-tech-card] 2x\n[item=metallurgic-science-pack][item=electromagnetic-science-pack][item=agricultural-science-pack](все) 5x\n[item=cryogenic-science-pack] (или гидравлический, или гальванизационный) 6x\n[item=kr-matter-tech-card] 10x\n[item=kr-singularity-tech-card] 15x\n[item=promethium-science-pack] 25x\n[item=kr-intergalactic-transceiver] 50x\nИспользуется самый высокий применимый множитель. Увеличиваются некоторые ключевые технологии, такие как [technology=quantum-processor] и [technology=legendary-quality], а также открытия поздних планет.\nИзменение этой настройки умножает множители, указанные выше, но не ниже 1x.
xy-maraxsis-moshine-connection=[color=yellow]Внимание: Может вызвать проблемы при отключении в середине игры.[/color] Добавляет новый маршрут между Мараксисом и Мошайном длиной 15000 км; короче других путей. Имеет такое же разнообразие астероидов, как и другие маршруты к Мараксис. Работает, только если установлены моды «Мараксис» и «Мошайн» и включена настройка «Увеличить расстояние до Мошайна».
xy-advanced-tank-expensive-research=Исследование [technology=kr-advanced-tank] дополнительно требует [item=metallurgic-science-pack] [item=electromagnetic-science-pack] [item=agricultural-science-pack] для поощрения использования [entity=spidertron] в боевых целях

