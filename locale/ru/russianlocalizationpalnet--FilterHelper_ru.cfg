[fh]
button-tooltip=__1__\n__CONTROL__pipette__ для выбора в курсор.\n__2__
tooltip-filters=__CONTROL_LEFT_CLICK__ чтобы установить фильтр.\n__CONTROL_RIGHT_CLICK__ чтобы удалить фильтр.
tooltip-container-filters=__CONTROL_LEFT_CLICK__ чтобы установить фильтр.\n__CONTROL_RIGHT_CLICK__ чтобы удалить фильтр.\n__CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ чтобы установить фильтр для всех предметов этого типа.\n__CONTROL_KEY_CTRL__ + __CONTROL_LEFT_CLICK__ чтобы установить этот фильтр во все подходящие ячейки.\n__CONTROL_KEY_CTRL__ + __CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ чтобы установить этот фильтр во [font=default-bold]все[/font] ячейки.\n(__CONTROL_KEY_SHIFT__ или __CONTROL_KEY_CTRL__) + __CONTROL_RIGHT_CLICK__ чтобы удалить этот фильтр из всех ячеек.
tooltip-requests=__CONTROL_LEFT_CLICK__ чтобы увеличить запрос на 1 стек.\n__CONTROL_RIGHT_CLICK__ чтобы уменьшить запрос на 1 стек.\n__CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ чтобы увеличить запрос на 5 стеков.\n__CONTROL_KEY_SHIFT__ + __CONTROL_RIGHT_CLICK__ чтобы уменьшить запрос на 5 стеков.\n__CONTROL_KEY_CTRL__ + __CONTROL_LEFT_CLICK__ чтобы установить запрос до заполнения контейнера.\n__CONTROL_KEY_CTRL__ + __CONTROL_RIGHT_CLICK__ чтобы удалить запрос.
filters-full=Фильтры заполнены
filters-empty=Фильтры пусты
requests-full=Запросы заполнены
requests-empty=Запросы пусты

[mod-setting-name]
fh-set-filter-on-inserter=Включать фильтры при установке фильтра для манипулятора
fh-default-item-on-splitter=Устанавливать предмет, всегда отображаемый на разделителях
fh-add-fuel-items=Добавлять совместимые топливные предметы в фильтры
fh-show-only-unlocked-qualities=Показывать только разблокированные качества в результатах

[mod-setting-description]
fh-set-filter-on-inserter=Включает чекбокс «Использовать фильтры» при установке фильтра для манипулятора
fh-default-item-on-splitter=Название предмета, который всегда будет отображаться на разделителях, например deconstruction-planner. Оставьте пустым, чтобы отключить.
fh-add-fuel-items=Добавляет совместимые топливные предметы и их результаты, даже если они не встречаются во входах и выходах
fh-show-only-unlocked-qualities=Крафтер с модулями качества не будет показывать качества, превышающие исследованные, в фильтрах результатов
