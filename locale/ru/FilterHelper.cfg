[fh]
button-tooltip=__1__\n__CONTROL__pipette__, чтобы взять пипеткой в курсор.\n__2__
tooltip-filters=__CONTROL_LEFT_CLICK__, чтобы установить фильтр.\n__CONTROL_RIGHT_CLICK__, чтобы удалить фильтр.
tooltip-container-filters=__CONTROL_LEFT_CLICK__, чтобы установить фильтр.\n__CONTROL_RIGHT_CLICK__, чтобы удалить фильтр.\n__CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__, чтобы установить фильтр для всех предметов этого типа.\n__CONTROL_KEY_CTRL__ + __CONTROL_LEFT_CLICK__, чтобы установить этот фильтр во все подходящие ячейки.\n__CONTROL_KEY_CTRL__ + __CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__, чтобы установить этот фильтр во [font=default-bold]все[/font] ячейки.\n(__CONTROL_KEY_SHIFT__ или __CONTROL_KEY_CTRL__) + __CONTROL_RIGHT_CLICK__, чтобы удалить этот фильтр из всех ячеек.
tooltip-requests=__CONTROL_LEFT_CLICK__, чтобы увеличить запрос на 1 пачку.\n__CONTROL_RIGHT_CLICK__, чтобы уменьшить запрос на 1 пачку.\n__CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__, чтобы увеличить запрос на 5 пачек.\n__CONTROL_KEY_SHIFT__ + __CONTROL_RIGHT_CLICK__, чтобы уменьшить запрос на 5 пачек.\n__CONTROL_KEY_CTRL__ + __CONTROL_LEFT_CLICK__, чтобы запросить столько, сколько вместит контейнер.\n__CONTROL_KEY_CTRL__ + __CONTROL_RIGHT_CLICK__, чтобы удалить запрос.

[mod-setting-name]
fh-default-item-on-splitter=Предмет, всегда показываемый на разделителях

[mod-setting-description]
fh-set-filter-on-inserter=Включает флажок «Использовать фильтры» при установке фильтра для манипулятора.
fh-show-only-unlocked-qualities=Машина с модулями качества не будет показывать в фильтрах результатов качества, которые ещё не исследованы.
fh-add-fuel-items=Добавляет совместимые топливные предметы и их результаты, даже если их нет среди входов и выходов.
