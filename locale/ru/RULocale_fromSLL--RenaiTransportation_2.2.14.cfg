[item-description]
RTAIZiplineControls=Этот контроллер может управлять электрической подвесной тележкой, направляя её к любому столбу линии электропередачи в энергосети. Во время движения наведите курсор на любой столб и нажмите клавишу подвесной линии, чтобы автоматически доехать туда.
RTItemShellItem=Используется для запуска стопок предметов из электромагнитной пушки для предметов.

[mod-setting-name]
RTStreamSetting=Бросаемые предметы как снаряды
RTOverflowTimeout=Тайм-аут переполнения
RTChestPop=Предметы вылетают из разрушенных сундуков/транспорта
RTVehicleCharacterKnockback=Транспорт отбрасывает игроков назад при ударе
RTPlatformLooseItems=Рассыпанные предметы на космических платформах улетают при взлёте
RTTrapdoorSetting=Включить вагоны-люки
RTItemCannonSetting=|-Включить пушки для предметов, рикошетные панели и жёлобы
MiningSpeedDebuffTime=Штраф к скорости добычи при перекрытии объектов (в секундах)
RTZiplineDisablesBotsSetting=Подвесная линия отключает персональные робопорты

[mod-setting-description]
RTStreamSetting=Бросаемые предметы отображаются как игровые объекты-снаряды - это снижает нагрузку на производительность. Если отключить, предметы будут отображаться как кувыркающиеся спрайты: это веселее и не занимает слоты игровых объектов, но сильнее нагружает систему. Изменение этого параметра удалит все предметы, находящиеся в полёте.
RTOverflowTimeout=Если предотвращение переполнения включено, это время в секундах, которое метатель будет ждать каждый раз, когда не найдёт свободное место в инвентаре, прежде чем проверить снова. Это помогает ограничить лаги от постоянной проверки свободного места.
RTChestPop=При уничтожении сундука или транспортного средства половина находящихся в нём предметов разлетается и рассыпается по земле.
RTTrapdoorSetting=Если трамплины для поездов включены, также включает переключающие трамплины.
MiningSpeedDebuffTime=После удаления объекта, который часто перекрывает другой (люки, трамплины для поездов), скорость добычи снижается на указанное время - это помогает предотвратить случайное удаление объекта, находящегося под ним.
RTZiplineDisablesBotsSetting=Определяет, будет ли посадка на подвесную линию автоматически отключать персональные робопорты. Если включено, после схода с подвесной линии настройки персональных робопортов будут восстановлены в то состояние, в котором они были до посадки.

