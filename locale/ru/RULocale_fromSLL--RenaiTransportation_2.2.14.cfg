[entity-description]
RTVacuumHatch=Люк, грубо прикреплённый к насосу. Засасывает предметы с пола в зоне 5x5 клеток перед собой и отправляет их в то, что находится позади.
RTSwitchTrainRamp=Работает как обычный трамплин для поезда, но также переключает состояние вагонов-люков, стартующих с него. Вагон-люк, переключённый таким образом, вернётся в исходное состояние после приземления.
RTSwitchTrainRamp-placer=Работает как обычный трамплин для поезда, но также переключает состояние вагонов-люков, стартующих с него. Вагон-люк, переключённый таким образом, вернётся в исходное состояние после приземления.
RTSwitchTrainRampNoSkip=Работает как обычный трамплин для поезда без пропуска остановок, но также переключает состояние вагонов-люков, стартующих с него. Вагон-люк, переключённый таким образом, вернётся в исходное состояние после приземлении.
RTMagnetSwitchTrainRamp=Работает как обычный магнитный трамплин для поезда, но также переключает состояние вагонов-люков, стартующих с него. Вагон-люк, переключённый таким образом, вернётся в исходное состояние после приземления.
RTMagnetSwitchTrainRamp-placer=Работает как обычный магнитный трамплин для поезда, но также переключает состояние вагонов-люков, стартующих с него. Вагон-люк, переключённый таким образом, вернётся в исходное состояние после приземления.
RTMagnetSwitchTrainRampNoSkip=Работает как обычный магнитный трамплин для поезда без пропуска остановок, но также переключает состояние вагонов-люков, стартующих с него. Вагон-люк, переключённый таким образом, вернётся в исходное состояние после приземления.
RTTrapdoorSwitch=Переключатель, который меняет состояние (открыт/закрыт) вагонов-люков, проезжающих над ним.
RTTrapdoorSwitch-placer=Переключатель, который меняет состояние (открыт/закрыт) вагонов-люков, проезжающих над ним.
RTTrapdoorWagon=Когда люк в этом вагоне открыт, груз выпадает через дно.
RTBeltRamp=Этот высокоскоростной наклонный конвейер непрерывно выбрасывает предметы с конца ленты. Щёлкните, чтобы переключить видимость зоны действия в Alt-режиме.
RTfastBeltRamp=Этот сверхскоростной наклонный конвейер непрерывно выбрасывает предметы с конца ленты. Щёлкните, чтобы переключить видимость зоны действия в Alt-режиме.
RTexpressBeltRamp=Этот невероятно быстрый наклонный конвейер непрерывно выбрасывает предметы с конца ленты. Щёлкните, чтобы переключить видимость зоны действия в Alt-режиме.
RTturboBeltRamp=Этот гиперскоростной наклонный конвейер непрерывно выбрасывает предметы с конца ленты. Щёлкните, чтобы переключить видимость зоны действия в Alt-режиме.
RTItemCannon=Заряжает предметы в снаряды и почти мгновенно разгоняет их до колоссальных скоростей с помощью мощных электромагнитов и сверхпроводников. Стреляет только полными стопками. Каждый выстрел расходует весь буфер энергии - перед следующим выстрелом его нужно перезарядить. Нажмите "Взаимодействовать", чтобы включить/выключить направляющий лазер пушки.
RTRicochetPanel=Отклоняет снаряды, выпущенные из электромагнитных пушек, с помощью сфокусированных импульсов заряженных магнитных полей. Каждый импульс расходует буфер энергии. Если при попадании снаряда буфер заряжен менее чем на 75 %, энергии может не хватить для безопасного отклонения.
RTCatchingChute=Ловит снаряды в полёте и помещает заключённые в них предметы в подключённый сундук.
RTMergingChute=Объединяет траектории снарядов, летящих с двух разных направлений, и перенаправляет их в один выходной порт. Если при попадании снаряда буфер заряжен менее чем на 75 %, энергии может не хватить для безопасного перенаправления.
RTDivergingChute=Снаряды, попадающие во входной порт, поочерёдно выходят через два выходных порта. Если при попадании снаряда буфер заряжен менее чем на 75 %, энергии может не хватить для безопасного перенаправления.

