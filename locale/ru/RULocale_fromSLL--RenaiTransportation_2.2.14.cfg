[mod-setting-description]
RTOverflowTimeout=Если предотвращение переполнения включено, это время в секундах, которое метатель будет ждать каждый раз, когда не найдёт свободное место в инвентаре, прежде чем проверить снова. Это помогает ограничить лаги от постоянной проверки свободного места.
RTChestPop=При уничтожении сундука или транспортного средства половина находящихся в нём предметов разлетается и рассыпается по земле.
RTTrapdoorSetting=Если трамплины для поездов включены, также включает переключающие трамплины.
RTZiplineDisablesBotsSetting=Определяет, будет ли посадка на подвесную линию автоматически отключать персональные робопорты. Если включено, после схода с подвесной линии настройки персональных робопортов будут восстановлены в то состояние, в котором они были до посадки.

