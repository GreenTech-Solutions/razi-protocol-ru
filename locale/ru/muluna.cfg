[console]
factorio-update-required=[Muluna] Похоже, вы играете в экспериментальную версию Factorio. Ранние версии 2.1.X ломают трубные соединения у построек Мулуны и некоторых других планетных модов. Авторы планетных модов на это повлиять не могут. Подробности в репозитории Muluna на GitHub: https://tinyurl.com/muluna-fluidbox\nВременное решение: разделите трубные сети с помощью [item=pump], [item=valves-overflow], [item=valves-top_up] и [item=valves-one_way].
