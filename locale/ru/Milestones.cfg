[mod-setting-description]
milestones_write_file=Если включено, времена этапов дописываются в файл milestones-MAPSEED.txt в папке вывода скриптов в машиночитаемом виде.\nВ мультиплеере файл пишется только на вашем компьютере. Чтобы писать его на выделенном сервере, используйте настройку «Записывать этапы в файл (сервер)» на вкладке «Карта».

