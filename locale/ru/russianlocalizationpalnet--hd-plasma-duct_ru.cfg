[mod-setting-name]
pink-plasma=Перекрасить индикатор плазменной трубы
duct-extend=Максимальная протяжённость плазменного канала
super-cheap=Супердешёвый режим
fusion-unlock=Разблокировать с помощью термоядерного синтеза

[mod-setting-description]
pink-plasma=Обычно плазма в трубах отображается тёмно‑синей, очень похожей на оксидизатор, что конфликтует с розовым значком плазмы. Эта настройка меняет цвет на розовый.
duct-extend=В эпохе космоса сети труб имеют максимальную протяжённость, после которой требуется насос или аналогичное устройство. По умолчанию для труб — 320. По умолчанию для плазменных каналов — 32.
super-cheap=Делает рецепты плазменных каналов чрезвычайно дешёвыми: 5 вольфрама, 5 сверхпроводников → 10 плазменных каналов. Добавлено из мода «plasma duct tweak». Не рекомендуется.
fusion-unlock=Разблокирует плазменные каналы исследованием термоядерного синтеза. Добавлено из «plasma duct tweak». Рекомендуется для тех, кто не любит прометий.

[hd-plasma-ducts]
hd-mod=Похоже, вы используете одновременно HD-plasma-ducts И старый мод plasma-ducts! Учтите, что старый мод можно отключить, так как он не нужен и может вызывать проблемы совместимости с другими модами.
