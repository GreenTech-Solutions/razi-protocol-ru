[technology-description]
s6x-void-mythril=Позволяет сотворять мифрил с помощью пустотного ремесла.
s6x-prismite-melting-ref=Использование очищенного призмита в призмоплавильне повышает выход продукта и устраняет побочные продукты.
s6x-prismite=Позволяет сотворять призмитовую руду с помощью пустотного ремесла.
s6x-prismite-melting-vc=Добавление пустотного флюса может увеличить выход продукта в призмоплавильне, но также делает реакцию более подверженной энтропии.
s6x-void-prismite-conv=Также можно использовать энтропийную энергию пустотного флюса для прямого преобразования призмитовой руды в различные другие вещества.
s6x-prismite-laser-turret=Призмит полезен для фокусировки лучевого оружия и для его питания энергией.
s6x-vulc-prismite=Жар и давление Вулкана создают условия, в которых призмит может быть выкован так, как это было на заре времён.
s6x-fulg-prismite=При воздействии мощных электромагнитных сил в подходящих условиях разный хлам Фульгоры сплавляется в призмит.
s6x-air-purification-green=Изумрудная эссенция особенно подходит для очистки воздуха.
s6x-void-runestone=Рунный камень имеет множество применений, но самое важное — он используется для ковки магических рун, усиливающих пустотное ремесло.
s6x-void-promethium=Позволяет сотворять куски прометия с помощью пустотного ремесла.
s6x-cursed-furnace=Потусторонняя печь подвергает призмит воздействию арканных энергий, заставляя его трансформироваться случайным образом. Её воздействие на мифрил более предсказуемо.
s6x-cursed-furnace-steel=Ещё более мощная потусторонняя печь, усиленная мифрилом.
s6x-void-coherence-azoth=Алхимический азот может значительно повысить эффективность производства инфузии когерентности.
s6x-iridescent-transport-belt=Ещё более быстрыыыые конвейеры.
s6x-void-belts-iridescent=Позволяет сотворять радужные конвейеры с помощью пустотного ремесла.
s6x-crystal-holder=Автоматически заменяет азуристаллы поблизости, у которых истекает срок, свежими из своего запаса.
s6x-prismtronics-blue=Изредка азуристалл годится для кристаллического процессора. К сожалению, проверка его разрушает.
s6x-verdance-fuel-advanced=Ещё более мощная концентрированная форма зелени.
s6x-azoth=Алхимический азот, так называемый «универсальный растворитель», полезен для различных (ал)химических процессов.
s6x-air-purification-azoth=Способность алхимического азота растворять почти всё делает его очень полезным для очистки.

