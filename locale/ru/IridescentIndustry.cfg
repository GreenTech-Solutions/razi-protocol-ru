s6x-ii-fulgora-prismite-src=Призмит на Фульгоре берётся из...
s6x-ii-lds-prismite=Литьё конструкций малой плотности требует призмита
s6x-prismite-rocket-solid-fuel=Призмитовое ракетное топливо использует твёрдое топливо
s6x-ii-prismorphing-mode=Рецепты призморфинга

[mod-setting-description]
s6x-location-unlock=Снимает большинство ограничений поверхностей в Space Age, позволяя строить или создавать почти всё почти везде.
s6x-ii-logistics-5=Определяет, добавляет ли этот мод 5-й уровень конвейеров. Возможно, стоит отключить это, если у вас уже есть другой мод для этой цели.
s6x-prismvoidtronics-revert=Восстанавливает предыдущий рецепт квантовой призмопустотроники. Не имеет эффекта без включённой обработки прометия.
s6x-ii-lds-prismite=Определяет, требуется ли очищенный призмит для литья конструкций малой плотности в литейной.
s6x-prismite-rocket-solid-fuel=Призмитовое ракетное топливо обычно требует очищенного призмита. Этот рецепт заменит его на твёрдое топливо. Настройка игнорируется при использовании Voidcraft с деревом технологий Voidcraft.
s6x-colored-concrete=Создаёт технологию и рецепты для цветного бетона.
s6x-colored-concrete-flatten-transitions=Разные цвета бетона будут соединяться напрямую вместо использования переходов. Настройка не работает, если цветной бетон не включён.
s6x-ii-prismorphing-mode=Определяет, использовать ли старые (0.7 и ранее) или новые рецепты призморфинга. Переходный режим включает оба набора рецептов, чтобы вы могли перестроить базу без поломок, но он не сбалансирован и не предназначен для долгой игры.
s6x-ii-azoth=Добавляет алхимический азот — жидкость, которую можно перерабатывать и использовать повторно, подобно фторкетону из Space Age или грязной воде из Krastorio.

[string-mod-setting]
s6x-ii-fulgora-prismite-src-scrap=Металлолом
