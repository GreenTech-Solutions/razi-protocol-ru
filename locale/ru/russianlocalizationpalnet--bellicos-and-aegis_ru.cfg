bellicos-milestone-1=Пройти 100 000 км по направлению к ближней орбите Белликоса.
bellicos-milestone-2=Достичь половины пути к ближней орбите Белликоса. Возможно, стоит повернуть назад, пока еще есть возможность.
research-with-lightweight=Исследовать технологию, используя облегченные научные пакеты.
research-with-pulsar=Исследовать технологию, используя научные пакеты пульсара.

[mod-setting-name]
make-promethium-require-new-packs=Требовать новые пакеты для прометиевой науки
radioactive-ice-fizzle-out-time=Время распада радиоактивного льда (с)
take-value-from-gleba=Перенести производительность астероидов в Эгиду
ae-alt-pack-sprites=Альтернативные спрайты научных пакетов
make-railgun-upgrades-require-new-packs=Требовать новые пакеты для бесконечных улучшений рельсотрона 
add-value-to-fulgora=Требовать электромагнитные пакеты для исследования РИТЭГов
stargate-solar-power=Ожидаемая солнечная энергия вблизи звездных врат

[mod-setting-description]
make-promethium-require-new-packs=Теперь и прометиевая наука, и бесконечная производительность технологий требуют облегченных пакетов и пакетов пульсара.
radioactive-ice-fizzle-out-time=В секундах; значение намеренно очень низкое, его не рекомендуется понижать.  
take-value-from-gleba=Производительность астероидов больше не требует сельскохозяйственных научных пакетов с Глебы. Вместо этого используются облегченные научные пакеты.
ae-alt-pack-sprites=Если включено, новые научные пакеты будут использовать более выразительные спрайты, взятые из спрайта «Качественная стеклянная посуда».\nТекущие спрайты: [img=item/space-logistic-science-pack][img=item/pulsar-science-pack]
make-railgun-upgrades-require-new-packs=Скорость стрельбы рельсотрона теперь требует облегченных научных пакетов.\nУрон рельсотрона теперь требует научных пакетов пульсара. 
add-value-to-fulgora=Исследование РИТЭГов требует ЭМ-пакетов с Фульгоры. Кроме того, РИТЭГи должны создаваться на ЭМ-заводах.
stargate-solar-power=[font=default-semibold]Очень низкая энергия[/font] : всего 1% солнечной энергии в космосе возле звездных врат и на их маршруте, максимальная сложность. Реальный шанс застрять, если полагаться только на солнечную энергию.\n[font=default-semibold]Низкая энергия[/font] : 10% солнечной энергии в космосе возле звездных врат и на их маршруте, средняя сложность\n[font=default-semibold]Зависимость от местоположения[/font] : устанавливает солнечную энергию возле звездных врат в зависимости от их расстояния до звезд, самая легкая сложность.
