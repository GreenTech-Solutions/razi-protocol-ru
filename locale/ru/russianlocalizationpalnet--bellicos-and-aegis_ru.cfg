[entity-description]
tritium-RTG=Радиоизотопный термоэлектрический генератор. Производит небольшое, но стабильное количество энергии независимо от условий окружающей среды. 

[technology-description]
discovery-aegis-outer=Вблизи орбитального пути Глебы был обнаружен некий высокотехнологичный крупномасштабный портал, который, по всей видимости, ведет к другому порталу далеко за пределами вашей родной звездной системы. На той стороне находится большой пояс астероидов, частично состоящий из плотных бериллиновых астероидов, вращающихся вокруг небольшого, но очень сильного гравитационного колодца.\nКорабли, которые вы отправите туда, должны быть готовы к повышенной плотности и прочности астероидов.
discovery-aegis-inner=Даже при навигации по самым безопасным маршрутам плотность астероидов внутри пояса очень высока. Чем ближе ваш корабль к внутренней части пояса, тем меньше он защищен от ионизированных струй льда, создаваемых высокоэнергетическими импульсами объекта, который, по всей видимости, является пульсаром.\nЕсли вы попытаетесь прорваться, ваш корабль должен быть вооружен более мощными боеприпасами и лазерами для испарения ионизированного льда.
discovery-bellicos=Вы точно определили местоположение гравитационного колодца этой системы, и это действительно оказался пульсар. Точное знание его координат позволяет «безопасно» приблизиться для сбора материалов; однако он окружен медленно формирующимся аккреционным диском, и сближение с ним может быстро создать проблемы. Астероиды также могут начать двигаться непредсказуемо вблизи орбиты пульсара.\nТолько корабли с оружием высшего уровня должны пытаться совершить это путешествие.
discovery-aegis-warden=Глубокое исследование Эгиды открыло вам доступ к Точке Стража — скоплению астероидов высокой плотности, расположенному за массивным бериллиновым астероидом. Эта область полна больших бериллиновых астероидов, но здесь почти нет воздействия Белликоса, что означает меньше ионизированных астероидов и солнечной энергии.\nКорабли-сборщики, отправляющиеся туда, должны быть вооружены оружием, способным уничтожать большие астероиды, и не должны слишком полагаться на солнечную энергию.
pulsar-science-pack=Более продвинутые применения трития
space-logistic-science-pack=Более продвинутые применения бериллия
beryllium-processing=Позволяет покрывать железные и медные компоненты бериллием.
beryllium-solar-panel=Более крупный и эффективный вариант солнечной панели из бериллия, также значительно более прочный.
space-beryllium-logistic=Замена важных железных деталей обычных конвейеров на детали с бериллиевым покрытием и их размещение в условиях низкой гравитации позволяет им работать еще быстрее без риска высокого износа механизмов.
lightweight-inserters=Повышенная теплоемкость механических компонентов позволяет манипуляторам работать быстрее, однако они не могут переносить столько же груза.
beryllium-LDS=
space-beryllium-underground-pipe=Подземные трубы, модифицированные для более эффективного совмещения с космическими платформами, что позволяет расширять их с помощью бериллия.
beryllium-liquid-tank=нет.
lightweight-arsenal=Более легкие и компактные бериллиевые боеприпасы; они летят дальше и быстрее при примерно той же летальности, что и обычные боеприпасы.
tungsten-lightweight-arsenal=Использование вольфрамовой стали в качестве сердечника бериллиевых пуль, ракет и пушечных снарядов делает их еще более мощными, сохраняя преимущество в размере и весе.
tritium-extraction=Ионизированный лед содержит редкие изотопы, которые могут оказаться полезными при выделении.
low-grade-fusion=Открывает доступ к базовому термоядерному синтезу с помощью [item=low-grade-fusion-reactor]базового термоядерного реактора, который потребляет фиксированное количество термоядерного топлива для нагрева объема [fluid=steam]пара]. Его эффективность растет при понижении температуры входящего пара (до 80% КПД при 15°C [fluid=steam]пара]), а также [item=high-temp-steam-turbine]высокотемпературной паровой турбины, способной работать с более высокой температурой [fluid=steam]пара].
low-grade-fusion-thrust=Управляемый синтез трития может превратить горячий пар в плазму. Выброс этой высокоэнергетической плазмы создает огромную тягу. Для работы этого механизма пар должен поддерживаться в диапазоне от 500°C до 1200°C.
high-grade-fusion-thrust=Оснастив [entity=steam-thruster-TT] внутренней системой активного охлаждения и материалами, выдерживающими более высокие температуры, можно использовать гораздо более мощное топливо: [fluid=helium-thruster-fuel]тритиево-гелиевое топливо], создавая еще большую тягу. Для работы двигателя требуется точный контроль температуры пара в диапазоне от 800°C до 1000°C.
tritium-fusion-fuel=Базовое термоядерное топливо из трития, работает в любом термоядерном реакторе.
tritium-RTG=Использование энергии естественного радиоактивного распада трития.
helium-production=Энергетическая стимуляция и очень медленное принуждение трития к синтезу с другими материалами позволяют производить гелий в небольших количествах.
circuit-productivity-helium=Прецизионная сборка в герметичной атмосфере позволяет производить схемы более эффективно, особенно сложные.
quantum-processor-helium=Гелий является идеальной средой для предотвращения помех в квантовых процессах, что позволяет создавать квантовые чипы с меньшим количеством материалов.
space-plateform-productivity=
advanced-thruster-fuel-productivity=
nuclear-isotope-extraction-productivity=

