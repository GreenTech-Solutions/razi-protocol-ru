[space-location-description]
bellicos-orbit=Внутри формирующегося аккреционного диска, почти недоступно, экстремальные условия.
aegis-inner-edge=За поясом астероидов, но перед формирующимся аккреционным диском; относительно спокойная зона по сравнению с путем, который нужно проделать, чтобы туда попасть.
aegis-outer-edge=Относительно безопасная зона на внешнем крае пояса астероидов Эгида. Здесь среди прочих объектов можно найти несколько бериллиновых астероидов.
aegis-warden=Внутри Эгиды находится массивное скопление астероидов, защищенное от ионизированных струй Белликоса гигантским бериллиновым астероидом. Пребывание здесь опасно из-за огромной плотности астероидов и нехватки солнечной энергии.
calidus-bellicos-stargate-bellicos=Технология Предтеч. Эти червоточинные врата позволяют космическим кораблям быстро перемещаться между удаленными локациями.\nЭти врата расположены за пределами Эгиды, на безопасном расстоянии от Белликоса. Они ведут обратно на Калидус.

