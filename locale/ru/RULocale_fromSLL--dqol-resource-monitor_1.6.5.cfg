[dqol-resource-monitor]
ui-site-area-tooltip=Выбрать или изменить область месторождения
ui-site-area-caption=Измените область этого месторождения - например, если ресурсы перемещены в другое место. Если нужно объединить месторождения, используйте инструмент объединения. Удерживайте SHIFT (= добавить) и CTRL (= вычесть) для смены режима инструмента. Примечание: месторождения всегда включают все ресурсы в выбранных чанках карты. Внимание: это действие необратимо, кроме как через сброс данных всей поверхности.
ui-site-archived-tooltip=Архивировать месторождение
ui-menu-other-sites-add=Добавить месторождение (для ручного редактирования)
ui-print-now-empty=Месторождение __1__ пусто, но всё ещё отслеживается - вы можете архивировать месторождение!
ui-print-area-tool-set=Новая область для месторождения №__1__ __2__
ui-print-area-tool-add=Добавлена новая область к месторождению №__1__ __2__
ui-print-area-tool-sub=Удалена область у месторождения №__1__ __2__
ui-print-area-tool-fail-surface=Ошибка инструмента области: нельзя сменить поверхность для месторождения №__1__ __2__
ui-print-area-tool-fail-resources=Ошибка инструмента области: не выбраны допустимые ресурсы для месторождения №__1__ __2__
