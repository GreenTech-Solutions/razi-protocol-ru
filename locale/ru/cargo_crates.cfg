[technology-description]
cargo-crates=Открывает одноразовые деревянные грузовые ящики, позволяющие плотно упаковывать предметы для транспортировки и распаковывать их при необходимости. Благодаря компактной упаковке предметы в ящиках занимают в ракете вдвое меньше места, чем обычно.
TFMG-cargo-crates=Подумайте о более эффективной упаковке предметов.

[mod-setting-description]
cargo-crates-pack-capsules=Разрешить упаковывать в ящики предметы типа «капсула». Отключение этой настройки уменьшит количество генерируемых предметов и рецептов.\nУчтите: съедобные предметы тоже считаются капсулами

