[mod-setting-name]
rci-silo-recipes=Разные рецепты для ракетных шахт
rci-processing-unit=Блок управления ракетой
rci-low-density-structure=Секция ракетного каркаса
rci-rocket-fuel=Гипергольная смесь

[mod-setting-description]
rci-silo-recipes=Позволяет задать отдельный рецепт для каждой ракетной шахты. Это значит, что новые компоненты нужны, только если они требуются этой шахте. Эта настройка не используется в режиме «Прокси-контейнер».
rci-processing-unit=Добавляет блоки управления ракетой, создаваемые из процессоров. Эта настройка не используется в режиме «Прокси-контейнер».
rci-low-density-structure=Добавляет секции ракетного каркаса, создаваемые из конструкций малой плотности. Эта настройка не используется в режиме «Прокси-контейнер».
rci-rocket-fuel=Добавляет гипергольную смесь, создаваемую из ракетного топлива. Эта настройка не используется в режиме «Прокси-контейнер».

